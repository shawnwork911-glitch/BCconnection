<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Central Portal</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#d8dde4; --accent:#0b5cad; --text:#1f2430; --muted:#6b7280; --danger:#b3261e; --warn-bg:#fff4e5; --warn:#8a4b00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:.7rem 1rem; display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0; flex:1; }
  header select, header button { padding:.4rem .7rem; }
  header select { width:auto; margin:0; }
  #status { margin:.75rem 1rem; padding:.6rem .8rem; background:#e9edf2; border-radius:6px; }
  #status.err  { background:#fdecea; color:#8a1c12; }
  #status.ok   { background:#e6f4ea; color:#14532d; }
  #status.warn { background:var(--warn-bg); color:var(--warn); }
  main { padding:0 1rem 2rem; max-width:1200px; margin:0 auto; }
  nav { display:flex; gap:.25rem; flex-wrap:wrap; border-bottom:2px solid var(--line); margin-bottom:1rem; }
  nav button { background:none; border:none; padding:.6rem 1rem; cursor:pointer; font-size:.95rem; border-bottom:3px solid transparent; margin-bottom:-2px; color:var(--text); border-radius:0; }
  nav button.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  .card h2 { margin:0 0 .75rem; font-size:1rem; }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.75rem; align-items:end; }
  label { display:block; font-size:.8rem; color:var(--muted); }
  label.chk { display:inline-flex; align-items:center; gap:.3rem; color:var(--text); font-size:.85rem; margin:0 .9rem .4rem 0; }
  input, select { width:100%; padding:.5rem; margin-top:.2rem; border:1px solid var(--line); border-radius:4px; font-size:.9rem; font-family:inherit; }
  input[type=checkbox] { width:auto; margin:0 .3rem 0 0; }
  button { padding:.5rem 1rem; cursor:pointer; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-family:inherit; }
  button.ghost { background:#fff; color:var(--accent); }
  button.danger { background:#fff; color:var(--danger); border-color:var(--danger); }
  button.small { padding:.25rem .6rem; font-size:.8rem; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.85rem; }
  th, td { border-bottom:1px solid var(--line); padding:.4rem .6rem; text-align:left; white-space:nowrap; }
  th { background:#f0f3f6; }
  td.num { text-align:right; }
  td.low { color:var(--danger); font-weight:600; }
  td.wrap { white-space:normal; min-width:180px; max-width:280px; }
  table.lines td { padding:.25rem .4rem; }
  table.lines input { margin:0; padding:.35rem .45rem; }
  table.lines td:first-child { width:60%; }
  .progress { font-size:.8rem; line-height:1.35; color:var(--muted); }
  .progress .done { color:#14532d; }
  .pager { justify-content:flex-end; }
  .muted { color:var(--muted); }
  .small { font-size:.8rem; }
  .row-actions { display:flex; gap:.5rem; margin-top:.75rem; flex-wrap:wrap; align-items:center; }
  .hidden { display:none !important; }
  code { background:#f0f3f6; padding:.1rem .3rem; border-radius:3px; }
  .tag { display:inline-block; font-size:.75rem; padding:.1rem .45rem; border-radius:10px; background:#eef2f6; color:var(--muted); margin:0 .25rem .15rem 0; white-space:nowrap; }
  .tag.warn { background:var(--warn-bg); color:var(--warn); }
  .tag.ok { background:#e6f4ea; color:#14532d; }
  /* search box */
  .ta { position:relative; }
  .ta-list { position:absolute; z-index:30; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.12); max-height:280px; overflow:auto; margin-top:2px; }
  .ta-opt { padding:.45rem .6rem; cursor:pointer; font-size:.85rem; color:var(--text); border-bottom:1px solid #f0f2f5; }
  .ta-opt:hover, .ta-opt.active { background:#e8f0fb; }
  .ta-empty { padding:.5rem .6rem; font-size:.85rem; color:var(--muted); }
  .party-info { font-size:.85rem; line-height:1.45; margin-top:.5rem; padding:.5rem .7rem; background:#f7f9fb; border:1px solid var(--line); border-radius:6px; }
  .party-info:empty { display:none; }
  /* item blocks */
  .block { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:.75rem; margin-bottom:.75rem; background:#fcfdfe; }
  .block-head { display:flex; gap:.75rem; align-items:end; margin-bottom:.6rem; }
  .block-head .grow { flex:1; }
  .sub { font-size:.8rem; color:var(--muted); margin:.7rem 0 .3rem; font-weight:600; }
  .periods { margin-bottom:.4rem; }
  .fx { border:1px dashed var(--line); border-radius:6px; padding:.75rem; margin:.75rem 0; }
  .fx h2 { font-size:.9rem; }
  @media (max-width:640px) { .block-head { flex-wrap:wrap; } }
</style>
</head>
<body>

<header>
  <h1>Business Central Portal</h1>
  <select id="company" class="hidden" title="Company"></select>
  <button id="btnLogin">Sign in with Microsoft</button>
  <button id="btnLogout" class="hidden">Sign out</button>
</header>

<div id="status">Not signed in.</div>

<main id="app" class="hidden">
  <nav id="tabs"></nav>
  <div id="panels"></div>
</main>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
  window.msal || document.write('<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"><\/script>');
</script>
<script>
  window.msal || document.write('<script src="msal-browser.min.js"><\/script>');
</script>
<!-- PO presets (edit presets.js, not this file) -->
<script src="presets.js"></script>
<script>
/* ============ CONFIGURE THESE ============ */
const CONFIG = {
  clientId:    "9cfe8c4d-e0fb-4372-a7c1-6300aac80fbd",
  tenantId:    "ab7c8c1e-dc1d-431f-ba8b-e4de2b047f8b",
  environment: "Production",   // <- your BC environment name
  redirectUri: window.location.origin + window.location.pathname,

  // Portal is "draft only": no posting buttons, no Approvals tab.
  // Set to true to bring them back (the code is still below).
  features: { posting: false, approvals: false },

  // Saxon Portal API extension (sets VAT Bus. Posting Group on PO lines).
  // Leave publisher blank to switch it off.
  lineExtApi: { publisher: "saxon", group: "portal", version: "v1.0", entity: "purchaseLineExts" },

  // Approvals need their own custom API page (only used if features.approvals = true).
  approvalApi: {
    publisher: "", group: "portal", version: "v1.0", entity: "approvalEntries",
    approveAction: "approve", rejectAction: "reject"
  },
  lowStockThreshold: 10         // inventory at or below this is highlighted
};
/* ======================================== */

const statusBox = document.getElementById("status");
function setStatus(msg, kind) { statusBox.textContent = msg; statusBox.className = kind || ""; }

window.addEventListener("error", e => setStatus("Script error: " + e.message, "err"));
if (typeof msal === "undefined") {
  setStatus("The Microsoft sign-in library did not load (blocked network, ad blocker, or no internet).", "err");
  throw new Error("msal library missing");
}

/* ---------- presets ---------- */
const PRESET_CFG = window.PORTAL_PRESETS || { presets: [] };
const PRESETS = (PRESET_CFG.presets || []).map(p => ({
  ...(PRESET_CFG.defaults || {}), ...p,
  dimensions: { ...((PRESET_CFG.defaults || {}).dimensions || {}), ...(p.dimensions || {}) }
}));
function companyName() {
  const sel = document.getElementById("company");
  return sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : "";
}
function companyGroup() {
  const name = companyName();
  const g = (PRESET_CFG.companyGroups || []).find(x => new RegExp(x.match, "i").test(name));
  return g ? g.group : null;
}
function presetsForCompany() {
  const g = companyGroup();
  return PRESETS.filter(p => p.active !== false && (!g || !p.group || p.group === g));
}

const BC_SCOPE = ["https://api.businesscentral.dynamics.com/Financials.ReadWrite.All"];
const BC_ROOT  = `https://api.businesscentral.dynamics.com/v2.0/${CONFIG.tenantId}/${CONFIG.environment}/api`;
const BC_BASE  = `${BC_ROOT}/v2.0`;

const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: CONFIG.redirectUri
  },
  cache: { cacheLocation: "sessionStorage" }
});

let account = null;
let companyId = null;

/* ---------- auth ---------- */
async function login() {
  try {
    setStatus("Redirecting to Microsoft sign-in...");
    await msalApp.loginRedirect({ scopes: BC_SCOPE });
  } catch (e) { setStatus("Login failed: " + e.message, "err"); }
}
function logout() { msalApp.logoutRedirect({ account }); }

async function getToken() {
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: BC_SCOPE, account });
    return r.accessToken;
  } catch (e) {
    await msalApp.acquireTokenRedirect({ scopes: BC_SCOPE });
    throw new Error("Re-authenticating...");
  }
}

/* ---------- BC calls ---------- */
function niceError(text) {
  try { return JSON.parse(text).error.message; } catch { return text; }
}
async function bcFetch(url, options = {}) {
  const token = await getToken();
  const res = await fetch(url, {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/json",
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!res.ok) throw new Error(`BC ${res.status}: ${niceError(await res.text())}`);
  return res.status === 204 ? null : res.json();
}
const bc = (path, options) => bcFetch(BC_BASE + path, options);
const co = (path, options) => bc(`/companies(${companyId})${path}`, options);

/* read every page of a list (follows @odata.nextLink); retries without $select if BC rejects it */
async function coAll(path) {
  async function run(p) {
    let url = `${BC_BASE}/companies(${companyId})${p}`;
    const out = [];
    while (url) { const d = await bcFetch(url); out.push(...d.value); url = d["@odata.nextLink"]; }
    return out;
  }
  try { return await run(path); }
  catch (e) {
    if (!path.includes("$select")) throw e;
    return run(path.replace(/[?&]\$select=[^&]*/, "").replace(/^([^?]*)&/, "$1?"));
  }
}

/* ---------- cached lookups (per company) ---------- */
const cache = {};
function cached(key, loader) {
  if (!cache[key]) cache[key] = loader().catch(e => { delete cache[key]; throw e; });
  return cache[key];
}
function clearCache(prefix) { Object.keys(cache).forEach(k => { if (!prefix || k.startsWith(prefix)) delete cache[k]; }); }
const lookups = {
  vendors:    () => cached("vendors",    () => coAll("/vendors?$select=id,number,displayName,addressLine1,addressLine2,city,postalCode,country,email,phoneNumber,currencyCode,blocked")),
  customers:  () => cached("customers",  () => coAll("/customers?$select=id,number,displayName,addressLine1,addressLine2,city,postalCode,country,email,phoneNumber,currencyCode,blocked")),
  items:      () => cached("items",      () => coAll("/items?$select=id,number,displayName,type,baseUnitOfMeasureCode,blocked")),
  locations:  () => cached("locations",  () => coAll("/locations?$select=id,code,displayName")),
  dimensions: () => cached("dimensions", () => coAll("/dimensions?$select=id,code,displayName"))
};

/* ---------- Saxon Portal API extension ---------- */
const extState = {};   // companyId -> Promise<boolean>
function extBase() {
  const a = CONFIG.lineExtApi;
  return `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/${a.entity}`;
}
function lineExtAvailable() {
  if (!CONFIG.lineExtApi.publisher) return Promise.resolve(false);
  if (!(companyId in extState)) extState[companyId] = bcFetch(extBase() + "?$top=1").then(() => true, () => false);
  return extState[companyId];
}

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => el.append(c instanceof Node ? c : document.createTextNode(c ?? "")));
  return el;
}

/* cols: [key,label]; extraCols: [{label, render(row) -> Node}] */
function renderTable(box, cols, rows, extraCols = [], opts = {}) {
  box.replaceChildren();
  if (!rows.length) { box.append(h("p", { class: "muted" }, "No records.")); return; }
  box.append(h("table", {},
    h("thead", {}, h("tr", {}, cols.map(c => h("th", {}, c[1])), extraCols.map(c => h("th", {}, c.label)))),
    h("tbody", {}, rows.map(r => h("tr", {},
      cols.map(c => {
        const cls = [];
        if (typeof r[c[0]] === "number") cls.push("num");
        if (opts.cellClass) { const x = opts.cellClass(r, c[0]); if (x) cls.push(x); }
        return h("td", { class: cls.join(" ") }, r[c[0]] ?? "");
      }),
      extraCols.map(c => h("td", {}, c.render(r)))
    )))
  ));
}

/* ---------- live keyword search box ----------
   Type any part of the number, name or city; all words must match. */
function searchBox({ placeholder, source, onPick, extra }) {
  const input = h("input", { type: "text", placeholder, autocomplete: "off", spellcheck: "false" });
  const list = h("div", { class: "ta-list hidden" });
  const el = h("div", { class: "ta" }, input, list);
  let rows = [], active = -1, picked = null, timer = null;

  const hay = r => [r.number, r.displayName, r.city].filter(Boolean).join(" ").toLowerCase();
  function hide() { list.classList.add("hidden"); active = -1; }
  function pick(r) {
    picked = r; input.value = r.number; hide();
    if (onPick) onPick(r);
  }
  function draw() {
    if (document.activeElement !== input) { hide(); return; }
    list.replaceChildren(...(rows.length
      ? rows.map((r, i) => h("div", {
          class: "ta-opt" + (i === active ? " active" : ""),
          onmousedown: e => { e.preventDefault(); pick(r); }
        }, h("b", {}, r.number), " — ", r.displayName || "",
           r.city ? h("span", { class: "muted" }, " · " + r.city) : "",
           extra && extra(r) ? h("span", { class: "muted" }, " · " + extra(r)) : ""))
      : [h("div", { class: "ta-empty" }, "No match.")]));
    list.classList.remove("hidden");
  }
  async function update() {
    if (document.activeElement !== input) return;
    const tokens = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    list.replaceChildren(h("div", { class: "ta-empty" }, "Loading..."));
    list.classList.remove("hidden");
    let data;
    try { data = await source(); }
    catch (e) { list.replaceChildren(h("div", { class: "ta-empty" }, "Could not load list: " + e.message)); return; }
    if (document.activeElement !== input) { hide(); return; }
    rows = (tokens.length ? data.filter(r => { const s = hay(r); return tokens.every(t => s.includes(t)); }) : data).slice(0, 30);
    active = rows.length ? 0 : -1;
    draw();
  }
  async function resolveExact() {
    const v = input.value.trim().toLowerCase();
    if (!v || (picked && picked.number.toLowerCase() === v)) return;
    try {
      const r = (await source()).find(x => (x.number || "").toLowerCase() === v);
      if (r && input.value.trim().toLowerCase() === v) { picked = r; if (onPick) onPick(r); }
    } catch {}
  }

  input.addEventListener("input", () => {
    if (picked) { picked = null; if (onPick) onPick(null); }
    clearTimeout(timer); timer = setTimeout(update, 150);
  });
  input.addEventListener("focus", update);
  input.addEventListener("blur", () => { clearTimeout(timer); setTimeout(() => { hide(); resolveExact(); }, 120); });
  input.addEventListener("keydown", e => {
    if (list.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, rows.length - 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); draw(); }
    else if (e.key === "Enter" && active >= 0 && rows[active]) { e.preventDefault(); pick(rows[active]); }
    else if (e.key === "Escape") hide();
  });

  return {
    el, input,
    get value() { return input.value.trim(); },
    set(v) { input.value = v || ""; picked = null; if (v) resolveExact(); },
    clear() { input.value = ""; picked = null; if (onPick) onPick(null); }
  };
}

/* ---------- definitions ---------- */
const MASTER = {
  items: {
    title: "Part Numbers (Items)", singular: "item", endpoint: "items",
    fields: [
      { key: "number", label: "Part no. (blank = auto)" },
      { key: "displayName", label: "Description", required: true },
      { key: "type", label: "Type", options: ["Inventory", "Service", "Non-Inventory"] },
      { key: "baseUnitOfMeasureCode", label: "Unit of measure (e.g. PCS)" },
      { key: "unitPrice", label: "Unit price", type: "number" },
      { key: "unitCost", label: "Unit cost", type: "number" }
    ],
    columns: [["number","Part no."],["displayName","Description"],["type","Type"],["baseUnitOfMeasureCode","UoM"],["unitPrice","Unit price"],["inventory","Inventory"]]
  },
  vendors: {
    title: "Suppliers (Vendors)", singular: "supplier", endpoint: "vendors",
    fields: [
      { key: "number", label: "Supplier ID (blank = auto)" },
      { key: "displayName", label: "Name", required: true },
      { key: "email", label: "Email", type: "email" },
      { key: "phoneNumber", label: "Phone" },
      { key: "addressLine1", label: "Address" },
      { key: "city", label: "City" },
      { key: "postalCode", label: "Postal code" },
      { key: "country", label: "Country code (e.g. MY)" }
    ],
    columns: [["number","Supplier ID"],["displayName","Name"],["email","Email"],["phoneNumber","Phone"],["city","City"]]
  },
  customers: {
    title: "Customers", singular: "customer", endpoint: "customers",
    fields: [
      { key: "number", label: "Customer ID (blank = auto)" },
      { key: "displayName", label: "Name", required: true },
      { key: "email", label: "Email", type: "email" },
      { key: "phoneNumber", label: "Phone" },
      { key: "addressLine1", label: "Address" },
      { key: "city", label: "City" },
      { key: "postalCode", label: "Postal code" },
      { key: "country", label: "Country code (e.g. MY)" }
    ],
    columns: [["number","Customer ID"],["displayName","Name"],["email","Email"],["phoneNumber","Phone"],["city","City"]]
  }
};

const ORDERS = {
  po: {
    title: "Purchase Orders", endpoint: "purchaseOrders", linesEndpoint: "purchaseOrderLines",
    partyKey: "vendorNumber", partyLabel: "Supplier", partyLookup: "vendors",
    priceKey: "directUnitCost", priceLabel: "Unit cost",
    extKey: null,
    postAction: "receiveAndInvoice",
    stepLabel: "Receive", stepVerb: "receive", stepPast: "received",
    stepQtyKey: "receiveQuantity",
    doneQtyKey: "receivedQuantity",
    columns: [["number","PO no."],["vendorNumber","Supplier"],["vendorName","Name"],["orderDate","Date"],["status","Status"],["totalAmountIncludingTax","Total"]]
  },
  so: {
    title: "Sales Orders", endpoint: "salesOrders", linesEndpoint: "salesOrderLines",
    partyKey: "customerNumber", partyLabel: "Customer", partyLookup: "customers",
    priceKey: "unitPrice", priceLabel: "Unit price",
    extKey: "externalDocumentNumber", extLabel: "Customer PO no. (optional)",
    postAction: "shipAndInvoice",
    stepLabel: "Ship", stepVerb: "ship", stepPast: "shipped",
    stepQtyKey: "shipQuantity",
    doneQtyKey: "shippedQuantity",
    columns: [["number","SO no."],["customerNumber","Customer"],["customerName","Name"],["orderDate","Date"],["status","Status"],["totalAmountIncludingTax","Total"]]
  }
};

const TABS = [
  { id: "items",     label: "Part Number", build: () => buildMaster("items") },
  { id: "vendors",   label: "Supplier",    build: () => buildMaster("vendors") },
  { id: "customers", label: "Customer",    build: () => buildMaster("customers") },
  { id: "inventory", label: "Inventory",   build: () => buildInventory() },
  { id: "po",        label: "Purchase Order", build: () => buildOrder("po") },
  { id: "so",        label: "Sales Order",    build: () => buildOrder("so") },
  { id: "approvals", label: "Approvals",   build: () => buildApprovals(), when: () => CONFIG.features.approvals }
].filter(t => !t.when || t.when());
const refreshers = {};   // tab id -> function that reloads its list

/* ---------- master data tab ---------- */
function buildMaster(key) {
  const def = MASTER[key];
  const listBox = h("div", { class: "tablewrap" });

  const fieldEls = def.fields.map(f => {
    const input = f.options
      ? h("select", { name: f.key }, h("option", { value: "" }, "(default)"), f.options.map(o => h("option", { value: o }, o)))
      : h("input", { name: f.key, type: f.type || "text", required: !!f.required, step: f.type === "number" ? "any" : undefined });
    return h("label", {}, f.label, input);
  });
  const btn = h("button", { type: "submit" }, "Create " + def.singular);
  const form = h("form", { class: "grid" }, fieldEls, btn);

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const body = {};
    def.fields.forEach(f => {
      let v = form.elements[f.key].value.trim();
      if (v === "") return;
      body[f.key] = f.type === "number" ? Number(v) : v;
    });
    btn.disabled = true; setStatus("Creating " + def.singular + "...");
    try {
      const rec = await co(`/${def.endpoint}`, { method: "POST", body: JSON.stringify(body) });
      setStatus(`Created ${def.singular} ${rec.number} - ${rec.displayName}`, "ok");
      form.reset();
      clearCache(def.endpoint);
      refresh();
    } catch (e) { setStatus("Error: " + e.message, "err"); }
    finally { btn.disabled = false; }
  });

  async function refresh() {
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      const data = await co(`/${def.endpoint}?$top=50&$orderby=lastModifiedDateTime desc`);
      renderTable(listBox, def.columns, data.value);
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load list: " + e.message)); }
  }
  refreshers[key] = refresh;

  return h("div", {},
    h("div", { class: "card" }, h("h2", {}, "Create " + def.singular), form),
    h("div", { class: "card" }, h("h2", {}, "Latest " + def.title),
      h("div", { class: "row-actions" }, h("button", { type: "button", class: "ghost", onclick: refresh }, "Refresh")),
      listBox)
  );
}

/* ---------- inventory tab ---------- */
function buildInventory() {
  const listBox = h("div", { class: "tablewrap" });
  const search = h("input", { type: "search", placeholder: "Search part no. or description" });
  const onlyInv = h("input", { type: "checkbox", checked: true });
  const lowOnly = h("input", { type: "checkbox" });
  const count = h("span", { class: "muted" });
  let all = [];

  const cols = [["number","Part no."],["displayName","Description"],["inventory","Inventory"],
                ["baseUnitOfMeasureCode","UoM"],["unitCost","Unit cost"],["unitPrice","Unit price"],["type","Type"]];

  function draw() {
    const q = search.value.trim().toLowerCase();
    const rows = all.filter(r =>
      (!onlyInv.checked || r.type === "Inventory") &&
      (!lowOnly.checked || (Number(r.inventory) || 0) <= CONFIG.lowStockThreshold) &&
      (!q || (r.number || "").toLowerCase().includes(q) || (r.displayName || "").toLowerCase().includes(q)));
    renderTable(listBox, cols, rows, [], {
      cellClass: (r, k) => k === "inventory" && r.type === "Inventory" && (Number(r.inventory) || 0) <= CONFIG.lowStockThreshold ? "low" : ""
    });
    count.textContent = `${rows.length} of ${all.length} items`;
  }
  search.addEventListener("input", draw);
  onlyInv.addEventListener("change", draw);
  lowOnly.addEventListener("change", draw);

  async function refresh() {
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      const data = await co(`/items?$top=2000&$orderby=number`);
      all = data.value;
      draw();
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load inventory: " + e.message)); }
  }
  refreshers.inventory = refresh;

  return h("div", {},
    h("div", { class: "card" }, h("h2", {}, "Inventory on hand"),
      h("div", { class: "grid" },
        h("label", {}, "Search", search),
        h("label", { class: "chk" }, onlyInv, "Inventory-type items only"),
        h("label", { class: "chk" }, lowOnly, `Low stock only (≤ ${CONFIG.lowStockThreshold})`),
        h("button", { type: "button", class: "ghost", onclick: refresh }, "Refresh")),
      h("div", { class: "row-actions" }, count)),
    h("div", { class: "card" }, listBox)
  );
}

/* ---------- period helpers ---------- */
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONTH_NAMES = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const round5 = n => Math.round(n * 1e5) / 1e5;
function longDate(iso) {             // "2026-09-30" -> "30 SEPTEMBER 2026"
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${MONTH_NAMES[m - 1]} ${y}`;
}
/* st = { yy, from, to, style } -> [{label}] */
function periodsFor(st) {
  const yy = String(st.yy).padStart(2, "0");
  const lab = (a, b) => a === b ? `${MONTHS[a]} ${yy}` : `${MONTHS[a]}-${MONTHS[b]} ${yy}`;
  const out = [];
  if (st.from > st.to) return out;
  if (st.style === "single") out.push({ label: lab(st.from, st.to) });
  else if (st.style === "quarterly") for (let m = st.from; m <= st.to; m += 3) out.push({ label: lab(m, Math.min(m + 2, st.to)) });
  else for (let m = st.from; m <= st.to; m++) out.push({ label: lab(m, m) });
  return out;
}
const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/* ---------- order tab (PO / SO) ---------- */
function buildOrder(key) {
  const def = ORDERS[key];
  const isPO = key === "po";
  const listBox = h("div", { class: "tablewrap" });
  const num = v => Number(v) || 0;

  /* ---- header: supplier / customer search ---- */
  const partyInfo = h("div", { class: "party-info" });
  function showParty(r) {
    if (!r) { partyInfo.replaceChildren(); return; }
    const blocked = typeof r.blocked === "string" ? r.blocked.trim() : (r.blocked ? "Yes" : "");
    partyInfo.replaceChildren(
      h("div", {}, h("b", {}, `${r.number} — ${r.displayName || ""}`),
        blocked ? h("span", { class: "tag warn", style: "margin-left:.5rem" }, "Blocked: " + blocked) : ""),
      h("div", {}, [r.addressLine1, r.addressLine2, [r.postalCode, r.city].filter(Boolean).join(" "), r.country].filter(Boolean).join(", ") || h("span", { class: "muted" }, "No address on card")),
      h("div", { class: "muted" }, [r.email, r.phoneNumber, r.currencyCode ? "Currency " + r.currencyCode : "Local currency"].filter(Boolean).join(" · ")));
  }
  const party = searchBox({ placeholder: `Type ${def.partyLabel.toLowerCase()} no., name or city`, source: lookups[def.partyLookup], onPick: showParty });

  const today = new Date().toISOString().slice(0, 10);
  const date = h("input", { type: "date", value: today });
  const ext  = def.extKey ? h("input", {}) : null;
  const btn  = h("button", { type: "submit" }, "Save draft " + def.title.replace(/s$/, ""));

  /* ---- FX (PO, USD-priced presets) ---- */
  const fxRate = h("input", { type: "number", step: "any", min: "0", placeholder: "e.g. 4.0795" });
  const fxDate = h("input", { type: "date" });
  const fxMid  = h("input", { value: PRESET_CFG.fxMiddleRate || "1700" });
  const fx = { rate: () => Number(fxRate.value) || 0 };
  function fxComment(usd) {
    return `USD ${Number(usd).toFixed(2)} @ BNM RATE ${fxRate.value.trim() || "?"} ON ${longDate(fxDate.value) || "?"} AT MIDDLE RATE ${fxMid.value.trim()}`;
  }
  const fxBox = h("div", { class: "fx hidden" },
    h("h2", {}, "FX for USD-priced lines"),
    h("div", { class: "grid" },
      h("label", {}, "BNM rate", fxRate),
      h("label", {}, "Rate date", fxDate),
      h("label", {}, "Middle rate (comment text)", fxMid)),
    h("p", { class: "muted small", style: "margin:.5rem 0 0" },
      "Unit cost = USD price × BNM rate (rounded to 5 decimals). A comment line with the rate is added after each USD block."));
  [fxRate, fxDate, fxMid].forEach(e => e.addEventListener("input", () => blocks.forEach(b => b.refresh())));

  /* ---- item blocks ---- */
  const blocks = [];
  const blocksBox = h("div", {});
  function fxVisibility() { fxBox.classList.toggle("hidden", !blocks.some(b => b.usesFx())); }

  function manualContent(blk, body) {
    const item = searchBox({ placeholder: "Search part no. or description", source: lookups.items, extra: r => r.baseUnitOfMeasureCode });
    const desc = h("input", { placeholder: "(from item card)", maxlength: "100" });
    const qty = h("input", { type: "number", min: "0", step: "any", value: "1" });
    const price = h("input", { type: "number", min: "0", step: "any" });
    body.replaceChildren(h("div", { class: "grid" },
      h("label", {}, "Part no.", item.el),
      h("label", {}, "Description (optional)", desc),
      h("label", {}, "Quantity (blank = later)", qty),
      h("label", {}, def.priceLabel + " (optional)", price)));
    blk.usesFx = () => false;
    blk.refresh = () => {};
    blk.items = () => [item.value];
    blk.validate = () => item.value ? null : "Every line needs a part no.";
    blk.lines = () => [{ lineType: "Item", item: item.value, description: desc.value.trim(), qty: qty.value.trim(), cost: price.value.trim() }];
  }

  function presetContent(blk, body, p) {
    const usdMode = !!(p.price && (p.price.currency === "USD" || p.price.usd !== undefined));
    const st = {
      yy: p.year ?? (new Date().getFullYear() % 100),
      from: Math.max(0, MONTHS.indexOf(p.from || "JAN")),
      to: MONTHS.indexOf(p.to || "DEC") < 0 ? 11 : MONTHS.indexOf(p.to || "DEC"),
      style: p.style || "monthly",
      unticked: new Set(), over: {}
    };
    const item = searchBox({ placeholder: "Search part no.", source: lookups.items, extra: r => r.baseUnitOfMeasureCode });
    item.input.value = p.item || "";
    const yy = h("input", { type: "number", min: "0", max: "99", value: st.yy });
    const mSel = v => h("select", {}, MONTHS.map((m, i) => h("option", { value: i, selected: i === v }, m)));
    const fromSel = mSel(st.from), toSel = mSel(st.to);
    const styleSel = h("select", {}, [["monthly", "One per month"], ["quarterly", "One per quarter"], ["single", "One line for range"]]
      .map(([v, t]) => h("option", { value: v, selected: v === st.style }, t)));
    const priceIn = h("input", { type: "number", min: "0", step: "any",
      placeholder: usdMode ? "e.g. 1.30" : "applies to all lines" });
    const costNote = h("div", { class: "muted small", style: "margin-top:.4rem" });
    const periodsBox = h("div", { class: "periods" });
    const preview = h("div", { class: "tablewrap" });
    const info = h("div", { class: "muted small", style: "margin-top:.3rem" },
      [`Location ${p.location || "-"}`, `VAT group ${p.vatBusPostingGroup || "-"}`,
       ...Object.entries(p.dimensions || {}).map(([k, v]) => `${k} ${v}`)].join(" · "));

    const descFor = label => `${p.description} - ${label}`;
    function baseCost() {
      if (usdMode) { const r = fx.rate(), u = Number(priceIn.value); return r > 0 && u > 0 ? round5(u * r) : ""; }
      return priceIn.value.trim() === "" ? "" : Number(priceIn.value);
    }
    const ticked = () => periodsFor(st).filter(x => !st.unticked.has(x.label));

    function redraw() {
      st.yy = Number(yy.value) || 0; st.from = Number(fromSel.value); st.to = Number(toSel.value); st.style = styleSel.value;
      const bcost = baseCost();
      costNote.textContent = usdMode
        ? (bcost !== "" ? `${def.priceLabel} per line = ${bcost} (USD ${priceIn.value} × BNM ${fxRate.value})` : "Enter the BNM rate in the FX box to calculate the unit cost.")
        : "";
      const ps = periodsFor(st);
      periodsBox.replaceChildren(...(ps.length ? ps.map(x => {
        const cb = h("input", { type: "checkbox", checked: !st.unticked.has(x.label) });
        cb.addEventListener("change", () => { cb.checked ? st.unticked.delete(x.label) : st.unticked.add(x.label); drawPreview(); });
        return h("label", { class: "chk" }, cb, x.label);
      }) : [h("span", { class: "muted small" }, "“From” month is after “To” month.")]));
      drawPreview();
    }
    function drawPreview() {
      const bcost = baseCost(), rows = ticked();
      if (!rows.length) { preview.replaceChildren(h("p", { class: "muted small" }, "No periods ticked.")); return; }
      preview.replaceChildren(h("table", { class: "lines" },
        h("thead", {}, h("tr", {}, h("th", {}, "Description"), h("th", {}, "Quantity"), h("th", {}, def.priceLabel))),
        h("tbody", {}, rows.map(x => {
          const o = st.over[x.label] || (st.over[x.label] = {});
          const d = h("input", { value: o.desc ?? descFor(x.label), maxlength: "100" });
          d.addEventListener("input", () => o.desc = d.value);
          const q = h("input", { type: "number", min: "0", step: "any", value: o.qty ?? "", placeholder: "later" });
          q.addEventListener("input", () => o.qty = q.value);
          const c = h("input", { type: "number", min: "0", step: "any", value: o.cost ?? bcost, placeholder: usdMode ? "needs USD price + rate" : "enter cost" });
          c.addEventListener("input", () => o.cost = c.value);
          return h("tr", {}, h("td", {}, d), h("td", {}, q), h("td", {}, c));
        }))));
      if (usdMode) preview.append(h("p", { class: "muted small", style: "margin:.4rem 0 0" }, "+ comment line: ", h("code", {}, fxComment(priceIn.value || 0))));
    }
    yy.addEventListener("input", redraw);
    [fromSel, toSel, styleSel].forEach(s => s.addEventListener("change", redraw));
    priceIn.addEventListener("input", redraw);

    body.replaceChildren(
      h("div", { class: "grid" },
        h("label", {}, "Part no.", item.el),
        h("label", {}, "Year (2 digits)", yy),
        h("label", {}, "From", fromSel),
        h("label", {}, "To", toSel),
        h("label", {}, "Lines", styleSel),
        h("label", {}, usdMode ? "USD price" : def.priceLabel, priceIn)),
      costNote, info,
      h("div", { class: "sub" }, "Periods"), periodsBox, preview);
    redraw();

    blk.usesFx = () => usdMode;
    blk.refresh = redraw;
    blk.items = () => [item.value];
    blk.validate = () => {
      if (!item.value) return `${p.name}: enter the part no.`;
      if (!ticked().length) return `${p.name}: tick at least one period.`;
      if (usdMode && !(Number(priceIn.value) > 0)) return `${p.name}: enter the USD price.`;
      const long = ticked().map(x => (st.over[x.label] || {}).desc ?? descFor(x.label)).find(d => d.length > 100);
      if (long) return `Description too long (max 100): ${long}`;
      return null;
    };
    blk.lines = () => {
      const bcost = baseCost();
      const out = ticked().map(x => {
        const o = st.over[x.label] || {};
        return { lineType: "Item", item: item.value, description: String(o.desc ?? descFor(x.label)).trim(),
                 qty: String(o.qty ?? "").trim(), cost: String(o.cost ?? bcost).trim(),
                 locationCode: p.location, vatBus: p.vatBusPostingGroup, dims: p.dimensions };
      });
      if (usdMode) out.push({ lineType: "Comment", description: fxComment(priceIn.value) });
      return out;
    };
  }

  function addBlock(presetId) {
    const box = h("div", { class: "block" });
    const blk = { box, usesFx: () => false, refresh: () => {}, items: () => [], validate: () => null, lines: () => [] };
    const body = h("div", {});
    const list = isPO ? presetsForCompany() : [];
    const presetSel = isPO ? h("select", {},
      h("option", { value: "" }, "No preset (manual line)"),
      list.map(p => h("option", { value: p.id }, p.name))) : null;
    const removeBtn = h("button", { type: "button", class: "ghost small", title: "Remove",
      onclick: () => { blocks.splice(blocks.indexOf(blk), 1); box.remove(); fxVisibility(); } }, "✕ Remove");
    function setPreset(id) {
      const p = list.find(x => x.id === id);
      if (p) presetContent(blk, body, p); else manualContent(blk, body);
      fxVisibility();
    }
    if (presetSel) { presetSel.value = presetId || ""; presetSel.addEventListener("change", () => setPreset(presetSel.value)); }
    box.append(h("div", { class: "block-head" },
      presetSel ? h("label", { class: "grow" }, "Preset", presetSel) : h("strong", { class: "grow" }, "Line"),
      removeBtn), body);
    blocks.push(blk);
    blocksBox.append(box);
    setPreset(presetSel ? presetSel.value : "");
  }
  function resetBlocks() {
    blocks.length = 0; blocksBox.replaceChildren();
    if (isPO) { const first = presetsForCompany()[0]; addBlock(first ? first.id : ""); } else addBlock("");
  }
  resetBlocks();

  const presetNote = isPO && !PRESETS.length
    ? h("p", { class: "muted small" }, "presets.js was not found next to index.html, so only manual lines are available.") : "";

  const form = h("form", {},
    h("div", { class: "grid" },
      h("label", {}, def.partyLabel, party.el),
      h("label", {}, "Order date", date),
      ext ? h("label", {}, def.extLabel, ext) : ""),
    partyInfo,
    isPO ? fxBox : "",
    h("h2", { style: "margin-top:1rem" }, "Lines"),
    presetNote,
    blocksBox,
    h("div", { class: "row-actions" },
      h("button", { type: "button", class: "ghost", onclick: () => addBlock(isPO && presetsForCompany()[0] ? presetsForCompany()[0].id : "") },
        isPO ? "+ Add item block" : "+ Add line"),
      isPO ? h("button", { type: "button", class: "ghost", onclick: () => addBlock("") }, "+ Add manual line") : "",
      btn)
  );

  /* ---- line helpers ---- */
  const lineUrl = (order, line) => `/${def.endpoint}(${order.id})/${def.linesEndpoint}(${line.id})`;
  async function patchLine(order, line, body) {
    await co(lineUrl(order, line), { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify(body) });
  }
  async function setDims(order, line, dims, ctx) {
    const wanted = Object.entries(dims || {});
    if (!wanted.length) return;
    let all, existing;
    try {
      all = await lookups.dimensions();
      existing = (await co(lineUrl(order, line) + "/dimensionSetLines")).value;
    } catch (e) { ctx.warnings.push("Dimensions: " + e.message); return; }
    for (const [name, val] of wanted) {
      const n = normName(name);
      const d = all.find(x => normName(x.code) === n || normName(x.displayName) === n || normName(x.code) === n.replace(/code$/, ""));
      if (!d) { ctx.warnings.push(`Dimension "${name}" not found in BC`); continue; }
      const ex = existing.find(x => x.id === d.id || x.code === d.code);
      try {
        if (ex) { if (ex.valueCode !== val) await co(`${lineUrl(order, line)}/dimensionSetLines(${ex.id})`, { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify({ valueCode: val }) }); }
        else await co(lineUrl(order, line) + "/dimensionSetLines", { method: "POST", body: JSON.stringify({ id: d.id, valueCode: val }) });
      } catch (e) { ctx.warnings.push(`Dimension ${d.code} = ${val}: ${e.message}`); }
    }
  }
  async function createLine(order, l, ctx) {
    let body;
    if (l.lineType === "Comment") body = { lineType: "Comment", description: l.description };
    else {
      body = { lineType: "Item", lineObjectNumber: l.item };
      if (l.description) body.description = l.description;
      if (l.qty !== "" && l.qty != null) body.quantity = Number(l.qty);
      if (l.cost !== "" && l.cost != null) body[def.priceKey] = Number(l.cost);
      if (l.locationCode) {
        const loc = (await lookups.locations()).find(x => (x.code || "").toLowerCase() === l.locationCode.toLowerCase());
        if (loc) body.locationId = loc.id; else ctx.warnings.push(`Location ${l.locationCode} not found`);
      }
    }
    const line = await co(`/${def.endpoint}(${order.id})/${def.linesEndpoint}`, { method: "POST", body: JSON.stringify(body) });
    if (l.lineType === "Comment") return line;

    // BC may overwrite description / cost from the item card - put ours back
    const fix = {};
    if (body.description && line.description !== body.description) fix.description = body.description;
    if (body[def.priceKey] !== undefined && Math.abs(num(line[def.priceKey]) - body[def.priceKey]) > 1e-9) fix[def.priceKey] = body[def.priceKey];
    if (Object.keys(fix).length) { try { await patchLine(order, line, fix); } catch (e) { ctx.warnings.push(`${l.description || l.item}: ${e.message}`); } }

    await setDims(order, line, l.dims, ctx);

    if (l.vatBus) {
      if (ctx.extOk) {
        try {
          await bcFetch(`${extBase()}(${line.id})`, { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify({ vatBusPostingGroup: l.vatBus }) });
          ctx.vatSet++;
        } catch (e) { ctx.vatPending++; ctx.warnings.push(`VAT group ${l.vatBus}: ${e.message}`); }
      } else ctx.vatPending++;
    }
    return line;
  }

  /* ---- save draft ---- */
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const errs = [];
    if (!party.value) errs.push(`Choose a ${def.partyLabel.toLowerCase()}.`);
    if (!blocks.length) errs.push("Add at least one line.");
    blocks.forEach(b => { const e = b.validate(); if (e) errs.push(e); });
    if (blocks.some(b => b.usesFx())) {
      if (!(fx.rate() > 0)) errs.push("Enter the BNM rate.");
      if (!fxDate.value) errs.push("Enter the BNM rate date.");
    }
    if (errs.length) { setStatus(errs.join(" "), "err"); return; }

    btn.disabled = true; setStatus(`Checking ${def.partyLabel.toLowerCase()} and part numbers...`);
    let partyRec;
    try {
      partyRec = (await lookups[def.partyLookup]()).find(r => (r.number || "").toLowerCase() === party.value.toLowerCase());
      if (!partyRec) throw new Error(`${def.partyLabel} "${party.value}" not found. Pick one from the search list.`);
      const items = await lookups.items();
      const missing = [...new Set(blocks.flatMap(b => b.items()))].filter(n => !items.some(i => (i.number || "").toLowerCase() === n.toLowerCase()));
      if (missing.length) throw new Error("Part no. not found: " + missing.join(", "));
    } catch (e) { setStatus("Error: " + e.message, "err"); btn.disabled = false; return; }

    const lines = blocks.flatMap(b => b.lines());
    const header = { [def.partyKey]: partyRec.number };
    if (date.value) header.orderDate = date.value;
    if (ext && ext.value.trim()) header[def.extKey] = ext.value.trim();

    const ctx = { warnings: [], vatSet: 0, vatPending: 0, extOk: isPO ? await lineExtAvailable() : false };
    let order = null, done = 0;
    setStatus("Creating draft...");
    try {
      order = await co(`/${def.endpoint}`, { method: "POST", body: JSON.stringify(header) });
      for (const l of lines) {
        setStatus(`Creating ${order.number}: line ${done + 1} of ${lines.length}...`);
        await createLine(order, l, ctx);
        done++;
      }
      const itemLines = lines.filter(l => l.lineType === "Item");
      const noQty = itemLines.filter(l => !(Number(l.qty) > 0)).length;
      let msg = `Saved draft ${order.number} with ${done} line(s).`;
      if (noQty) msg += ` ${noQty} line(s) have no quantity yet.`;
      const noCost = itemLines.filter(l => l.cost === "" || l.cost == null).length;
      if (noCost) msg += ` ${noCost} line(s) have no ${def.priceLabel.toLowerCase()} - BC used its default.`;
      if (ctx.vatSet) msg += ` VAT group set on ${ctx.vatSet} line(s).`;
      if (ctx.vatPending) msg += ` VAT group to set in BC on ${ctx.vatPending} line(s).`;
      const w = [...new Set(ctx.warnings)];
      if (w.length) msg += " Warnings: " + w.slice(0, 5).join("; ") + (w.length > 5 ? ` (+${w.length - 5} more)` : "");
      setStatus(msg, w.length || ctx.vatPending ? "warn" : "ok");
      form.reset(); date.value = today; party.clear();
      if (fxMid) fxMid.value = PRESET_CFG.fxMiddleRate || "1700";
      resetBlocks();
      page = 0; refresh();
    } catch (e) {
      const extra = order ? ` (Draft ${order.number} was created with ${done} of ${lines.length} lines; open it in Business Central to fix or delete it.)` : "";
      setStatus("Error: " + e.message + extra, "err");
      if (order) refresh();
    } finally { btn.disabled = false; }
  });

  /* ---- posting (switched off: CONFIG.features.posting) ---- */
  const qtyLines = o => (o[def.linesEndpoint] || []).filter(l => num(l.quantity) > 0);
  const toStep    = o => qtyLines(o).filter(l => num(l.quantity) > num(l[def.doneQtyKey]));
  const toInvoice = o => qtyLines(o).filter(l => num(l[def.doneQtyKey]) > num(l.invoicedQuantity));

  async function postStep(order, mode, button) {
    const isInv = mode === "invoice";
    const stepName = isInv ? "Invoice" : def.stepLabel;
    const what = isInv
      ? `Post the invoice for everything already ${def.stepPast} on ${order.number}?\n\nThis posts to the ledger (payables/receivables, tax) and cannot be undone from this portal.`
      : `${def.stepLabel} ${order.number}?\n\nThis posts the ${def.stepVerb === "ship" ? "shipment" : "receipt"} (inventory moves) without invoicing.`;
    if (!confirm(what)) return;
    button.disabled = true; setStatus(`${stepName}: preparing ${order.number}...`);
    try {
      for (const l of qtyLines(order)) {
        const outstanding = num(l.quantity) - num(l[def.doneQtyKey]);
        const uninvoiced  = num(l[def.doneQtyKey]) - num(l.invoicedQuantity);
        await patchLine(order, l, { [def.stepQtyKey]: isInv ? 0 : outstanding });
        await patchLine(order, l, { invoiceQuantity: isInv ? uninvoiced : 0 });
      }
      setStatus(`${stepName}: posting ${order.number}...`);
      await co(`/${def.endpoint}(${order.id})/Microsoft.NAV.${def.postAction}`,
        { method: "POST", headers: { "If-Match": "*" }, body: "{}" });
      setStatus(isInv ? `Invoice posted for ${order.number}.` : `${order.number} ${def.stepPast}.`, "ok");
      refresh();
      delete loaded.inventory;
    } catch (e) {
      setStatus(`Could not ${stepName.toLowerCase()} ${order.number}: ${e.message}`, "err");
      button.disabled = false;
      refresh();
    }
  }
  function progressText(o) {
    const lines = qtyLines(o);
    if (!lines.length) return "No lines";
    const q = lines.reduce((s, l) => s + num(l.quantity), 0);
    const d = lines.reduce((s, l) => s + num(l[def.doneQtyKey]), 0);
    const i = lines.reduce((s, l) => s + num(l.invoicedQuantity), 0);
    const cap = def.stepPast[0].toUpperCase() + def.stepPast.slice(1);
    const f = n => Number(n.toFixed(5)).toLocaleString();
    return h("div", { class: "progress" },
      h("div", { class: d >= q ? "done" : "" }, `${cap} ${f(d)} / ${f(q)}`),
      h("div", { class: i >= q ? "done" : "" }, `Invoiced ${f(i)} / ${f(q)}`));
  }

  /* ---- list with paging ---- */
  const PAGE_SIZE = 20;
  let page = 0;
  const prevBtn = h("button", { type: "button", class: "ghost small", onclick: () => { if (page > 0) { page--; refresh(); } } }, "‹ Prev");
  const nextBtn = h("button", { type: "button", class: "ghost small", onclick: () => { page++; refresh(); } }, "Next ›");
  const pageInfo = h("span", { class: "muted" });
  const pager = h("div", { class: "row-actions pager" }, prevBtn, pageInfo, nextBtn);
  const extBadge = h("span", { class: "tag" }, isPO ? "Checking VAT extension..." : "");
  if (!isPO) extBadge.classList.add("hidden");

  async function vatMissingFor(rows) {
    if (!isPO || !rows.length || !(await lineExtAvailable())) return null;
    try {
      const filter = rows.map(r => `documentNo eq '${String(r.number).replace(/'/g, "''")}'`).join(" or ");
      const d = await bcFetch(`${extBase()}?$filter=${encodeURIComponent(filter)}&$select=documentNo,no,type,vatBusPostingGroup`);
      const s = new Set();
      d.value.forEach(l => { if (l.type === "Item" && l.no && !l.vatBusPostingGroup) s.add(l.documentNo); });
      return s;
    } catch { return null; }
  }

  async function refresh() {
    if (isPO) lineExtAvailable().then(ok => {
      extBadge.className = "tag " + (ok ? "ok" : "warn");
      extBadge.textContent = ok ? "VAT extension connected" : "VAT extension not found – VAT group to set in BC";
    });
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      prevBtn.disabled = nextBtn.disabled = true;
      const data = await co(`/${def.endpoint}?$top=${PAGE_SIZE + 1}&$skip=${page * PAGE_SIZE}&$orderby=lastModifiedDateTime desc&$expand=${def.linesEndpoint}`);
      if (!data.value.length && page > 0) { page--; return refresh(); }
      const hasNext = data.value.length > PAGE_SIZE;
      const rows = data.value.slice(0, PAGE_SIZE);
      const from = page * PAGE_SIZE + 1, to = page * PAGE_SIZE + rows.length;
      pageInfo.textContent = rows.length ? `Page ${page + 1} · orders ${from}–${to}` : "";
      prevBtn.disabled = page === 0;
      nextBtn.disabled = !hasNext;
      const vatMissing = await vatMissingFor(rows);
      const nameKey = def.columns[2][0];
      const extra = [
        { label: "Lines", render: r => String((r[def.linesEndpoint] || []).filter(l => l.lineType === "Item").length) },
        { label: "Notes", render: r => {
          const items = (r[def.linesEndpoint] || []).filter(l => l.lineType === "Item");
          const noQty = items.filter(l => !(num(l.quantity) > 0)).length;
          const tags = [];
          if (noQty) tags.push(h("span", { class: "tag warn" }, `${noQty} qty pending`));
          if (vatMissing && vatMissing.has(r.number)) tags.push(h("span", { class: "tag warn" }, "VAT group to set in BC"));
          return tags.length ? h("span", {}, tags) : "";
        } }
      ];
      if (CONFIG.features.posting) extra.push(
        { label: "Progress", render: r => progressText(r) },
        { label: "Action", render: r => {
          if (r.status === "In Review") return h("button", { type: "button", class: "small", disabled: true }, "Awaiting approval");
          const canStep = toStep(r).length > 0, canInv = toInvoice(r).length > 0;
          const stepBtn = h("button", { type: "button", class: "small" }, def.stepLabel);
          const invBtn  = h("button", { type: "button", class: "small" }, canInv ? "Invoice" : "🔒 Invoice");
          if (canStep) stepBtn.addEventListener("click", () => postStep(r, "step", stepBtn)); else stepBtn.disabled = true;
          if (canInv)  invBtn.addEventListener("click",  () => postStep(r, "invoice", invBtn)); else invBtn.disabled = true;
          return h("span", { class: "row-actions", style: "margin:0;flex-wrap:nowrap" }, stepBtn, invBtn);
        } });
      renderTable(listBox, def.columns, rows, extra, { cellClass: (r, k) => k === nameKey ? "wrap" : "" });
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load list: " + e.message)); }
  }
  refreshers[key] = refresh;

  return h("div", {},
    h("div", { class: "card" },
      h("div", { class: "card-head" }, h("h2", {}, "New draft " + def.title.replace(/s$/, "")), extBadge),
      form),
    h("div", { class: "card" }, h("h2", {}, "Latest " + def.title),
      h("div", { class: "row-actions" }, h("button", { type: "button", class: "ghost", onclick: () => { page = 0; refresh(); } }, "Refresh")),
      listBox, pager)
  );
}

/* ---------- approvals tab (switched off: CONFIG.features.approvals) ---------- */
function approvalBase() {
  const a = CONFIG.approvalApi;
  return `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/${a.entity}`;
}
function buildApprovals() {
  const a = CONFIG.approvalApi;
  const listBox = h("div", { class: "tablewrap" });
  const kindSel = h("select", {},
    h("option", { value: "" }, "All documents"),
    h("option", { value: "Purchase Order" }, "Purchase orders"),
    h("option", { value: "Sales Order" }, "Sales orders"));
  let rows = [];

  if (!a.publisher) {
    refreshers.approvals = () => {};
    return h("div", {}, h("div", { class: "card" },
      h("h2", {}, "Approvals need one-time setup"),
      h("p", {}, "Approving from this portal requires a custom API page (AL extension) for approval entries."),
      h("p", { class: "muted" }, "Once installed, set ", h("code", {}, "CONFIG.approvalApi.publisher"), " at the top of this file.")));
  }
  function draw() {
    const k = kindSel.value;
    renderTable(listBox,
      [["documentType","Document"],["documentNumber","No."],["senderId","Requested by"],["amount","Amount"],["dueDate","Due"],["status","Status"]],
      rows.filter(r => !k || r.documentType === k),
      [{ label: "Action", render: r => h("span", { class: "row-actions", style: "margin:0" },
          h("button", { type: "button", class: "small", onclick: ev => act(r, a.approveAction, "approve", ev.target) }, "Approve"),
          h("button", { type: "button", class: "small danger", onclick: ev => act(r, a.rejectAction, "reject", ev.target) }, "Reject")) }]);
  }
  kindSel.addEventListener("change", draw);
  async function act(r, action, verb, button) {
    if (!confirm(`${verb[0].toUpperCase() + verb.slice(1)} ${r.documentType} ${r.documentNumber}?`)) return;
    button.disabled = true; setStatus(`Sending ${verb}...`);
    try {
      await bcFetch(`${approvalBase()}(${r.id})/Microsoft.NAV.${action}`, { method: "POST", headers: { "If-Match": "*" }, body: "{}" });
      setStatus(`${r.documentType} ${r.documentNumber}: ${verb} done.`, "ok");
      refresh();
      ["po","so"].forEach(k => refreshers[k] && refreshers[k]());
    } catch (e) { setStatus(`Could not ${verb}: ${e.message}`, "err"); button.disabled = false; }
  }
  async function refresh() {
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      const data = await bcFetch(`${approvalBase()}?$filter=status eq 'Open'&$top=200`);
      rows = data.value; draw();
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load approvals: " + e.message)); }
  }
  refreshers.approvals = refresh;
  return h("div", {},
    h("div", { class: "card" }, h("h2", {}, "Pending approvals"),
      h("div", { class: "grid" }, h("label", {}, "Show", kindSel), h("button", { type: "button", class: "ghost", onclick: refresh }, "Refresh"))),
    h("div", { class: "card" }, listBox));
}

/* ---------- tabs ---------- */
const loaded = {};
function showTab(id) {
  if (!TABS.some(t => t.id === id)) id = TABS[0].id;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll("#panels > div").forEach(p => p.classList.toggle("hidden", p.dataset.tab !== id));
  if ((!loaded[id] || id === "inventory" || id === "approvals") && refreshers[id]) { loaded[id] = true; refreshers[id](); }
}
function buildUI(activeId) {
  Object.keys(loaded).forEach(k => delete loaded[k]);
  const tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
  tabs.replaceChildren(); panels.replaceChildren();
  TABS.forEach(t => {
    tabs.append(h("button", { "data-tab": t.id, onclick: () => showTab(t.id) }, t.label));
    const p = t.build(); p.dataset.tab = t.id; p.classList.add("hidden"); panels.append(p);
  });
  showTab(activeId || TABS[0].id);
}
function prefetch() {
  // warm up the search lists in the background
  ["vendors", "items", "customers", "locations", "dimensions"].forEach(k => lookups[k]().catch(() => {}));
  lineExtAvailable();
}

/* ---------- start-up after sign-in ---------- */
async function onSignedIn() {
  setStatus("Signed in as " + account.username + ". Loading companies...");
  document.getElementById("btnLogin").classList.add("hidden");
  document.getElementById("btnLogout").classList.remove("hidden");
  try {
    const comps = await bc("/companies");
    if (!comps.value.length) throw new Error("No companies found for this user.");
    const sel = document.getElementById("company");
    sel.replaceChildren(...comps.value.map(c => h("option", { value: c.id }, c.displayName || c.name)));
    sel.classList.remove("hidden");
    companyId = sel.value;
    sel.addEventListener("change", () => {
      const active = document.querySelector("#tabs button.active");
      companyId = sel.value;
      clearCache();
      buildUI(active ? active.dataset.tab : null);
      prefetch();
      setStatus(`Switched to ${companyName()}.`, "ok");
    });
    document.getElementById("app").classList.remove("hidden");
    buildUI();
    prefetch();
    setStatus("Signed in as " + account.username, "ok");
  } catch (e) { setStatus("Error: " + e.message, "err"); }
}

document.getElementById("btnLogin").addEventListener("click", login);
document.getElementById("btnLogout").addEventListener("click", logout);

(async () => {
  try {
    await msalApp.initialize?.();
    const result = await msalApp.handleRedirectPromise();
    if (result && result.account) account = result.account;
    else { const a = msalApp.getAllAccounts(); if (a.length) account = a[0]; }
    if (account) { msalApp.setActiveAccount(account); await onSignedIn(); }
  } catch (e) { setStatus("Sign-in error: " + e.message, "err"); }
})();

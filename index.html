<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Central Portal</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#d8dde4; --accent:#0b5cad; --text:#1f2430; --muted:#6b7280; --danger:#b3261e; --warn-bg:#fff4e5; --warn:#8a4b00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:.7rem 1rem; display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0; flex:1; }
  header select, header button { padding:.4rem .7rem; }
  header select { width:auto; margin:0; }
  #status { margin:.75rem 1rem; padding:.6rem .8rem; background:#e9edf2; border-radius:6px; }
  #status.err  { background:#fdecea; color:#8a1c12; }
  #status.ok   { background:#e6f4ea; color:#14532d; }
  #status.warn { background:var(--warn-bg); color:var(--warn); }
  main { padding:0 1rem 2rem; max-width:1200px; margin:0 auto; }
  nav { display:flex; gap:.25rem; flex-wrap:wrap; border-bottom:2px solid var(--line); margin-bottom:1rem; }
  nav button { background:none; border:none; padding:.6rem 1rem; cursor:pointer; font-size:.95rem; border-bottom:3px solid transparent; margin-bottom:-2px; color:var(--text); border-radius:0; }
  nav button.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  .card h2 { margin:0 0 .75rem; font-size:1rem; }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.75rem; align-items:end; }
  label { display:block; font-size:.8rem; color:var(--muted); }
  label.chk { display:inline-flex; align-items:center; gap:.3rem; color:var(--text); font-size:.85rem; margin:0 .9rem .4rem 0; }
  textarea { width:100%; padding:.5rem; border:1px solid var(--line); border-radius:4px; font:.85rem/1.4 ui-monospace, Consolas, monospace; resize:vertical; }
  input, select { width:100%; padding:.5rem; margin-top:.2rem; border:1px solid var(--line); border-radius:4px; font-size:.9rem; font-family:inherit; }
  input[type=checkbox] { width:auto; margin:0 .3rem 0 0; }
  button { padding:.5rem 1rem; cursor:pointer; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-family:inherit; }
  button.ghost { background:#fff; color:var(--accent); }
  button.danger { background:#fff; color:var(--danger); border-color:var(--danger); }
  button.small { padding:.25rem .6rem; font-size:.8rem; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.85rem; }
  th, td { border-bottom:1px solid var(--line); padding:.4rem .6rem; text-align:left; white-space:nowrap; }
  th { background:#f0f3f6; }
  td.num { text-align:right; }
  td.low { color:var(--danger); font-weight:600; }
  td.wrap { white-space:normal; min-width:180px; max-width:280px; }
  table.lines td { padding:.25rem .4rem; }
  table.lines input { margin:0; padding:.35rem .45rem; }
  table.lines td:first-child { width:55%; }
  .progress { font-size:.8rem; line-height:1.35; color:var(--muted); }
  .progress .done { color:#14532d; }
  .pager { justify-content:flex-end; }
  .muted { color:var(--muted); }
  .small { font-size:.8rem; }
  .row-actions { display:flex; gap:.5rem; margin-top:.75rem; flex-wrap:wrap; align-items:center; }
  .hidden { display:none !important; }
  code { background:#f0f3f6; padding:.1rem .3rem; border-radius:3px; }
  .tag { display:inline-block; font-size:.75rem; padding:.1rem .45rem; border-radius:10px; background:#eef2f6; color:var(--muted); margin:0 .25rem .15rem 0; white-space:nowrap; }
  .tag.warn { background:var(--warn-bg); color:var(--warn); }
  .tag.ok { background:#e6f4ea; color:#14532d; }
  /* search box */
  .ta { position:relative; }
  .ta-list { position:absolute; z-index:30; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.12); max-height:280px; overflow:auto; margin-top:2px; }
  .ta-opt { padding:.45rem .6rem; cursor:pointer; font-size:.85rem; color:var(--text); border-bottom:1px solid #f0f2f5; }
  .ta-opt:hover, .ta-opt.active { background:#e8f0fb; }
  .ta-empty { padding:.5rem .6rem; font-size:.85rem; color:var(--muted); }
  .party-info { font-size:.85rem; line-height:1.45; margin-top:.5rem; padding:.5rem .7rem; background:#f7f9fb; border:1px solid var(--line); border-radius:6px; }
  .party-info:empty { display:none; }
  /* item blocks */
  .block { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:.75rem; margin-bottom:.75rem; background:#fcfdfe; }
  .block-head { display:flex; gap:.75rem; align-items:end; margin-bottom:.6rem; }
  .block-head .grow { flex:1; }
  .sub { font-size:.8rem; color:var(--muted); margin:.7rem 0 .3rem; font-weight:600; }
  .periods { margin-bottom:.4rem; }
  .fx { border:1px dashed var(--line); border-radius:6px; padding:.75rem; margin:.75rem 0; }
  .fx h2 { font-size:.9rem; }
  @media (max-width:640px) { .block-head { flex-wrap:wrap; } }
  .span2 { grid-column: span 2; }
  @media (max-width:640px) { .span2 { grid-column: auto; } }
  .comment-row { border:1px solid var(--line); border-left:4px solid #8a94a6; border-radius:6px; padding:.6rem .75rem; margin-bottom:.6rem; background:#fcfdfe; }
  .comment-row .block-head { margin-bottom:0; }
  tr.comment td { color:var(--muted); font-style:italic; background:#fafbfc; }
  table.lines select.vat { margin:0; padding:.35rem; }
  tfoot td { border-bottom:none; }
  input.upper { text-transform:uppercase; }
  .fx-item { margin-top:.6rem; padding:.5rem .6rem; background:#f7f9fb; border:1px dashed var(--line); border-radius:6px; }
  input:disabled { background:#eef1f4; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Business Central Portal</h1>
  <select id="company" class="hidden" title="Company"></select>
  <button id="btnLogin">Sign in with Microsoft</button>
  <button id="btnLogout" class="hidden">Sign out</button>
</header>

<div id="status">Not signed in.</div>

<main id="app" class="hidden">
  <nav id="tabs"></nav>
  <div id="panels"></div>
</main>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
  window.msal || document.write('<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"><\/script>');
</script>
<script>
  window.msal || document.write('<script src="msal-browser.min.js"><\/script>');
</script>
<!-- Portal settings: registries, locations, VAT groups, comment templates (edit presets.js, not this file) -->
<script src="presets.js"></script>
<script>
/* ============ CONFIGURE THESE ============ */
const CONFIG = {
  clientId:    "9cfe8c4d-e0fb-4372-a7c1-6300aac80fbd",
  tenantId:    "ab7c8c1e-dc1d-431f-ba8b-e4de2b047f8b",
  environment: "Production",   // <- your BC environment name
  redirectUri: window.location.origin + window.location.pathname,

  // Portal is "draft only": no posting buttons, no Approvals tab.
  // Set to true to bring them back (the code is still below).
  features: { posting: false, approvals: false },

  // Saxon Portal API extension (sets VAT Bus. Posting Group on PO lines).
  // Leave publisher blank to switch it off.
  lineExtApi: { publisher: "saxon", group: "portal", version: "v1.0",
                entities: { po: "purchaseLineExts", so: "salesLineExts", customers: "customerExts",
                            vendors: "vendorExts", vendorBanks: "vendorBankAccounts" } },   // vendor pages: v1.4

  // Pending suppliers tab: reads the SharePoint list Trade Confirmation writes at Level 3 approval.
  // Needs the delegated Graph permission Sites.ReadWrite.All on this app registration.
  graph: {
    scopes: ["https://graph.microsoft.com/Sites.ReadWrite.All"],
    siteHost: "saxonrenewables.sharepoint.com",
    sitePath: "/sites/Operations",
    assetListId: "8c4f2f44-4662-4c4e-a56b-312772142c0d"   // Asset Approval Record List
  },

  // Approvals need their own custom API page (only used if features.approvals = true).
  approvalApi: {
    publisher: "", group: "portal", version: "v1.0", entity: "approvalEntries",
    approveAction: "approve", rejectAction: "reject"
  },
  lowStockThreshold: 10         // inventory at or below this is highlighted
};
/* ======================================== */

const statusBox = document.getElementById("status");
function setStatus(msg, kind) { statusBox.textContent = msg; statusBox.className = kind || ""; }

window.addEventListener("error", e => setStatus("Script error: " + e.message, "err"));
if (typeof msal === "undefined") {
  setStatus("The Microsoft sign-in library did not load (blocked network, ad blocker, or no internet).", "err");
  throw new Error("msal library missing");
}

/* ---------- settings (presets.js) ---------- */
const SETTINGS = window.PORTAL_PRESETS || {};
const REGISTRIES = SETTINGS.registries || ["I-REC", "TIGR"];
const COMMENT_TEMPLATES = SETTINGS.comments || [{ label: "Free text", text: "{free:Text}" }];
const DIMENSIONS = SETTINGS.dimensions || {};
function companyName() {
  const sel = document.getElementById("company");
  return sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : "";
}
function companyGroup() {
  const name = companyName();
  const g = (SETTINGS.companyGroups || []).find(x => new RegExp(x.match, "i").test(name));
  return g ? g.group : null;
}
function locationFor(registry) {
  const row = (SETTINGS.locations || {})[registry], g = companyGroup();
  return row && g ? (row[g] || "") : "";
}

const BC_SCOPE = ["https://api.businesscentral.dynamics.com/Financials.ReadWrite.All"];
const BC_ROOT  = `https://api.businesscentral.dynamics.com/v2.0/${CONFIG.tenantId}/${CONFIG.environment}/api`;
const BC_BASE  = `${BC_ROOT}/v2.0`;

const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: CONFIG.redirectUri
  },
  cache: { cacheLocation: "sessionStorage" }
});

let account = null;
let companyId = null;

/* ---------- auth ---------- */
async function login() {
  try {
    setStatus("Redirecting to Microsoft sign-in...");
    await msalApp.loginRedirect({ scopes: BC_SCOPE });
  } catch (e) { setStatus("Login failed: " + e.message, "err"); }
}
function logout() { msalApp.logoutRedirect({ account }); }

async function getToken() {
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: BC_SCOPE, account });
    return r.accessToken;
  } catch (e) {
    await msalApp.acquireTokenRedirect({ scopes: BC_SCOPE });
    throw new Error("Re-authenticating...");
  }
}

/* ---------- BC calls ---------- */
function niceError(text) {
  try { return JSON.parse(text).error.message; } catch { return text; }
}
async function bcFetch(url, options = {}) {
  const token = await getToken();
  const res = await fetch(url, {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/json",
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!res.ok) throw new Error(`BC ${res.status}: ${niceError(await res.text())}`);
  return res.status === 204 ? null : res.json();
}
const bc = (path, options) => bcFetch(BC_BASE + path, options);
const co = (path, options) => bc(`/companies(${companyId})${path}`, options);

/* read every page of a list (follows @odata.nextLink); retries without $select if BC rejects it */
async function coAll(path) {
  async function run(p) {
    let url = `${BC_BASE}/companies(${companyId})${p}`;
    const out = [];
    while (url) { const d = await bcFetch(url); out.push(...d.value); url = d["@odata.nextLink"]; }
    return out;
  }
  try { return await run(path); }
  catch (e) {
    if (!path.includes("$select")) throw e;
    return run(path.replace(/[?&]\$select=[^&]*/, "").replace(/^([^?]*)&/, "$1?"));
  }
}

/* ---------- cached lookups (per company) ---------- */
const cache = {};
function cached(key, loader) {
  if (!cache[key]) cache[key] = loader().catch(e => { delete cache[key]; throw e; });
  return cache[key];
}
function clearCache(prefix) { Object.keys(cache).forEach(k => { if (!prefix || k.startsWith(prefix)) delete cache[k]; }); }
const lookups = {
  vendors:    () => cached("vendors",    () => coAll("/vendors?$select=id,number,displayName,addressLine1,addressLine2,city,postalCode,country,email,phoneNumber,currencyCode,blocked")),
  customers:  () => cached("customers",  () => coAll("/customers?$select=id,number,displayName,addressLine1,addressLine2,city,postalCode,country,email,phoneNumber,currencyCode,blocked")),
  items:      () => cached("items",      () => coAll("/items?$select=id,number,displayName,type,baseUnitOfMeasureCode,blocked")),
  locations:  () => cached("locations",  () => coAll("/locations?$select=id,code,displayName")),
  dimensions: () => cached("dimensions", () => coAll("/dimensions?$select=id,code,displayName"))
};

/* ---------- Saxon Portal API extension (VAT group per line) ---------- */
const extState = {};   // companyId|kind -> Promise<boolean>
function extBase(kind) {
  const a = CONFIG.lineExtApi;
  return `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/${a.entities[kind]}`;
}
function lineExtAvailable(kind) {
  if (!CONFIG.lineExtApi.publisher || !CONFIG.lineExtApi.entities[kind]) return Promise.resolve(false);
  const k = companyId + "|" + kind;
  if (!(k in extState)) extState[k] = bcFetch(extBase(kind) + "?$top=1").then(() => true, () => false);
  return extState[k];
}

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => el.append(c instanceof Node ? c : document.createTextNode(c ?? "")));
  return el;
}

/* cols: [key,label]; extraCols: [{label, render(row) -> Node}] */
function renderTable(box, cols, rows, extraCols = [], opts = {}) {
  box.replaceChildren();
  if (!rows.length) { box.append(h("p", { class: "muted" }, "No records.")); return; }
  box.append(h("table", {},
    h("thead", {}, h("tr", {}, cols.map(c => h("th", {}, c[1])), extraCols.map(c => h("th", {}, c.label)))),
    h("tbody", {}, rows.map(r => h("tr", {},
      cols.map(c => {
        const cls = [];
        if (typeof r[c[0]] === "number") cls.push("num");
        if (opts.cellClass) { const x = opts.cellClass(r, c[0]); if (x) cls.push(x); }
        return h("td", { class: cls.join(" ") }, r[c[0]] ?? "");
      }),
      extraCols.map(c => h("td", {}, c.render(r)))
    )))
  ));
}

/* ---------- live keyword search box ----------
   Type any part of the number, name or city; all words must match. */
function searchBox({ placeholder, source, onPick, extra }) {
  const input = h("input", { type: "text", placeholder, autocomplete: "off", spellcheck: "false" });
  const list = h("div", { class: "ta-list hidden" });
  const el = h("div", { class: "ta" }, input, list);
  const MAX_SHOWN = 30;    // only the first 30 matches are listed; typing narrows the list
  let rows = [], total = 0, active = -1, picked = null, timer = null;

  const hay = r => [r.number, r.displayName, r.city].filter(Boolean).join(" ").toLowerCase();
  function hide() { list.classList.add("hidden"); active = -1; }
  function pick(r) {
    picked = r; input.value = r.number; hide();
    if (onPick) onPick(r);
  }
  function draw() {
    if (document.activeElement !== input) { hide(); return; }
    list.replaceChildren(...(rows.length
      ? [...rows.map((r, i) => h("div", {
          class: "ta-opt" + (i === active ? " active" : ""),
          onmousedown: e => { e.preventDefault(); pick(r); }
        }, h("b", {}, r.number), " — ", r.displayName || "",
           r.city ? h("span", { class: "muted" }, " · " + r.city) : "",
           extra && extra(r) ? h("span", { class: "muted" }, " · " + extra(r)) : ""))]
      : [h("div", { class: "ta-empty" }, "No match.")]));
    list.classList.remove("hidden");
    const act = list.querySelector(".ta-opt.active");
    if (act) act.scrollIntoView({ block: "nearest" });
  }
  async function update() {
    if (document.activeElement !== input) return;
    const tokens = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    list.replaceChildren(h("div", { class: "ta-empty" }, "Loading..."));
    list.classList.remove("hidden");
    let data;
    try { data = await source(); }
    catch (e) { list.replaceChildren(h("div", { class: "ta-empty" }, "Could not load list: " + e.message)); return; }
    if (document.activeElement !== input) { hide(); return; }
    const all = tokens.length ? data.filter(r => { const s = hay(r); return tokens.every(t => s.includes(t)); }) : data;
    rows = all.slice(0, MAX_SHOWN);
    total = all.length;
    active = rows.length ? 0 : -1;
    draw();
  }
  async function resolveExact() {
    const v = input.value.trim().toLowerCase();
    if (!v || (picked && picked.number.toLowerCase() === v)) return;
    try {
      const r = (await source()).find(x => (x.number || "").toLowerCase() === v);
      if (r && input.value.trim().toLowerCase() === v) { picked = r; if (onPick) onPick(r); }
    } catch {}
  }

  input.addEventListener("input", () => {
    if (picked) { picked = null; if (onPick) onPick(null); }
    clearTimeout(timer); timer = setTimeout(update, 150);
  });
  input.addEventListener("focus", update);
  input.addEventListener("blur", () => { clearTimeout(timer); setTimeout(() => { hide(); resolveExact(); }, 120); });
  input.addEventListener("keydown", e => {
    if (list.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, rows.length - 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); draw(); }
    else if (e.key === "Enter" && active >= 0 && rows[active]) { e.preventDefault(); pick(rows[active]); }
    else if (e.key === "Escape") hide();
  });

  return {
    el, input,
    get value() { return input.value.trim(); },
    set(v) { input.value = v || ""; picked = null; if (v) resolveExact(); },
    clear() { input.value = ""; picked = null; if (onPick) onPick(null); }
  };
}

/* ---------- definitions ---------- */
const MASTER = {
  items: {
    title: "Part Numbers (Items)", singular: "item", endpoint: "items",
    fields: [
      { key: "number", label: "Part no. (blank = auto)" },
      { key: "displayName", label: "Description", required: true },
      { key: "type", label: "Type", options: ["Inventory", "Service", "Non-Inventory"] },
      { key: "baseUnitOfMeasureCode", label: "Unit of measure (e.g. RECS)" },
      { key: "unitPrice", label: "Unit price", type: "number" },
      { key: "unitCost", label: "Unit cost", type: "number" },
      { key: "generalProductPostingGroupCode", label: "Gen. Prod. Posting Group", defaultFrom: "itemDefaults", upper: true },
      { key: "inventoryPostingGroupCode", label: "Inventory Posting Group", defaultFrom: "itemDefaults", upper: true }
    ],
    columns: [["number","Part no."],["displayName","Description"],["type","Type"],["baseUnitOfMeasureCode","UoM"],["generalProductPostingGroupCode","Gen. Prod."],["inventoryPostingGroupCode","Inv. Posting"],["inventory","Inventory"]]
  },
  vendors: {

    fields: [
      { key: "number", label: "Supplier ID", kind: "noSeries" },
      { key: "displayName", label: "Name", required: true, upper: true },
      { key: "email", label: "Email (separate several with ;)", kind: "emails" },
      { key: "phoneNumber", label: "Phone" },
      { key: "addressLine1", label: "Address", upper: true },
      { key: "addressLine2", label: "Address 2", upper: true },
      { key: "city", label: "City", upper: true },
      { key: "postalCode", label: "Postal code", upper: true },
      { key: "country", label: "Country code (e.g. MY)", upper: true },
      { key: "paymentTerms", label: "Payment Terms Code", kind: "paymentTerms" }
    ],
    columns: [["number","Supplier ID"],["displayName","Name"],["email","Email"],["phoneNumber","Phone"],["city","City"]]
  },
  customers: {
    title: "Customers", singular: "customer", endpoint: "customers",
    fields: [
      { key: "displayName", label: "Customer name", required: true, upper: true },
      { key: "email", label: "Email (separate several with ;)", kind: "emails" },
      { key: "phoneNumber", label: "Phone" },
      { key: "addressLine1", label: "Address", upper: true },
      { key: "addressLine2", label: "Address 2", upper: true },
      { key: "city", label: "City", upper: true },
      { key: "postalCode", label: "Postal code", upper: true },
      { key: "country", label: "Country code (e.g. MY)", upper: true },
      { key: "paymentTerms", label: "Payment Terms Code", kind: "paymentTerms" },
      { key: "genBusPostingGroup", label: "Gen. Bus. Posting Group", required: true, ext: true, optionsFrom: "genBusPostingGroups" },
      { key: "customerPostingGroup", label: "Customer Posting Group", required: true, ext: true, optionsFrom: "customerPostingGroups" },
      { key: "taxIdentificationNo", label: "Tax Identification No. (TIN)", ext: true, upper: true },
      { key: "idType", label: "ID Type", ext: true, optionsFrom: "idTypes" },
      { key: "idNo", label: "ID No.", ext: true, upper: true }
    ],
    noteAuto: "Customer ID is given automatically by BC.",
    columns: [["number","Customer ID"],["displayName","Name"],["email","Email"],["phoneNumber","Phone"],["city","City"]]
  }
};

const ORDERS = {
  po: {
    title: "Purchase Orders", endpoint: "purchaseOrders", linesEndpoint: "purchaseOrderLines",
    partyKey: "vendorNumber", partyLabel: "Supplier", partyLookup: "vendors",
    priceKey: "directUnitCost", priceLabel: "Unit cost",
    extKey: null,
    postAction: "receiveAndInvoice",
    stepLabel: "Receive", stepVerb: "receive", stepPast: "received",
    stepQtyKey: "receiveQuantity",
    doneQtyKey: "receivedQuantity",
    columns: [["number","PO no."],["vendorNumber","Supplier"],["vendorName","Name"],["orderDate","Date"],["status","Status"],["totalAmountIncludingTax","Total"]]
  },
  so: {

/* next number from a BC number series (Saxon Portal API v1.2) */
async function nextNumberFrom(seriesCode) {
  const a = CONFIG.lineExtApi;
  const url = `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/nextNumbers`;
  try {
    const r = await bcFetch(url, { method: "POST", body: JSON.stringify({ seriesCode }) });
    if (!r || !r.number) throw new Error("BC returned no number");
    return r.number;
  } catch (e) {
    if (/404|not found|No HTTP resource|BadRequest_NotFound/i.test(e.message))
      throw new Error(`Could not take a number from ${seriesCode}: the Saxon Portal API extension v1.2 is not installed yet. Choose "Type the ID myself" for now.`);
    throw new Error(`Could not take a number from ${seriesCode}: ${e.message}`);
  }
}
const paymentTermsLookup = () => cached("paymentTerms", () => coAll("/paymentTerms?$select=id,code,displayName"));

function buildMaster(key) {
  const def = MASTER[key];
  const listBox = h("div", { class: "tablewrap" });
  const controls = {};   // key -> { get(), reset() }

  const fieldEls = def.fields.map(f => {
    const def0 = f.defaultFrom ? ((SETTINGS[f.defaultFrom] || {})[f.key] || "") : "";

      if (series.length) {

      controls[f.key] = { get: () => input.value, reset() { input.value = ""; } };

      controls[f.key] = { get: () => input.value, reset() { input.value = ""; } };

  /* read + check the form; nothing is sent to BC here */
  async function collect() {
    const body = {}, extBody = {}, shown = [];
    let series = null;
    for (const f of def.fields) {
      const v = controls[f.key].get();
      if (f.kind === "noSeries") {
        if (v.series) { series = v.series; shown.push([f.label, `Next number from ${v.series} (taken when you click Create)`]); }
        else if (v.value) { body.number = v.value; shown.push([f.label, v.value]); }
        else shown.push([f.label, "(BC default)"]);
        continue;
      }
      if (v === "") {
        if (f.required) throw new Error(`Please fill in ${f.label}.`);
        shown.push([f.label, ""]); continue;
      }
      if (f.ext) {
        extBody[f.key] = f.upper ? v.toUpperCase() : v;
        const o = (((SETTINGS.customerSetup || {})[f.optionsFrom]) || []).find(x => x.code === v);
        shown.push([f.label, o && o.desc && o.desc !== o.code ? `${v} – ${o.desc}` : extBody[f.key]]); continue;
      }
      if (f.kind === "paymentTerms") {
        const pt = (await paymentTermsLookup()).find(x => String(x.code).toUpperCase() === v.toUpperCase());
        if (!pt) throw new Error(`Payment terms ${v} does not exist in this company in BC.`);
        body.paymentTermsId = pt.id;
        const t = (SETTINGS.paymentTerms || []).flatMap(g => g.terms).find(x => x.code === v);
        shown.push([f.label, t ? `${v} – ${t.desc}` : v]); continue;
      }
      if (f.kind === "emails") {
        const list = v.split(";").map(x => x.trim()).filter(Boolean);
        const bad = list.filter(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
        if (bad.length) throw new Error("Email not valid: " + bad.join(", "));
        body.email = list.join(";"); shown.push([f.label, body.email]); continue;
      }
      body[f.key] = f.type === "number" ? Number(v) : (f.upper ? v.toUpperCase() : v);
      shown.push([f.label, String(body[f.key])]);
    }
    // duplicate checks against what is already in BC
    const warnings = [];
    try {
      const existing = await lookups[def.endpoint]();
      if (body.number && existing.some(r => String(r.number).toUpperCase() === body.number.toUpperCase()))
        throw new Error(`${def.fields[0].label} ${body.number} already exists in BC.`);

    } catch (e) { if (/already exists/.test(e.message)) throw e; }

      warnings.push("The Saxon Portal API extension v1.3 is not installed yet, so posting groups and MyInvois fields will NOT be set – you would need to fill them in BC.");
    if (def.noteAuto) shown.unshift([def.fields[0].key === "displayName" ? "Customer ID" : "ID", "(given automatically by BC)"]);

        h("thead", {}, h("tr", {}, h("th", {}, "Field"), h("th", {}, "Value written to BC"))),
        h("tbody", {}, p.shown.map(([k, v]) => h("tr", {}, h("td", {}, k),

      h("div", { class: "row-actions" },

        createBtn));

  }
  function backToEdit() { previewCard.classList.add("hidden"); form.classList.remove("hidden"); }

  form.addEventListener("submit", async ev => {

      setStatus(pending.warnings.length ? "Preview ready – please check the notes, then Create or go back." : "Preview ready. Check it, then click Create.", pending.warnings.length ? "warn" : "ok");

    finally { btn.disabled = false; }

  const createBtn = h("button", { type: "button", onclick: create }, "Create in BC");

/* ---------- Microsoft Graph (SharePoint list) ---------- */
async function getGraphToken() {
  const req = { scopes: CONFIG.graph.scopes, account };
  try {
    return (await msalApp.acquireTokenSilent(req)).accessToken;
  } catch (e) {
    // first use: the user (or an admin) must consent to the SharePoint permission
    try { return (await msalApp.acquireTokenPopup(req)).accessToken; }
    catch (e2) {
      if (/popup/i.test(e2.message || "")) { await msalApp.acquireTokenRedirect(req); throw new Error("Re-authenticating..."); }
      throw new Error("SharePoint sign-in failed: " + (e2.message || e2));
    }
  }
}
async function graphFetch(path, options = {}) {
  const token = await getGraphToken();
  const res = await fetch(path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path, {
    ...options,
    headers: { "Authorization": "Bearer " + token, "Accept": "application/json", "Content-Type": "application/json", ...(options.headers || {}) }
  });
  if (!res.ok) {
    const err = new Error(`SharePoint ${res.status}: ${niceError(await res.text())}`);
    err.status = res.status; throw err;
  }
  return res.status === 204 ? null : res.json();
}

/* BC* columns this tab writes. Display names as created in the list (see setup checklist). */

let spCtx = null;   // { siteId, listId, col: displayName -> internal name }
async function spContext() {
  if (spCtx) return spCtx;
  const g = CONFIG.graph;
  const site = await graphFetch(`/sites/${g.siteHost}:${g.sitePath}?$select=id`);
  const cols = await graphFetch(`/sites/${site.id}/lists/${g.assetListId}/columns?$select=name,displayName`);
  const col = {};
  cols.value.forEach(c => { col[c.displayName] = c.name; });
  const missing = Object.values(QCOL).filter(d => !col[d]);
  if (missing.length) throw new Error(`The Asset Approval Record List is missing these columns: ${missing.join(", ")}. Add them in SharePoint (see the setup checklist), then click Refresh.`);
  spCtx = { siteId: site.id, listId: g.assetListId, col };
  return spCtx;
}
function itemUrl(ctx, id) { return `/sites/${ctx.siteId}/lists/${ctx.listId}/items/${id}`; }
async function spAllItems() {
  const ctx = await spContext();
  const out = [];
  let url = `/sites/${ctx.siteId}/lists/${ctx.listId}/items?$expand=fields&$top=500`;
  while (url) {
    const d = await graphFetch(url);
    out.push(...d.value.map(i => ({ id: i.id, eTag: i.eTag, f: i.fields || {} })));
    url = d["@odata.nextLink"];
  }
  return out;
}
async function spGetItem(id) {
  const ctx = await spContext();
  const i = await graphFetch(itemUrl(ctx, id) + "?$expand=fields");
  return { id: i.id, eTag: i.eTag, f: i.fields || {} };
}
/* write { displayName: value } to one list item; If-Match makes it fail with 412 when someone changed it first */
async function spWrite(id, byDisplayName, eTag) {
  const ctx = await spContext();
  const body = {};
  for (const [d, v] of Object.entries(byDisplayName)) if (ctx.col[d]) body[ctx.col[d]] = v;
  return graphFetch(itemUrl(ctx, id) + "/fields", { method: "PATCH", headers: eTag ? { "If-Match": eTag } : {}, body: JSON.stringify(body) });
}
function fv(item, displayName) {
  const name = spCtx && spCtx.col[displayName];
  const v = name ? item.f[name] : undefined;
  return v == null ? "" : String(v).trim();
}

/* ---------- prefill helpers ---------- */
const COUNTRY_NAMES = { MALAYSIA: "MY", SINGAPORE: "SG", INDONESIA: "ID", VIETNAM: "VN", "VIET NAM": "VN", THAILAND: "TH",
  PHILIPPINES: "PH", CHINA: "CN", "HONG KONG": "HK", TAIWAN: "TW", JAPAN: "JP", KOREA: "KR", INDIA: "IN", AUSTRALIA: "AU",
  "UNITED KINGDOM": "GB", "UNITED STATES": "US", USA: "US" };
const MY_STATES = /^(JOHOR|KEDAH|KELANTAN|MELAKA|MALACCA|NEGERI SEMBILAN|PAHANG|PERAK|PERLIS|PULAU PINANG|PENANG|SABAH|SARAWAK|SELANGOR|TERENGGANU|WILAYAH PERSEKUTUAN.*|W\.?P\.?.*|KUALA LUMPUR|PUTRAJAYA|LABUAN)$/i;

/* "Lot 1, Jalan X\n50450 Kuala Lumpur, Wilayah Persekutuan\nMalaysia" -> BC address fields */
function splitAddress(text) {
  const out = { addressLine1: "", addressLine2: "", city: "", postalCode: "", country: "", notes: [] };
  let parts = String(text || "").split(/\r?\n/).map(s => s.trim().replace(/,$/, "").trim()).filter(Boolean);
  const oneLine = parts.length === 1;
  if (oneLine) parts = parts[0].split(/,\s*/).map(s => s.trim()).filter(Boolean);
  if (!parts.length) return out;
  // trailing country name
  const last = parts[parts.length - 1].toUpperCase().replace(/\.$/, "");
  if (COUNTRY_NAMES[last]) { out.country = COUNTRY_NAMES[last]; parts.pop(); }
  // the part holding a 5 or 6 digit postcode gives postcode + city
  let pcIdx = -1;
  for (let i = parts.length - 1; i >= 0; i--) if (/\b\d{5,6}\b/.test(parts[i])) { pcIdx = i; break; }
  if (pcIdx >= 0) {
    const p = parts[pcIdx];
    const m = p.match(/\b(\d{5,6})\b/);
    out.postalCode = m[1];
    if (m[1].length === 6 && !out.country) out.country = "SG";
    let rest = p.replace(m[0], " ").replace(/\s{2,}/g, " ").replace(/^[\s,]+|[\s,]+$/g, "");
    let cityBits = rest.split(/,\s*/).filter(Boolean);
    // trailing state / country words are not the city
    while (cityBits.length > 1 && (MY_STATES.test(cityBits[cityBits.length - 1]) || COUNTRY_NAMES[cityBits[cityBits.length - 1].toUpperCase()])) {
      const w = cityBits.pop().toUpperCase();
      if (COUNTRY_NAMES[w] && !out.country) out.country = COUNTRY_NAMES[w];
    }
    let city = cityBits.join(", ");
    if (COUNTRY_NAMES[city.toUpperCase()]) { if (!out.country) out.country = COUNTRY_NAMES[city.toUpperCase()]; if (city.toUpperCase() !== "SINGAPORE") city = ""; }
    // the line after the postcode line may be a state (MY) - drop it
    const after = parts.slice(pcIdx + 1).filter(x => !MY_STATES.test(x));
    out.city = city;
    parts = parts.slice(0, pcIdx).concat(after);
    // postcode on its own line: city is probably the next part
    if (!out.city && after.length) { out.city = after[0]; parts = parts.slice(0, pcIdx).concat(after.slice(1)); }
  } else {
    out.notes.push("No postcode found in the invoice address – please check city and postcode.");
  }
  // first line -> Address, the rest -> Address 2 (BC: 100 / 50 characters)
  out.addressLine1 = parts.shift() || "";
  // one-line address split on commas: keep filling Address up to BC's 100 characters
  while (oneLine && parts.length && (out.addressLine1 + ", " + parts[0]).length <= 100) out.addressLine1 += ", " + parts.shift();
  out.addressLine2 = parts.join(", ");
  if (out.addressLine1.length > 100) { out.addressLine2 = (out.addressLine1.slice(100) + ", " + out.addressLine2).replace(/,\s*$/, ""); out.addressLine1 = out.addressLine1.slice(0, 100); }
  if (out.addressLine2.length > 50) out.notes.push("Address 2 is longer than BC allows (50 characters) – please shorten it.");
  if (out.city.length > 30) out.notes.push("City is longer than BC allows (30 characters) – please shorten it.");
  return out;
}

/* free-text payment term from the deal -> a BC payment terms code from presets.js (or "" if unsure) */
function matchPaymentTerm(text) {
  const t = String(text || "").toLowerCase();
  if (!t) return "";
  const known = new Set((SETTINGS.paymentTerms || []).flatMap(g => g.terms.map(x => x.code)));
  const direct = String(text).trim().toUpperCase();
  if (known.has(direct)) return direct;
  const m = t.match(/(\d+)/);
  const n = m ? Number(m[1]) : null;
  let code = "";
  if (/advance/.test(t) && !/down\s*payment|\bdp\b/.test(t)) code = "ADV100";
  else if (n == null) code = "";
  else if (/business|working/.test(t) && /deliver/.test(t)) code = n === 1 ? "BINV1" : `DEL${n}BD`;
  else if (/business|working/.test(t)) code = /invoice/.test(t) ? `BINV${n}` : (n === 7 ? "7BD" : `BINV${n}`);
  else if (/invoice/.test(t)) code = `INV${n}`;
  else if (/day/.test(t) || /\bnet\b/.test(t) || /^\s*\d+\s*d?\s*$/.test(t)) code = String(n).padStart(2, "0") + "D";
  return known.has(code) ? code : "";
}

function buildSupplierQueue() {
  const listBox = h("div", { class: "tablewrap" });
  const reviewBox = h("div", {});
  const note = h("p", { class: "muted small", style: "margin:.25rem 0 .5rem" });
  const filter = h("input", { type: "search", placeholder: "Search Asset ID or company", style: "max-width:280px" });
  const btnPending = h("button", { type: "button", class: "small" }, "Pending");
  const btnDone = h("button", { type: "button", class: "small ghost" }, "Processed");
  let view = "pending", groups = [], openKey = null;

  function setView(v) {
    view = v;
    btnPending.className = "small" + (v === "pending" ? "" : " ghost");
    btnDone.className = "small" + (v === "done" ? "" : " ghost");
    reviewBox.replaceChildren(); openKey = null;
    draw();
  }
  btnPending.addEventListener("click", () => setView("pending"));
  btnDone.addEventListener("click", () => setView("done"));
  filter.addEventListener("input", () => draw());

  /* list items -> one group per deal (Asset ID + Entity), split into pending / processed */
  function groupItems(items) {
    const since = queueSettings().since ? new Date(queueSettings().since) : null;
    const map = new Map();
    for (const it of items) {
      const st = fv(it, QCOL.status);
      const done = [QSTATUS.created, QSTATUS.linked, QSTATUS.rejected].includes(st);
      const assetId = fv(it, "Asset ID (Assigned to BD)") || `(item ${it.id})`;
      const entity = fv(it, "Entity").toUpperCase();
      const key = `${assetId}|${entity}|${done ? "done:" + st + ":" + fv(it, QCOL.vendorNo) : "open"}`;
      if (!map.has(key)) map.set(key, { key, assetId, entity, done, items: [] });
      map.get(key).items.push(it);
    }
    const out = [...map.values()];
    out.forEach(g => {
      g.items.sort((a, b) => Number(a.id) - Number(b.id));
      g.primary = g.items[0];
      g.status = fv(g.primary, QCOL.status) || QSTATUS.pending;
      g.approvedDate = fv(g.primary, "Approved Date");
      const d = new Date(g.approvedDate);
      g.approvedTime = isNaN(d) ? null : d;
      g.company = fv(g.primary, "Agreement Company Name") || fv(g.primary, "Supplier");
      g.beforeCutoff = !g.done && since && g.approvedTime && g.approvedTime < since;
    });
    // remember earlier results for the same Asset ID (shown as a hint on new items)
    out.forEach(g => { if (!g.done) g.earlier = out.filter(x => x.done && x.assetId === g.assetId && x.entity === g.entity && x.status !== QSTATUS.rejected); });
    return out.sort((a, b) => (b.approvedTime || 0) - (a.approvedTime || 0));
  }

  function statusTag(st) {
    const cls = st === QSTATUS.created || st === QSTATUS.linked ? "tag ok" : st === QSTATUS.rejected || st === QSTATUS.creating ? "tag warn" : "tag";
    return h("span", { class: cls }, st === QSTATUS.creating ? "Interrupted – retry" : st);
  }
  const fmtDate = d => d ? d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }) : "";

  function draw() {
    const g0 = companyGroup();
    const q = filter.value.trim().toLowerCase();
    const mine = groups.filter(g => g.entity === g0);
    const others = groups.filter(g => g.entity !== g0 && !g.done && !g.beforeCutoff);
    const rows = mine.filter(g => (view === "pending" ? (!g.done && !g.beforeCutoff) : g.done) &&
      (!q || g.assetId.toLowerCase().includes(q) || g.company.toLowerCase().includes(q)));
    const pendingCount = mine.filter(g => !g.done && !g.beforeCutoff).length;
    setTabBadge(pendingCount);
    note.replaceChildren(
      `Showing ${g0 || "?"} deals for ${companyName()}.`,
      others.length ? ` ${others.length} pending deal(s) belong to the other company – switch company at the top to see them.` : "",
      view === "pending" && queueSettings().since ? ` Deals approved before ${queueSettings().since} are not listed.` : "");
    if (!g0) { listBox.replaceChildren(h("p", { class: "muted" }, "This company is not matched to MY or SG in presets.js (companyGroups).")); return; }
    if (!rows.length) { listBox.replaceChildren(h("p", { class: "muted" }, view === "pending" ? "Nothing waiting." : "No processed deals yet.")); return; }
    if (view === "pending") {
      listBox.replaceChildren(h("table", {},
        h("thead", {}, h("tr", {}, ["Asset ID", "Company", "Agreement type", "Approved", "Products", "Status", ""].map(x => h("th", {}, x)))),
        h("tbody", {}, rows.map(g => h("tr", {},
          h("td", {}, g.assetId), h("td", { class: "wrap" }, g.company),
          h("td", {}, fv(g.primary, "Agreement Type")), h("td", {}, fmtDate(g.approvedTime)),
          h("td", { class: "num" }, String(g.items.length)), h("td", {}, statusTag(g.status)),
          h("td", {}, h("button", { type: "button", class: "small" + (openKey === g.key ? "" : " ghost"), onclick: () => openReview(g) }, "Review")))))));
    } else {
      listBox.replaceChildren(h("table", {},
        h("thead", {}, h("tr", {}, ["Asset ID", "Company", "Result", "BC Vendor No.", "BC company", "Reviewed by", "Date", "Reason"].map(x => h("th", {}, x)))),
        h("tbody", {}, rows.map(g => { const d = new Date(fv(g.primary, QCOL.reviewedDate)); return h("tr", {},
          h("td", {}, g.assetId), h("td", { class: "wrap" }, g.company), h("td", {}, statusTag(g.status)),
          h("td", {}, fv(g.primary, QCOL.vendorNo)), h("td", { class: "wrap" }, fv(g.primary, QCOL.company)),
          h("td", {}, fv(g.primary, QCOL.reviewedBy)), h("td", {}, isNaN(d) ? "" : fmtDate(d)),
          h("td", { class: "wrap" }, fv(g.primary, QCOL.rejectReason))); }))));
    }
  }

  async function refresh() {
    listBox.replaceChildren(h("p", { class: "muted" }, "Loading the Asset Approval Record List..."));
    try {
      groups = groupItems(await spAllItems());
      draw();
      if (openKey) { const g = groups.find(x => x.key === openKey && !x.done); if (g) openReview(g); else { reviewBox.replaceChildren(); openKey = null; } }
    } catch (e) {
      listBox.replaceChildren(h("p", { class: "muted" }, "Could not load the list: " + e.message));
    }
  }
  refreshers.supplierQueue = refresh;

  /* ---------- review card for one deal ---------- */
  async function openReview(g) {
    openKey = g.key; draw();
    reviewBox.replaceChildren(h("div", { class: "card" }, h("p", { class: "muted" }, "Preparing review...")));
    try { reviewBox.replaceChildren(await buildReview(g)); reviewBox.scrollIntoView({ behavior: "smooth", block: "start" }); }
    catch (e) { reviewBox.replaceChildren(h("div", { class: "card" }, h("p", {}, "Could not prepare the review: " + e.message))); }
  }

  async function buildReview(g) {
    const p = g.primary, vs = vendorSetup(), grp = companyGroup();
    const series = queueSettings().noSeries || "PP-VENNO1";
    const [hasVendorExt, hasBankExt] = await Promise.all([lineExtAvailable("vendors"), lineExtAvailable("vendorBanks")]);
    let myInvois = false;
    if (hasVendorExt && grp === "MY") {
      try { const d = await bcFetch(extBase("vendors") + "?$top=1&$select=myInvoisFieldsAvailable"); myInvois = !!(d.value[0] && d.value[0].myInvoisFieldsAvailable); }
      catch { myInvois = false; }
    }

    // ----- prefill -----
    const addr = splitAddress(fv(p, "Invoice Address"));
    const country = (addr.country || fv(p, "Device Country") || g.entity || "").toUpperCase();
    const ptText = fv(p, "Payment Term");
    const ptCode = matchPaymentTerm(ptText);
    const dealCcy = fv(p, "Currency").toUpperCase();
    const lcy = (vs.localCurrency || { MY: "MYR", SG: "SGD" })[grp] || "";
    const isLocal = country === grp;
    const d = vs.defaults || {};
    const regNo = fv(p, "Registration Number");
    const residential = /^y/i.test(fv(p, "Residential"));
    const swift = fv(p, "Swift Code").toUpperCase().replace(/\s/g, "");
    const pre = {
      displayName: (fv(p, "Agreement Company Name") || fv(p, "Supplier")).toUpperCase(),
      email: (fv(p, "Finance Email") || fv(p, "Email")).replace(/[,\s]+/g, ";").replace(/;+/g, ";").replace(/^;|;$/g, ""),
      phoneNumber: fv(p, "Phone Number"),
      addressLine1: addr.addressLine1.toUpperCase(), addressLine2: addr.addressLine2.toUpperCase(),
      city: addr.city.toUpperCase(), postalCode: addr.postalCode, country,
      paymentTerms: ptCode, currencyCode: dealCcy && dealCcy !== lcy ? dealCcy : "",
      genBusPostingGroup: isLocal ? (d.genBusLocal || "LOCAL") : (d.genBusOverseas || "OVERSEAS"),
      vendorPostingGroup: d.vendorPostingGroup || "TRADE",
      vatBusPostingGroup: isLocal ? (d.vatBusLocal || "LOCAL") : (d.vatBusOverseas || "EXPORT"),
      registrationNumber: regNo,
      taxIdentificationNo: "", idType: residential ? "NRIC" : "BRN", idNo: regNo,
      bankName: fv(p, "Bank Name").toUpperCase(), bankAccountNo: fv(p, "Bank Account Number").replace(/\s/g, ""),
      swiftCode: swift, bankCode: (swift || "MAIN").slice(0, 20)
    };

    // ----- form -----
    const ctl = {};
    const opt = list => (list || []).map(o => typeof o === "string" ? { code: o } : o);
    function input(key, label, o = {}) {
      let el;
      if (o.options) {
        el = h("select", {}, h("option", { value: "" }, o.required ? "(choose)" : "(none)"),
          opt(o.options).map(x => h("option", { value: x.code }, x.desc && x.desc !== x.code ? `${x.code} – ${x.desc}` : x.code)));
        if (pre[key] && ![...el.options].some(x => x.value === pre[key])) el.append(h("option", { value: pre[key] }, pre[key] + " (not in presets)"));
        el.value = pre[key] || "";
      } else if (o.groups) {
        el = h("select", {}, h("option", { value: "" }, "(none)"),
          o.groups.map(gr => h("optgroup", { label: gr.group }, gr.terms.map(t => h("option", { value: t.code }, `${t.code} – ${t.desc}`)))));
        el.value = pre[key] || "";
      } else {
        el = h("input", { type: "text", value: pre[key] || "", class: o.upper ? "upper" : undefined, maxlength: o.max ? String(o.max) : undefined });
      }
      ctl[key] = { el, label, o, get: () => { const v = el.value.trim(); return o.upper ? v.toUpperCase() : v; } };
      return h("label", { class: o.span ? "span2" : undefined }, label + (o.required ? " *" : ""), el, o.hint ? h("div", { class: "muted small" }, o.hint) : "");
    }
    function copyBtn(key) {
      return h("button", { type: "button", class: "small ghost", style: "margin-top:.2rem", onclick: async ev => {
        try { await navigator.clipboard.writeText(ctl[key].get()); ev.target.textContent = "Copied"; setTimeout(() => ev.target.textContent = "Copy", 1200); } catch {} } }, "Copy");
    }

    const vendorFields = h("div", { class: "grid" },
      h("label", {}, "Supplier ID", h("input", { type: "text", value: `${series} (next no.)`, disabled: true }), h("div", { class: "muted small" }, "Fixed for asset suppliers")),
      input("displayName", "Name", { required: true, upper: true, max: 100, span: true }),
      input("email", "Email (separate several with ;)", { max: 80, span: true }),
      input("phoneNumber", "Phone", { max: 30 }),
      input("addressLine1", "Address", { upper: true, max: 100, span: true }),
      input("addressLine2", "Address 2", { upper: true, max: 50 }),
      input("city", "City", { upper: true, max: 30 }),
      input("postalCode", "Postal code", { upper: true, max: 20 }),
      input("country", "Country code", { upper: true, max: 10 }),
      input("paymentTerms", "Payment Terms Code", { groups: SETTINGS.paymentTerms || [], hint: `Deal says: “${ptText || "(blank)"}”` + (ptCode ? "" : " – no match, please choose") }),
      input("currencyCode", "Currency (blank = " + (lcy || "local") + ")", { upper: true, max: 10, hint: `Deal currency: ${dealCcy || "(blank)"}` }));

    const regLabel = input("registrationNumber", "Registration Number", { upper: true, max: 50 });
    const extFields = h("div", { class: "grid" },
      input("genBusPostingGroup", "Gen. Bus. Posting Group", { required: true, ext: true, options: vs.genBusPostingGroups || (SETTINGS.customerSetup || {}).genBusPostingGroups }),
      input("vendorPostingGroup", "Vendor Posting Group", { required: true, ext: true, options: vs.vendorPostingGroups }),
      input("vatBusPostingGroup", "VAT Bus. Posting Group", { required: true, ext: true, options: vs.vatBusPostingGroups || (SETTINGS.vatGroups || {}).po }),
      ...(hasVendorExt ? [regLabel] : []),
      ...(myInvois ? [
        input("taxIdentificationNo", "Tax Identification No. (TIN)", { upper: true, max: 100, hint: "Not captured in Trade Confirmation – optional" }),
        input("idType", "ID Type", { options: vs.idTypes || (SETTINGS.customerSetup || {}).idTypes, hint: residential ? "Residential = Yes → NRIC" : "Residential = No → BRN" }),
        input("idNo", "ID No.", { upper: true, max: 100 })
      ] : []));

    const bankFields = h("div", { class: "grid" },
      h("div", {}, input("bankName", "Bank name", { upper: true, max: 100 }), copyBtn("bankName")),
      h("div", {}, input("bankAccountNo", "Bank account no.", { max: 30 }), copyBtn("bankAccountNo")),
      h("div", {}, input("swiftCode", "SWIFT code", { upper: true, max: 20 }), copyBtn("swiftCode")),
      hasBankExt ? input("bankCode", "Bank account code in BC", { upper: true, max: 20, hint: "SWIFT code, or MAIN" }) : "",
      hasVendorExt ? "" : h("div", {}, regLabel, copyBtn("registrationNumber")));

    // ----- duplicate check -----
    const dupBox = h("div", {});
    const linkArea = h("div", {});
    let matches = [];
    async function runDupCheck() {
      dupBox.replaceChildren(h("p", { class: "muted small" }, "Checking BC for existing suppliers..."));
      try {
        const vendors = await lookups.vendors();
        const byNo = new Map(vendors.map(v => [v.number, v]));
        const found = new Map();
        const reg = ctl.registrationNumber.get();
        if (reg && hasVendorExt) {
          try {
            const r = await bcFetch(extBase("vendors") + `?$filter=registrationNumber eq '${reg.replace(/'/g, "''")}'&$select=number,displayName,registrationNumber`);
            r.value.forEach(x => found.set(x.number, { ...(byNo.get(x.number) || x), why: "same registration number" }));
          } catch {}
        }
        const k = nameKey(ctl.displayName.get());
        if (k.length >= 3) vendors.forEach(v => {
          const vk = nameKey(v.displayName);
          if (!found.has(v.number) && vk && (vk === k || (vk.length >= 6 && k.length >= 6 && (vk.includes(k) || k.includes(vk)))))
            found.set(v.number, { ...v, why: vk === k ? "same name" : "similar name" });
        });
        (g.earlier || []).forEach(e => { const no = fv(e.primary, QCOL.vendorNo); if (no && !found.has(no)) found.set(no, { ...(byNo.get(no) || { number: no, displayName: "" }), why: `used for this Asset ID before (${e.status})` }); });
        matches = [...found.values()];
        dupBox.replaceChildren(matches.length
          ? h("div", { class: "fx" }, h("h2", {}, "This supplier may already exist in BC"),
              h("table", {}, h("thead", {}, h("tr", {}, ["Vendor", "Name", "City", "Why", ""].map(x => h("th", {}, x)))),
                h("tbody", {}, matches.map(m => h("tr", {}, h("td", {}, m.number), h("td", { class: "wrap" }, m.displayName || ""),
                  h("td", {}, m.city || ""), h("td", {}, h("span", { class: "tag warn" }, m.why)),
                  h("td", {}, h("button", { type: "button", class: "small ghost", onclick: () => prepareLink(m) }, "Link…")))))))
          : h("p", { class: "small" }, h("span", { class: "tag ok" }, "No match"), " No existing BC supplier with this name or registration number."));
      } catch (e) { dupBox.replaceChildren(h("p", { class: "muted small" }, "Duplicate check failed: " + e.message)); }
    }

    // ----- link: compare first, then confirm -----
    async function prepareLink(m) {
      linkArea.replaceChildren(h("p", { class: "muted small" }, `Loading ${m.number} from BC...`));
      try {
        const v = (await co(`/vendors?$filter=number eq '${m.number.replace(/'/g, "''")}'`)).value[0];
        if (!v) throw new Error(`Vendor ${m.number} was not found in this company.`);
        const diffs = [];
        const cmp = (label, a, b) => { if (normName(a) !== normName(b)) diffs.push([label, a || "", b || ""]); };
        cmp("Name", ctl.displayName.get(), v.displayName); cmp("Email", ctl.email.get(), v.email);
        cmp("Phone", ctl.phoneNumber.get(), v.phoneNumber); cmp("Address", ctl.addressLine1.get(), v.addressLine1);
        cmp("City", ctl.city.get(), v.city); cmp("Postal code", ctl.postalCode.get(), v.postalCode);
        cmp("Country", ctl.country.get(), v.country); cmp("Currency", ctl.currencyCode.get(), v.currencyCode);
        if (hasBankExt) {
          try {
            const b = await bcFetch(extBase("vendorBanks") + `?$filter=vendorNumber eq '${m.number.replace(/'/g, "''")}'`);
            const acct = ctl.bankAccountNo.get();
            if (acct && !b.value.some(x => normName(x.bankAccountNo) === normName(acct)))
              diffs.push(["Bank account", acct, b.value.map(x => `${x.code}: ${x.bankAccountNo}`).join("; ") || "(none)"]);
          } catch {}
        }
        if (v.blocked && String(v.blocked).trim()) diffs.push(["Blocked", "", String(v.blocked)]);
        linkArea.replaceChildren(h("div", { class: "fx" },
          h("h2", {}, `Link Asset ${g.assetId} to ${v.number} – ${v.displayName}`),
          h("p", { class: "small" }, "Linking does not change anything in BC. It only records this vendor on the deal."),
          diffs.length
            ? h("div", {}, h("p", { class: "small" }, h("span", { class: "tag warn" }, "Differences"), " The deal and the BC vendor differ – update the vendor card in BC yourself if needed:"),
                h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Field"), h("th", {}, "Deal"), h("th", {}, "BC vendor"))),
                  h("tbody", {}, diffs.map(([a, b, c]) => h("tr", {}, h("td", {}, a), h("td", { class: "wrap" }, b), h("td", { class: "wrap" }, c))))))
            : h("p", { class: "small" }, h("span", { class: "tag ok" }, "Same"), " The deal details match the BC vendor."),
          h("div", { class: "row-actions" },
            h("button", { type: "button", class: "ghost", onclick: () => linkArea.replaceChildren() }, "Cancel"),
            h("button", { type: "button", onclick: ev => doLink(v, ev.target) }, `Confirm link to ${v.number}`))));
      } catch (e) { linkArea.replaceChildren(h("p", {}, "Could not load the vendor: " + e.message)); }
    }

    // ----- reject -----
    const rejectReason = h("input", { type: "text", placeholder: "Reason (required), e.g. wrong counterparty – deal is for ABC Holdings" });
    const rejectArea = h("div", { class: "fx hidden" }, h("h2", {}, "Reject"),
      h("label", {}, "Reason", rejectReason),
      h("div", { class: "row-actions" },
        h("button", { type: "button", class: "ghost", onclick: () => rejectArea.classList.add("hidden") }, "Cancel"),
        h("button", { type: "button", class: "danger", onclick: ev => doReject(ev.target) }, "Confirm reject")));

    // ----- actions -----
    const me = account.username;
    const nowIso = () => new Date().toISOString();
    const staleMs = (queueSettings().staleCreatingMinutes || 15) * 60000;

    /* take the deal: refuses if someone else finished it or is busy with it */
    async function claim(newStatus) {
      const fresh = await spGetItem(p.id);
      const st = fv(fresh, QCOL.status), by = fv(fresh, QCOL.reviewedBy);
      if ([QSTATUS.created, QSTATUS.linked, QSTATUS.rejected].includes(st))
        throw new Error(`Already ${st.toLowerCase()} by ${by || "someone"} – refresh the list.`);
      if (st === QSTATUS.creating && by && by.toLowerCase() !== me.toLowerCase()) {
        const t = new Date(fv(fresh, QCOL.reviewedDate));
        if (!isNaN(t) && Date.now() - t < staleMs) throw new Error(`${by} is handling this deal right now (started ${t.toLocaleTimeString()}).`);
      }
      try { await spWrite(p.id, { [QCOL.status]: newStatus, [QCOL.reviewedBy]: me, [QCOL.reviewedDate]: nowIso(), [QCOL.company]: companyName() }, fresh.eTag); }
      catch (e) { if (e.status === 412) throw new Error("Someone else just started on this deal – refresh the list."); throw e; }
      await new Promise(r => setTimeout(r, 1200));
      const check = await spGetItem(p.id);
      if (fv(check, QCOL.reviewedBy).toLowerCase() !== me.toLowerCase()) throw new Error(`${fv(check, QCOL.reviewedBy)} started on this deal at the same moment – refresh the list.`);
      return fresh;   // the state before we claimed it (holds the number of an interrupted attempt)
    }
    async function finish(status, vendorNo, reason) {
      const vals = { [QCOL.status]: status, [QCOL.vendorNo]: vendorNo || "", [QCOL.company]: companyName(),
                     [QCOL.reviewedBy]: me, [QCOL.reviewedDate]: nowIso(), [QCOL.rejectReason]: reason || "" };
      const failed = [];
      for (const it of g.items) { try { await spWrite(it.id, vals); } catch (e) { failed.push(`item ${it.id}: ${e.message}`); } }
      if (failed.length) throw new Error("Could not update every list item: " + failed.join("; ") + " – click the action again to retry.");
    }
    function lock(btn, on) { actionBtns.forEach(b => b.disabled = on); if (btn) btn.disabled = on; }

    function validate() {
      for (const [k, c] of Object.entries(ctl)) {
        const v = c.get();
        if (c.o.ext && !hasVendorExt) continue;
        if (k === "bankCode" && !hasBankExt) continue;
        if (c.o.required && !v) throw new Error(`Please fill in ${c.label}.`);
        if (c.o.max && v.length > c.o.max) throw new Error(`${c.label} is ${v.length} characters; BC allows ${c.o.max}.`);
      }
      const emails = ctl.email.get().split(";").map(x => x.trim()).filter(Boolean);
      const bad = emails.filter(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
      if (bad.length) throw new Error("Email not valid: " + bad.join(", "));
      if (hasBankExt && ctl.bankAccountNo.get() && !ctl.bankCode.get()) throw new Error("Please fill in the bank account code.");
    }

    async function doCreate(btn) {
      try { validate(); } catch (e) { setStatus(e.message, "err"); return; }
      if (matches.length && !confirm(`BC may already have this supplier (${matches.map(m => m.number).join(", ")}). Create a NEW vendor anyway?`)) return;
      lock(btn, true);
      const notes = [];
      try {
        setStatus(`Taking Asset ${g.assetId}...`);
        const before = await claim(QSTATUS.creating);
        // 1. vendor number – reuse the one an interrupted attempt already took
        let number = fv(before, QCOL.vendorNo);
        if (!number) {
          setStatus(`Taking the next number from ${series}...`);
          number = await nextNumberFrom(series);
          await spWrite(p.id, { [QCOL.vendorNo]: number });
        }
        // 2. vendor card (skip if an interrupted attempt already created it)
        let rec = (await co(`/vendors?$filter=number eq '${number.replace(/'/g, "''")}'`)).value[0];
        if (!rec) {
          setStatus(`Creating supplier ${number}...`);
          const body = { number, displayName: ctl.displayName.get() };
          for (const k of ["email", "phoneNumber", "addressLine1", "addressLine2", "city", "postalCode", "country", "currencyCode"]) {
            let v = ctl[k].get(); if (k === "email") v = v.split(";").map(x => x.trim()).filter(Boolean).join(";");
            if (v) body[k] = v;
          }
          const pt = ctl.paymentTerms.get();
          if (pt) {
            const t = (await paymentTermsLookup()).find(x => String(x.code).toUpperCase() === pt.toUpperCase());
            if (t) body.paymentTermsId = t.id; else notes.push(`payment terms ${pt} does not exist in this company – set it in BC`);
          }
          rec = await co(`/vendors`, { method: "POST", body: JSON.stringify(body) });
        } else notes.push(`vendor ${number} already existed from an earlier attempt – reused it`);
        // 3. posting groups, registration number, MyInvois (extension v1.4)
        if (hasVendorExt) {
          setStatus(`Created ${number}. Setting posting groups...`);
          const ext = {};
          for (const k of ["genBusPostingGroup", "vendorPostingGroup", "vatBusPostingGroup", "registrationNumber"].concat(myInvois ? ["taxIdentificationNo", "idType", "idNo"] : [])) {
            const v = ctl[k].get(); if (v) ext[k] = v;
          }
          try { await bcFetch(`${extBase("vendors")}(${rec.id})`, { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify(ext) }); }
          catch (e) { notes.push(`posting groups / registration / MyInvois NOT set (${e.message})`); }
        } else notes.push("posting groups and registration number not set – Saxon Portal API v1.4 is not installed");
        // 4. bank account (extension v1.4)
        const acct = ctl.bankAccountNo.get();
        if (acct && hasBankExt) {
          setStatus(`Adding bank account to ${number}...`);
          try {
            const code = ctl.bankCode.get();
            const existing = await bcFetch(extBase("vendorBanks") + `?$filter=vendorNumber eq '${number.replace(/'/g, "''")}' and code eq '${code.replace(/'/g, "''")}'`);
            if (!existing.value.length)
              await bcFetch(extBase("vendorBanks"), { method: "POST", body: JSON.stringify({ vendorNumber: number, code, name: ctl.bankName.get(),
                bankAccountNo: acct, swiftCode: ctl.swiftCode.get(), currencyCode: ctl.currencyCode.get(), setAsPreferred: true }) });
          } catch (e) { notes.push(`bank account NOT added (${e.message})`); }
        } else if (acct) notes.push("bank details not added – Saxon Portal API v1.4 is not installed, copy them into BC");
        // 5. record the result on every list item of the deal
        setStatus(`Recording ${number} on the SharePoint list...`);
        await finish(QSTATUS.created, number, "");

/* ---------- text / period helpers ---------- */
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONTH_NAMES = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const round5 = n => Math.round(n * 1e5) / 1e5;
const fmtNum = n => Number(Number(n).toFixed(5)).toLocaleString(undefined, { maximumFractionDigits: 5 });
function longDate(iso)  { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTH_NAMES[m - 1]} ${y}`; }
function shortDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; }
const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/* st = { yy, from, to, style } -> [{label}] ; style "none" = no period text */
function periodsFor(st) {
  const yy = String(st.yy).padStart(2, "0");
  const lab = (a, b) => a === b ? `${MONTHS[a]} ${yy}` : `${MONTHS[a]}-${MONTHS[b]} ${yy}`;
  const out = [];
  if (st.style === "none") return [{ label: "" }];
  if (st.from > st.to) return out;
  if (st.style === "single") out.push({ label: lab(st.from, st.to) });
  else if (st.style === "quarterly") for (let m = st.from; m <= st.to; m += 3) out.push({ label: lab(m, Math.min(m + 2, st.to)) });
  else for (let m = st.from; m <= st.to; m++) out.push({ label: lab(m, m) });
  return out;
}
/* "MALAYSIA SOLAR RECS V26 (TIGR)" -> "TIGR" (matched against the registry list) */
function registryFromText(t) {
  const m = String(t || "").match(/\(([^()]+)\)\s*$/);
  if (!m) return "";
  const n = normName(m[1]);
  return REGISTRIES.find(r => normName(r) === n) || "";
}
function vintageFrom(item) {
  const m = String(item.displayName || "").match(/\bV(\d{2})\b/) || String(item.number || "").match(/_V(\d{2})$/i);
  return m ? m[1] : "";
}
/* SO: ID -> part numbers. Uses the last 5 (or 4) digits of the ID and, if given, the 2-digit year. */
function matchItemsById(id, yy, items) {
  const m = String(id || "").match(/(\d+)\D*$/);
  if (!m) return [];
  const tail = m[1];
  const keys = new Set([tail.slice(-5), tail.slice(-4)].filter(k => k.length >= 4).map(Number));
  const y = String(yy || "").trim().slice(-2);
  return items.filter(it => {
    const num = String(it.number || "");
    const d = num.match(/\d+/);
    if (!d || !keys.has(Number(d[0]))) return false;
    return !y || new RegExp(`_V${y}$`, "i").test(num);
  });
}

/* ---------- comment lines (templates from presets.js) ---------- */
const TOKEN = /\{(\w+):([^}=]+)(?:=([^}]*))?\}/g;
function makeCommentRow(onRemove, onMove) {
  const row = {};
  const tplSel = h("select", {}, COMMENT_TEMPLATES.map((t, i) => h("option", { value: i }, t.label || t.text)));
  const fieldsBox = h("div", { class: "grid", style: "margin-top:.4rem" });
  const out = h("input", { maxlength: "100", placeholder: "Comment text" });
  const hint = h("div", { class: "muted small" });
  let edited = false, fields = [];
  out.addEventListener("input", () => { edited = true; resetBtn.classList.remove("hidden"); });
  const resetBtn = h("button", { type: "button", class: "ghost small hidden", title: "Rebuild text from the boxes",
    onclick: () => { edited = false; resetBtn.classList.add("hidden"); regen(); } }, "↺");

  function fmt(f) {
    const v = f.el.value.trim();
    if (!v) return "";
    if (f.type === "percent") return v.replace(/%$/, "") + "%";
    if (f.type === "date") return shortDate(v);
    if (f.type === "longdate") return longDate(v);
    return v;
  }
  function regen() {
    const tpl = COMMENT_TEMPLATES[tplSel.value];
    let i = 0;
    if (!edited) out.value = tpl.text.replace(TOKEN, () => { const f = fields[i++]; return fmt(f) || `(${f.label})`; });
    hint.textContent = "";
    if (tpl.hint === "fx") {
      const nums = fields.filter(f => f.type === "number").map(f => Number(f.el.value));
      if (nums[0] > 0 && nums[1] > 0) hint.textContent = `${nums[0]} × ${nums[1]} = ${round5(nums[0] * nums[1])} per unit`;
    }
  }
  function build() {
    const tpl = COMMENT_TEMPLATES[tplSel.value];
    fields = [...tpl.text.matchAll(TOKEN)].map(([, type, label, def]) => {
      let el;
      if (type === "date" || type === "longdate") el = h("input", { type: "date" });
      else if (type === "registry") el = h("select", {}, h("option", { value: "" }, "(choose)"), REGISTRIES.map(r => h("option", { value: r }, r)));
      else if (type === "number" || type === "percent") el = h("input", { type: "number", step: "any", min: "0", value: def });
      else el = h("input", { value: def, maxlength: "100" });
      el.addEventListener("input", regen); el.addEventListener("change", regen);
      return { type, label, el };
    });
    fieldsBox.replaceChildren(...fields.map(f => h("label", {}, f.label + (f.type === "percent" ? " (%)" : ""), f.el)));
    edited = false; resetBtn.classList.add("hidden");
    regen();
  }
  tplSel.addEventListener("change", build);

  row.box = h("div", { class: "comment-row" },
    h("div", { class: "block-head" },
      h("label", { class: "grow" }, "Comment", tplSel),
      h("button", { type: "button", class: "ghost small", title: "Move up", onclick: () => onMove(row, -1) }, "↑"),
      h("button", { type: "button", class: "ghost small", title: "Move down", onclick: () => onMove(row, 1) }, "↓"),
      h("button", { type: "button", class: "ghost small", title: "Remove", onclick: () => onRemove(row) }, "✕")),
    fieldsBox,
    h("label", { style: "margin-top:.4rem" }, "Text written to BC (you can edit it)",
      h("div", { style: "display:flex;gap:.4rem;align-items:center" }, out, resetBtn)),
    hint);
  row.text = () => out.value.trim();
  row.validate = () => {
    if (!row.text()) return "A comment line is empty.";
    if (!edited && fields.some(f => !f.el.value.trim())) return `Fill in the boxes of comment "${COMMENT_TEMPLATES[tplSel.value].label}".`;
    return null;
  };
  build();
  return row;
}

/* a list of comment rows with its own "+ Add comment" button (used per item and at the bottom) */
function makeCommentList(buttonText) {
  const rows = [], box = h("div", {});
  function add() {
    const row = makeCommentRow(
      r => { rows.splice(rows.indexOf(r), 1); r.box.remove(); },
      (r, dir) => {
        const i = rows.indexOf(r), j = i + dir;
        if (j < 0 || j >= rows.length) return;
        [rows[i], rows[j]] = [rows[j], rows[i]];
        box.replaceChildren(...rows.map(c => c.box));
      });
    rows.push(row); box.append(row.box);
  }
  return {
    box, add,
    btn: h("button", { type: "button", class: "ghost small", onclick: add }, buttonText),
    validate: () => rows.map(r => r.validate()).filter(Boolean),
    lines: () => rows.map(r => ({ lineType: "Comment", description: r.text() })),
    clear() { rows.length = 0; box.replaceChildren(); }
  };
}

  function addPoBlock() {

      .map(([v, t]) => h("option", { value: v }, t)));

    const fxAllowed = companyGroup() === "MY";
    const fxChk = h("input", { type: "checkbox" });
    const fxCur = h("input", { value: lastFx.cur, maxlength: "5" });
    const fxPrice = h("input", { type: "number", min: "0", step: "any", placeholder: "e.g. 0.60" });

    const fxText = h("input", { maxlength: "100" });
    let fxEdited = false;
    fxText.addEventListener("input", () => { fxEdited = true; });
    const fxTpl = COMMENT_TEMPLATES.find(t => t.hint === "fx");
    function fxCost() { const p = Number(fxPrice.value), r = Number(fxRate.value); return p > 0 && r > 0 ? String(round5(p * r)) : ""; }
    function fxComment() {
      const vals = [fxCur.value.trim() || "(currency)", fxPrice.value.trim() || "(price)", fxRate.value.trim() || "(rate)", longDate(fxDate.value) || "(date)"];
      let i = 0;
      return fxTpl ? fxTpl.text.replace(TOKEN, () => vals[i++] ?? "")
                   : `${vals[0]} ${vals[1]} @ BNM RATE ${vals[2]} ON ${vals[3]} AT MIDDLE RATE 1700`;
    }

      if (on) {
        cost.value = fxCost();
        if (!fxEdited) fxText.value = fxComment();
        Object.assign(lastFx, { cur: fxCur.value, rate: fxRate.value, date: fxDate.value });

      drawPreview();

    const fxBox = h("div", { class: "hidden" },
      h("div", { class: "grid", style: "margin-top:.4rem" },
        h("label", {}, "Currency", fxCur),
        h("label", {}, "Price in currency", fxPrice),
        h("label", {}, "BNM rate", fxRate),
        h("label", {}, "Rate date", fxDate)),
      h("label", { style: "margin-top:.4rem" }, "FX comment (added right after this item's lines – you can edit it)", fxText));
    fxChk.addEventListener("change", fxUpdate);
    [fxCur, fxPrice, fxRate, fxDate].forEach(e => e.addEventListener("input", fxUpdate));
    const fxSection = fxAllowed ? h("div", { class: "fx-item" },

    const periodWrap = h("div", {});
    const periodsBox = h("div", { class: "periods" });
    const preview = h("div", { class: "tablewrap" });

    function applyItem(r) {
      base.value = r.displayName || "";
      rl.set(registryFromText(r.displayName));

    const descFor = label => label ? `${base.value.trim()} - ${label}` : base.value.trim();
    const ticked = () => periodsFor(st).filter(x => !st.unticked.has(x.label));

    function redraw() {
      st.yy = Number(yy.value) || 0; st.from = Number(fromSel.value); st.to = Number(toSel.value); st.style = styleSel.value;
      [yy, fromSel, toSel].forEach(e => e.closest("label").classList.toggle("hidden", st.style === "none"));
      periodWrap.classList.toggle("hidden", st.style === "none");
      const ps = periodsFor(st);
      periodsBox.replaceChildren(...(ps.length ? ps.map(x => {
        const cb = h("input", { type: "checkbox", checked: !st.unticked.has(x.label) });
        cb.addEventListener("change", () => { cb.checked ? st.unticked.delete(x.label) : st.unticked.add(x.label); drawPreview(); });
        return h("label", { class: "chk" }, cb, x.label);
      }) : [h("span", { class: "muted small" }, "“From” month is after “To” month.")]));
      drawPreview();

    function drawPreview() {
      const rows = ticked();
      if (!rows.length) { preview.replaceChildren(h("p", { class: "muted small" }, "No periods ticked.")); return; }
      preview.replaceChildren(h("table", { class: "lines" },

      lookups[def.partyLookup](), lookups.items(), lookups.locations().catch(() => []), lineExtAvailable(key)]);

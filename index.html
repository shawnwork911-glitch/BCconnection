<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Central Connector</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  button { padding: .5rem 1rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  input { padding: .45rem; margin: .25rem .25rem .25rem 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
  #status { margin: 1rem 0; padding: .6rem; background: #f3f3f3; border-radius: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>Business Central Connector</h1>
<div id="status">Not signed in.</div>

<button id="btnLogin">Sign in with Microsoft</button>
<button id="btnLogout" class="hidden">Sign out</button>

<section id="app" class="hidden">
  <h2>Customers</h2>
  <button id="btnLoad">Load customers</button>
  <table id="tbl"><thead><tr><th>No.</th><th>Name</th><th>Email</th></tr></thead><tbody></tbody></table>

  <h2>Create customer</h2>
  <form id="frm">
    <input id="cName" placeholder="Display name" required>
    <input id="cEmail" type="email" placeholder="Email">
    <button type="submit">Create</button>
  </form>
</section>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
/* ============ CONFIGURE THESE ============ */
const CONFIG = {
  clientId:    "9cfe8c4d-e0fb-4372-a7c1-6300aac80fbd",  // Entra ID app registration > Application (client) ID
  tenantId:    "ab7c8c1e-dc1d-431f-ba8b-e4de2b047f8b",  // Directory (tenant) ID
  environment: "Production",                  // BC environment name (see BC Admin Center)
  redirectUri: window.location.origin + window.location.pathname // must match Entra exactly
};
/* ======================================== */

const BC_SCOPE = ["https://api.businesscentral.dynamics.com/Financials.ReadWrite.All"];
const BC_BASE  = `https://api.businesscentral.dynamics.com/v2.0/${CONFIG.tenantId}/${CONFIG.environment}/api/v2.0`;

const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: CONFIG.redirectUri
  },
  cache: { cacheLocation: "sessionStorage" }
});

const $ = id => document.getElementById(id);
let account = null;
let companyId = null;

function setStatus(msg) { $("status").textContent = msg; }

function showSignedIn() {
  setStatus("Signed in as " + account.username);
  $("btnLogin").classList.add("hidden");
  $("btnLogout").classList.remove("hidden");
  $("app").classList.remove("hidden");
}

async function login() {
  try {
    const res = await msalApp.loginPopup({ scopes: BC_SCOPE });
    account = res.account;
    msalApp.setActiveAccount(account);
    showSignedIn();
  } catch (e) { setStatus("Login failed: " + e.message); }
}

function logout() {
  msalApp.logoutPopup({ account }).then(() => location.reload());
}

async function getToken() {
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: BC_SCOPE, account });
    return r.accessToken;
  } catch (e) {
    const r = await msalApp.acquireTokenPopup({ scopes: BC_SCOPE });
    return r.accessToken;
  }
}

async function bc(path, options = {}) {
  const token = await getToken();
  const res = await fetch(BC_BASE + path, {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/json",
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`BC ${res.status}: ${text}`);
  }
  return res.status === 204 ? null : res.json();
}

async function ensureCompany() {
  if (companyId) return companyId;
  const data = await bc("/companies");
  if (!data.value.length) throw new Error("No companies found for this user.");
  companyId = data.value[0].id; // first company; change if you have several
  return companyId;
}

async function loadCustomers() {
  try {
    setStatus("Loading customers...");
    const cid = await ensureCompany();
    const data = await bc(`/companies(${cid})/customers?$top=20&$select=number,displayName,email`);
    const body = $("tbl").querySelector("tbody");
    body.innerHTML = "";
    data.value.forEach(c => {
      const tr = document.createElement("tr");
      [c.number, c.displayName, c.email].forEach(v => {
        const td = document.createElement("td");
        td.textContent = v || "";   // textContent avoids HTML injection
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    setStatus(`Loaded ${data.value.length} customers.`);
  } catch (e) { setStatus("Error: " + e.message); }
}

async function createCustomer(ev) {
  ev.preventDefault();
  try {
    const cid = await ensureCompany();
    const created = await bc(`/companies(${cid})/customers`, {
      method: "POST",
      body: JSON.stringify({
        displayName: $("cName").value,
        email: $("cEmail").value
      })
    });
    setStatus(`Created customer ${created.number} - ${created.displayName}`);
    $("frm").reset();
    loadCustomers();
  } catch (e) { setStatus("Error: " + e.message); }
}

$("btnLogin").addEventListener("click", login);
$("btnLogout").addEventListener("click", logout);
$("btnLoad").addEventListener("click", loadCustomers);
$("frm").addEventListener("submit", createCustomer);

// Restore an existing session after page refresh
(async () => {
  await msalApp.initialize?.();
  const accounts = msalApp.getAllAccounts();
  if (accounts.length) { account = accounts[0]; msalApp.setActiveAccount(account); showSignedIn(); }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Central Portal</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#d8dde4; --accent:#0b5cad; --text:#1f2430; --muted:#6b7280; --danger:#b3261e; --warn-bg:#fff4e5; --warn:#8a4b00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--accent); color:#fff; padding:.7rem 1rem; display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0; flex:1; }
  header select, header button { padding:.4rem .7rem; }
  header select { width:auto; margin:0; }
  #status { margin:.75rem 1rem; padding:.6rem .8rem; background:#e9edf2; border-radius:6px; }
  #status.err  { background:#fdecea; color:#8a1c12; }
  #status.ok   { background:#e6f4ea; color:#14532d; }
  #status.warn { background:var(--warn-bg); color:var(--warn); }
  main { padding:0 1rem 2rem; max-width:1200px; margin:0 auto; }
  nav { display:flex; gap:.25rem; flex-wrap:wrap; border-bottom:2px solid var(--line); margin-bottom:1rem; }
  nav button { background:none; border:none; padding:.6rem 1rem; cursor:pointer; font-size:.95rem; border-bottom:3px solid transparent; margin-bottom:-2px; color:var(--text); border-radius:0; }
  nav button.active { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  .card h2 { margin:0 0 .75rem; font-size:1rem; }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.75rem; align-items:end; }
  label { display:block; font-size:.8rem; color:var(--muted); }
  label.chk { display:inline-flex; align-items:center; gap:.3rem; color:var(--text); font-size:.85rem; margin:0 .9rem .4rem 0; }
  textarea { width:100%; padding:.5rem; border:1px solid var(--line); border-radius:4px; font:.85rem/1.4 ui-monospace, Consolas, monospace; resize:vertical; }
  input, select { width:100%; padding:.5rem; margin-top:.2rem; border:1px solid var(--line); border-radius:4px; font-size:.9rem; font-family:inherit; }
  input[type=checkbox] { width:auto; margin:0 .3rem 0 0; }
  button { padding:.5rem 1rem; cursor:pointer; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-family:inherit; }
  button.ghost { background:#fff; color:var(--accent); }
  button.danger { background:#fff; color:var(--danger); border-color:var(--danger); }
  button.small { padding:.25rem .6rem; font-size:.8rem; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tablewrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:.85rem; }
  th, td { border-bottom:1px solid var(--line); padding:.4rem .6rem; text-align:left; white-space:nowrap; }
  th { background:#f0f3f6; }
  td.num { text-align:right; }
  td.low { color:var(--danger); font-weight:600; }
  td.wrap { white-space:normal; min-width:180px; max-width:280px; }
  table.lines td { padding:.25rem .4rem; }
  table.lines input { margin:0; padding:.35rem .45rem; }
  table.lines td:first-child { width:55%; }
  .progress { font-size:.8rem; line-height:1.35; color:var(--muted); }
  .progress .done { color:#14532d; }
  .pager { justify-content:flex-end; }
  .muted { color:var(--muted); }
  .small { font-size:.8rem; }
  .row-actions { display:flex; gap:.5rem; margin-top:.75rem; flex-wrap:wrap; align-items:center; }
  .hidden { display:none !important; }
  code { background:#f0f3f6; padding:.1rem .3rem; border-radius:3px; }
  .tag { display:inline-block; font-size:.75rem; padding:.1rem .45rem; border-radius:10px; background:#eef2f6; color:var(--muted); margin:0 .25rem .15rem 0; white-space:nowrap; }
  .tag.warn { background:var(--warn-bg); color:var(--warn); }
  .tag.ok { background:#e6f4ea; color:#14532d; }
  /* search box */
  .ta { position:relative; }
  .ta-list { position:absolute; z-index:30; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.12); max-height:280px; overflow:auto; margin-top:2px; }
  .ta-opt { padding:.45rem .6rem; cursor:pointer; font-size:.85rem; color:var(--text); border-bottom:1px solid #f0f2f5; }
  .ta-opt:hover, .ta-opt.active { background:#e8f0fb; }
  .ta-empty { padding:.5rem .6rem; font-size:.85rem; color:var(--muted); }
  .party-info { font-size:.85rem; line-height:1.45; margin-top:.5rem; padding:.5rem .7rem; background:#f7f9fb; border:1px solid var(--line); border-radius:6px; }
  .party-info:empty { display:none; }
  /* item blocks */
  .block { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:.75rem; margin-bottom:.75rem; background:#fcfdfe; }
  .block-head { display:flex; gap:.75rem; align-items:end; margin-bottom:.6rem; }
  .block-head .grow { flex:1; }
  .sub { font-size:.8rem; color:var(--muted); margin:.7rem 0 .3rem; font-weight:600; }
  .periods { margin-bottom:.4rem; }
  .fx { border:1px dashed var(--line); border-radius:6px; padding:.75rem; margin:.75rem 0; }
  .fx h2 { font-size:.9rem; }
  @media (max-width:640px) { .block-head { flex-wrap:wrap; } }
  .span2 { grid-column: span 2; }
  @media (max-width:640px) { .span2 { grid-column: auto; } }
  .comment-row { border:1px solid var(--line); border-left:4px solid #8a94a6; border-radius:6px; padding:.6rem .75rem; margin-bottom:.6rem; background:#fcfdfe; }
  .comment-row .block-head { margin-bottom:0; }
  tr.comment td { color:var(--muted); font-style:italic; background:#fafbfc; }
  table.lines select.vat { margin:0; padding:.35rem; }
  tfoot td { border-bottom:none; }
  input.upper { text-transform:uppercase; }
  .fx-item { margin-top:.6rem; padding:.5rem .6rem; background:#f7f9fb; border:1px dashed var(--line); border-radius:6px; }
  input:disabled { background:#eef1f4; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Business Central Portal</h1>
  <select id="company" class="hidden" title="Company"></select>
  <button id="btnLogin">Sign in with Microsoft</button>
  <button id="btnLogout" class="hidden">Sign out</button>
</header>

<div id="status">Not signed in.</div>

<main id="app" class="hidden">
  <nav id="tabs"></nav>
  <div id="panels"></div>
</main>

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
  window.msal || document.write('<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"><\/script>');
</script>
<script>
  window.msal || document.write('<script src="msal-browser.min.js"><\/script>');
</script>
<!-- Portal settings: registries, locations, VAT groups, comment templates (edit presets.js, not this file) -->
<script src="presets.js"></script>
<script>
/* ============ CONFIGURE THESE ============ */
const CONFIG = {
  clientId:    "9cfe8c4d-e0fb-4372-a7c1-6300aac80fbd",
  tenantId:    "ab7c8c1e-dc1d-431f-ba8b-e4de2b047f8b",
  environment: "Production",   // <- your BC environment name
  redirectUri: window.location.origin + window.location.pathname,

  // Portal is "draft only": no posting buttons, no Approvals tab.
  // Set to true to bring them back (the code is still below).
  features: { posting: false, approvals: false },

  // Saxon Portal API extension (sets VAT Bus. Posting Group on PO lines).
  // Leave publisher blank to switch it off.
  lineExtApi: { publisher: "saxon", group: "portal", version: "v1.0",
                entities: { po: "purchaseLineExts", so: "salesLineExts" } },

  // Approvals need their own custom API page (only used if features.approvals = true).
  approvalApi: {
    publisher: "", group: "portal", version: "v1.0", entity: "approvalEntries",
    approveAction: "approve", rejectAction: "reject"
  },
  lowStockThreshold: 10         // inventory at or below this is highlighted
};
/* ======================================== */

const statusBox = document.getElementById("status");
function setStatus(msg, kind) { statusBox.textContent = msg; statusBox.className = kind || ""; }

window.addEventListener("error", e => setStatus("Script error: " + e.message, "err"));
if (typeof msal === "undefined") {
  setStatus("The Microsoft sign-in library did not load (blocked network, ad blocker, or no internet).", "err");
  throw new Error("msal library missing");
}

/* ---------- settings (presets.js) ---------- */
const SETTINGS = window.PORTAL_PRESETS || {};
const REGISTRIES = SETTINGS.registries || ["I-REC", "TIGR"];
const COMMENT_TEMPLATES = SETTINGS.comments || [{ label: "Free text", text: "{free:Text}" }];
const DIMENSIONS = SETTINGS.dimensions || {};
function companyName() {
  const sel = document.getElementById("company");
  return sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : "";
}
function companyGroup() {
  const name = companyName();
  const g = (SETTINGS.companyGroups || []).find(x => new RegExp(x.match, "i").test(name));
  return g ? g.group : null;
}
function locationFor(registry) {
  const row = (SETTINGS.locations || {})[registry], g = companyGroup();
  return row && g ? (row[g] || "") : "";
}

const BC_SCOPE = ["https://api.businesscentral.dynamics.com/Financials.ReadWrite.All"];
const BC_ROOT  = `https://api.businesscentral.dynamics.com/v2.0/${CONFIG.tenantId}/${CONFIG.environment}/api`;
const BC_BASE  = `${BC_ROOT}/v2.0`;

const msalApp = new msal.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: CONFIG.redirectUri
  },
  cache: { cacheLocation: "sessionStorage" }
});

let account = null;
let companyId = null;

/* ---------- auth ---------- */
async function login() {
  try {
    setStatus("Redirecting to Microsoft sign-in...");
    await msalApp.loginRedirect({ scopes: BC_SCOPE });
  } catch (e) { setStatus("Login failed: " + e.message, "err"); }
}
function logout() { msalApp.logoutRedirect({ account }); }

async function getToken() {
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: BC_SCOPE, account });
    return r.accessToken;
  } catch (e) {
    await msalApp.acquireTokenRedirect({ scopes: BC_SCOPE });
    throw new Error("Re-authenticating...");
  }
}

/* ---------- BC calls ---------- */
function niceError(text) {
  try { return JSON.parse(text).error.message; } catch { return text; }
}
async function bcFetch(url, options = {}) {
  const token = await getToken();
  const res = await fetch(url, {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/json",
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!res.ok) throw new Error(`BC ${res.status}: ${niceError(await res.text())}`);
  return res.status === 204 ? null : res.json();
}
const bc = (path, options) => bcFetch(BC_BASE + path, options);
const co = (path, options) => bc(`/companies(${companyId})${path}`, options);

/* read every page of a list (follows @odata.nextLink); retries without $select if BC rejects it */
async function coAll(path) {
  async function run(p) {
    let url = `${BC_BASE}/companies(${companyId})${p}`;
    const out = [];
    while (url) { const d = await bcFetch(url); out.push(...d.value); url = d["@odata.nextLink"]; }
    return out;
  }
  try { return await run(path); }
  catch (e) {
    if (!path.includes("$select")) throw e;
    return run(path.replace(/[?&]\$select=[^&]*/, "").replace(/^([^?]*)&/, "$1?"));
  }
}

/* ---------- cached lookups (per company) ---------- */
const cache = {};
function cached(key, loader) {
  if (!cache[key]) cache[key] = loader().catch(e => { delete cache[key]; throw e; });
  return cache[key];
}
function clearCache(prefix) { Object.keys(cache).forEach(k => { if (!prefix || k.startsWith(prefix)) delete cache[k]; }); }
const lookups = {
  vendors:    () => cached("vendors",    () => coAll("/vendors?$select=id,number,displayName,addressLine1,addressLine2,city,postalCode,country,email,phoneNumber,currencyCode,blocked")),
  customers:  () => cached("customers",  () => coAll("/customers?$select=id,number,displayName,addressLine1,addressLine2,city,postalCode,country,email,phoneNumber,currencyCode,blocked")),
  items:      () => cached("items",      () => coAll("/items?$select=id,number,displayName,type,baseUnitOfMeasureCode,blocked")),
  locations:  () => cached("locations",  () => coAll("/locations?$select=id,code,displayName")),
  dimensions: () => cached("dimensions", () => coAll("/dimensions?$select=id,code,displayName"))
};

/* ---------- Saxon Portal API extension (VAT group per line) ---------- */
const extState = {};   // companyId|kind -> Promise<boolean>
function extBase(kind) {
  const a = CONFIG.lineExtApi;
  return `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/${a.entities[kind]}`;
}
function lineExtAvailable(kind) {
  if (!CONFIG.lineExtApi.publisher || !CONFIG.lineExtApi.entities[kind]) return Promise.resolve(false);
  const k = companyId + "|" + kind;
  if (!(k in extState)) extState[k] = bcFetch(extBase(kind) + "?$top=1").then(() => true, () => false);
  return extState[k];
}

/* ---------- tiny DOM helper ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v != null && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => el.append(c instanceof Node ? c : document.createTextNode(c ?? "")));
  return el;
}

/* cols: [key,label]; extraCols: [{label, render(row) -> Node}] */
function renderTable(box, cols, rows, extraCols = [], opts = {}) {
  box.replaceChildren();
  if (!rows.length) { box.append(h("p", { class: "muted" }, "No records.")); return; }
  box.append(h("table", {},
    h("thead", {}, h("tr", {}, cols.map(c => h("th", {}, c[1])), extraCols.map(c => h("th", {}, c.label)))),
    h("tbody", {}, rows.map(r => h("tr", {},
      cols.map(c => {
        const cls = [];
        if (typeof r[c[0]] === "number") cls.push("num");
        if (opts.cellClass) { const x = opts.cellClass(r, c[0]); if (x) cls.push(x); }
        return h("td", { class: cls.join(" ") }, r[c[0]] ?? "");
      }),
      extraCols.map(c => h("td", {}, c.render(r)))
    )))
  ));
}

/* ---------- live keyword search box ----------
   Type any part of the number, name or city; all words must match. */
function searchBox({ placeholder, source, onPick, extra }) {
  const input = h("input", { type: "text", placeholder, autocomplete: "off", spellcheck: "false" });
  const list = h("div", { class: "ta-list hidden" });
  const el = h("div", { class: "ta" }, input, list);
  const MAX_SHOWN = 30;    // only the first 30 matches are listed; typing narrows the list
  let rows = [], total = 0, active = -1, picked = null, timer = null;

  const hay = r => [r.number, r.displayName, r.city].filter(Boolean).join(" ").toLowerCase();
  function hide() { list.classList.add("hidden"); active = -1; }
  function pick(r) {
    picked = r; input.value = r.number; hide();
    if (onPick) onPick(r);
  }
  function draw() {
    if (document.activeElement !== input) { hide(); return; }
    list.replaceChildren(...(rows.length
      ? [...rows.map((r, i) => h("div", {
          class: "ta-opt" + (i === active ? " active" : ""),
          onmousedown: e => { e.preventDefault(); pick(r); }
        }, h("b", {}, r.number), " — ", r.displayName || "",
           r.city ? h("span", { class: "muted" }, " · " + r.city) : "",
           extra && extra(r) ? h("span", { class: "muted" }, " · " + extra(r)) : ""))]
      : [h("div", { class: "ta-empty" }, "No match.")]));
    list.classList.remove("hidden");
    const act = list.querySelector(".ta-opt.active");
    if (act) act.scrollIntoView({ block: "nearest" });
  }
  async function update() {
    if (document.activeElement !== input) return;
    const tokens = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    list.replaceChildren(h("div", { class: "ta-empty" }, "Loading..."));
    list.classList.remove("hidden");
    let data;
    try { data = await source(); }
    catch (e) { list.replaceChildren(h("div", { class: "ta-empty" }, "Could not load list: " + e.message)); return; }
    if (document.activeElement !== input) { hide(); return; }
    const all = tokens.length ? data.filter(r => { const s = hay(r); return tokens.every(t => s.includes(t)); }) : data;
    rows = all.slice(0, MAX_SHOWN);
    total = all.length;
    active = rows.length ? 0 : -1;
    draw();
  }
  async function resolveExact() {
    const v = input.value.trim().toLowerCase();
    if (!v || (picked && picked.number.toLowerCase() === v)) return;
    try {
      const r = (await source()).find(x => (x.number || "").toLowerCase() === v);
      if (r && input.value.trim().toLowerCase() === v) { picked = r; if (onPick) onPick(r); }
    } catch {}
  }

  input.addEventListener("input", () => {
    if (picked) { picked = null; if (onPick) onPick(null); }
    clearTimeout(timer); timer = setTimeout(update, 150);
  });
  input.addEventListener("focus", update);
  input.addEventListener("blur", () => { clearTimeout(timer); setTimeout(() => { hide(); resolveExact(); }, 120); });
  input.addEventListener("keydown", e => {
    if (list.classList.contains("hidden")) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, rows.length - 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); draw(); }
    else if (e.key === "Enter" && active >= 0 && rows[active]) { e.preventDefault(); pick(rows[active]); }
    else if (e.key === "Escape") hide();
  });

  return {
    el, input,
    get value() { return input.value.trim(); },
    set(v) { input.value = v || ""; picked = null; if (v) resolveExact(); },
    clear() { input.value = ""; picked = null; if (onPick) onPick(null); }
  };
}

/* ---------- definitions ---------- */
const MASTER = {
  items: {
    title: "Part Numbers (Items)", singular: "item", endpoint: "items",
    fields: [
      { key: "number", label: "Part no. (blank = auto)" },
      { key: "displayName", label: "Description", required: true },
      { key: "type", label: "Type", options: ["Inventory", "Service", "Non-Inventory"] },
      { key: "baseUnitOfMeasureCode", label: "Unit of measure (e.g. RECS)" },
      { key: "unitPrice", label: "Unit price", type: "number" },
      { key: "unitCost", label: "Unit cost", type: "number" },
      { key: "generalProductPostingGroupCode", label: "Gen. Prod. Posting Group", defaultFrom: "itemDefaults", upper: true },
      { key: "inventoryPostingGroupCode", label: "Inventory Posting Group", defaultFrom: "itemDefaults", upper: true }
    ],
    columns: [["number","Part no."],["displayName","Description"],["type","Type"],["baseUnitOfMeasureCode","UoM"],["generalProductPostingGroupCode","Gen. Prod."],["inventoryPostingGroupCode","Inv. Posting"],["inventory","Inventory"]]
  },
  vendors: {
    title: "Suppliers (Vendors)", singular: "supplier", endpoint: "vendors",
    fields: [
      { key: "number", label: "Supplier ID", kind: "noSeries" },
      { key: "displayName", label: "Name", required: true, upper: true },
      { key: "email", label: "Email (separate several with ;)", kind: "emails" },
      { key: "phoneNumber", label: "Phone" },
      { key: "addressLine1", label: "Address", upper: true },
      { key: "addressLine2", label: "Address 2", upper: true },
      { key: "city", label: "City", upper: true },
      { key: "postalCode", label: "Postal code", upper: true },
      { key: "country", label: "Country code (e.g. MY)", upper: true },
      { key: "paymentTerms", label: "Payment Terms Code", kind: "paymentTerms" }
    ],
    columns: [["number","Supplier ID"],["displayName","Name"],["email","Email"],["phoneNumber","Phone"],["city","City"]]
  },
  customers: {
    title: "Customers", singular: "customer", endpoint: "customers",
    fields: [
      { key: "number", label: "Customer ID", kind: "noSeries" },
      { key: "displayName", label: "Name", required: true, upper: true },
      { key: "email", label: "Email (separate several with ;)", kind: "emails" },
      { key: "phoneNumber", label: "Phone" },
      { key: "addressLine1", label: "Address", upper: true },
      { key: "addressLine2", label: "Address 2", upper: true },
      { key: "city", label: "City", upper: true },
      { key: "postalCode", label: "Postal code", upper: true },
      { key: "country", label: "Country code (e.g. MY)", upper: true },
      { key: "paymentTerms", label: "Payment Terms Code", kind: "paymentTerms" }
    ],
    columns: [["number","Customer ID"],["displayName","Name"],["email","Email"],["phoneNumber","Phone"],["city","City"]]
  }
};

const ORDERS = {
  po: {
    title: "Purchase Orders", endpoint: "purchaseOrders", linesEndpoint: "purchaseOrderLines",
    partyKey: "vendorNumber", partyLabel: "Supplier", partyLookup: "vendors",
    priceKey: "directUnitCost", priceLabel: "Unit cost",
    extKey: null,
    postAction: "receiveAndInvoice",
    stepLabel: "Receive", stepVerb: "receive", stepPast: "received",
    stepQtyKey: "receiveQuantity",
    doneQtyKey: "receivedQuantity",
    columns: [["number","PO no."],["vendorNumber","Supplier"],["vendorName","Name"],["orderDate","Date"],["status","Status"],["totalAmountIncludingTax","Total"]]
  },
  so: {
    title: "Sales Orders", endpoint: "salesOrders", linesEndpoint: "salesOrderLines",
    partyKey: "customerNumber", partyLabel: "Customer", partyLookup: "customers",
    priceKey: "unitPrice", priceLabel: "Unit price",
    extKey: "externalDocumentNumber", extLabel: "Customer PO no. (optional)",
    postAction: "shipAndInvoice",
    stepLabel: "Ship", stepVerb: "ship", stepPast: "shipped",
    stepQtyKey: "shipQuantity",
    doneQtyKey: "shippedQuantity",
    columns: [["number","SO no."],["customerNumber","Customer"],["customerName","Name"],["orderDate","Date"],["status","Status"],["totalAmountIncludingTax","Total"]]
  }
};

const TABS = [
  { id: "items",     label: "Part Number", build: () => buildMaster("items") },
  { id: "vendors",   label: "Supplier",    build: () => buildMaster("vendors") },
  { id: "customers", label: "Customer",    build: () => buildMaster("customers") },
  { id: "inventory", label: "Inventory",   build: () => buildInventory() },
  { id: "po",        label: "Purchase Order", build: () => buildOrder("po") },
  { id: "so",        label: "Sales Order",    build: () => buildOrder("so") },
  { id: "approvals", label: "Approvals",   build: () => buildApprovals(), when: () => CONFIG.features.approvals }

/* next number from a BC number series (Saxon Portal API v1.2) */
async function nextNumberFrom(seriesCode) {
  const a = CONFIG.lineExtApi;
  const url = `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/nextNumbers`;
  try {
    const r = await bcFetch(url, { method: "POST", body: JSON.stringify({ seriesCode }) });
    if (!r || !r.number) throw new Error("BC returned no number");
    return r.number;
  } catch (e) {
    if (/404|not found|No HTTP resource|BadRequest_NotFound/i.test(e.message))
      throw new Error(`Could not take a number from ${seriesCode}: the Saxon Portal API extension v1.2 is not installed yet. Choose "Type the ID myself" for now.`);
    throw new Error(`Could not take a number from ${seriesCode}: ${e.message}`);
  }
}
const paymentTermsLookup = () => cached("paymentTerms", () => coAll("/paymentTerms?$select=id,code,displayName"));

function buildMaster(key) {
  const def = MASTER[key];
  const listBox = h("div", { class: "tablewrap" });
  const controls = {};   // key -> { get(), reset() }

  const fieldEls = def.fields.map(f => {
    const def0 = f.defaultFrom ? ((SETTINGS[f.defaultFrom] || {})[f.key] || "") : "";
    let input, wrap;
    if (f.kind === "noSeries") {
      const series = ((SETTINGS.noSeries || {})[key]) || [];
      const manual = h("input", { placeholder: series.length ? "Type the ID" : "blank = BC default", style: series.length ? "display:none" : "", class: "upper" });
      if (series.length) {
        const sel = h("select", {},
          series.map(s => h("option", { value: s.code }, `${s.code} – ${s.desc}`)),
          h("option", { value: "" }, "Type the ID myself"));
        sel.value = series[series.length > 1 ? 1 : 0].code;
        sel.addEventListener("change", () => { manual.style.display = sel.value ? "none" : ""; if (!sel.value) manual.focus(); });
        wrap = h("div", {}, sel, manual);
        controls[f.key] = { get: () => sel.value ? { series: sel.value } : { value: manual.value.trim().toUpperCase() },
                            reset() { sel.value = series[series.length > 1 ? 1 : 0].code; manual.value = ""; manual.style.display = "none"; } };
      } else {
        wrap = manual;
        controls[f.key] = { get: () => ({ value: manual.value.trim().toUpperCase() }), reset() { manual.value = ""; } };
      }
      return h("label", {}, f.label, wrap);
    }
    if (f.kind === "paymentTerms") {
      input = h("select", {}, h("option", { value: "" }, "(none)"),
        (SETTINGS.paymentTerms || []).map(g => h("optgroup", { label: g.group },
          g.terms.map(t => h("option", { value: t.code }, `${t.code} – ${t.desc}`)))));
      controls[f.key] = { get: () => input.value, reset() { input.value = ""; } };
      return h("label", {}, f.label, input);
    }
    if (f.options) input = h("select", {}, h("option", { value: "" }, "(default)"), f.options.map(o => h("option", { value: o }, o)));
    else input = h("input", { type: f.type === "number" ? "number" : "text", required: !!f.required, value: def0,
                              step: f.type === "number" ? "any" : undefined, class: f.upper ? "upper" : undefined,
                              maxlength: f.kind === "emails" ? "80" : undefined });
    controls[f.key] = { get: () => input.value.trim(), reset() { input.value = def0; } };
    return h("label", {}, f.label, input);
  });
  const btn = h("button", { type: "submit" }, "Preview");
  const form = h("form", { class: "grid" }, fieldEls, btn);
  const previewCard = h("div", { class: "card hidden preview" });
  let pending = null;   // { body, series }

  /* read + check the form; nothing is sent to BC here */
  async function collect() {
    const body = {}, shown = [];
    let series = null;
    for (const f of def.fields) {
      const v = controls[f.key].get();
      if (f.kind === "noSeries") {
        if (v.series) { series = v.series; shown.push([f.label, `Next number from ${v.series} (taken when you click Create)`]); }
        else if (v.value) { body.number = v.value; shown.push([f.label, v.value]); }
        else shown.push([f.label, "(BC default)"]);
        continue;
      }
      if (v === "") { shown.push([f.label, ""]); continue; }
      if (f.kind === "paymentTerms") {
        const pt = (await paymentTermsLookup()).find(x => String(x.code).toUpperCase() === v.toUpperCase());
        if (!pt) throw new Error(`Payment terms ${v} does not exist in this company in BC.`);
        body.paymentTermsId = pt.id;
        const t = (SETTINGS.paymentTerms || []).flatMap(g => g.terms).find(x => x.code === v);
        shown.push([f.label, t ? `${v} – ${t.desc}` : v]); continue;
      }
      if (f.kind === "emails") {
        const list = v.split(";").map(x => x.trim()).filter(Boolean);
        const bad = list.filter(x => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
        if (bad.length) throw new Error("Email not valid: " + bad.join(", "));
        body.email = list.join(";"); shown.push([f.label, body.email]); continue;
      }
      body[f.key] = f.type === "number" ? Number(v) : (f.upper ? v.toUpperCase() : v);
      shown.push([f.label, String(body[f.key])]);
    }
    // duplicate checks against what is already in BC
    const warnings = [];
    try {
      const existing = await lookups[def.endpoint]();
      if (body.number && existing.some(r => String(r.number).toUpperCase() === body.number.toUpperCase()))
        throw new Error(`${def.fields[0].label} ${body.number} already exists in BC.`);
      const same = existing.filter(r => body.displayName && normName(r.displayName) === normName(body.displayName));
      if (same.length) warnings.push(`A ${def.singular} with the same name already exists: ${same.map(r => r.number).join(", ")}`);
    } catch (e) { if (/already exists/.test(e.message)) throw e; }
    return { body, series, shown, warnings };
  }

  function showPreview(p) {
    previewCard.replaceChildren(
      h("div", { class: "card-head" }, h("h2", {}, `Preview – new ${def.singular}`),
        h("span", { class: "tag" }, "Nothing is written to BC until you click Create")),
      h("div", { class: "muted small", style: "margin-bottom:.5rem" }, "Company: " + companyName()),
      ...p.warnings.map(w => h("div", { style: "margin-bottom:.4rem" }, h("span", { class: "tag warn" }, "Check"), " ", w)),
      h("div", { class: "tablewrap" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Field"), h("th", {}, "Value written to BC"))),
        h("tbody", {}, p.shown.map(([k, v]) => h("tr", {}, h("td", {}, k),
          h("td", { class: "wrap" }, v === "" ? h("span", { class: "muted" }, "(empty)") : v)))))),
      h("div", { class: "row-actions" },
        h("button", { type: "button", class: "ghost", onclick: backToEdit }, "← Back to edit"),
        createBtn));
    form.classList.add("hidden"); previewCard.classList.remove("hidden");
  }
  function backToEdit() { previewCard.classList.add("hidden"); form.classList.remove("hidden"); }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    btn.disabled = true; setStatus("Checking...");
    try {
      pending = await collect();
      showPreview(pending);
      setStatus(pending.warnings.length ? "Preview ready – please check the notes, then Create or go back." : "Preview ready. Check it, then click Create.", pending.warnings.length ? "warn" : "ok");
    } catch (e) { setStatus("Error: " + e.message, "err"); }
    finally { btn.disabled = false; }
  });

  const createBtn = h("button", { type: "button", onclick: create }, "Create in BC");
  async function create() {
    if (!pending) return;
    createBtn.disabled = true; setStatus("Creating " + def.singular + "...");
    try {
      const body = { ...pending.body };
      if (pending.series) { setStatus(`Taking the next number from ${pending.series}...`); body.number = await nextNumberFrom(pending.series); }
      const rec = await co(`/${def.endpoint}`, { method: "POST", body: JSON.stringify(body) });
      setStatus(`Created ${def.singular} ${rec.number} - ${rec.displayName}`, "ok");
      Object.values(controls).forEach(c => c.reset());
      pending = null; backToEdit();
      clearCache(def.endpoint);
      refresh();
    } catch (e) { setStatus("Error: " + e.message, "err"); }
    finally { createBtn.disabled = false; }
  }

  async function refresh() {
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      const data = await co(`/${def.endpoint}?$top=50&$orderby=lastModifiedDateTime desc`);
      renderTable(listBox, def.columns, data.value);
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load list: " + e.message)); }
  }
  refreshers[key] = refresh;

  return h("div", {},
    h("div", { class: "card" }, h("h2", {}, "Create " + def.singular), form),
    previewCard,
    h("div", { class: "card" }, h("h2", {}, "Latest " + def.title),
      h("div", { class: "row-actions" }, h("button", { type: "button", class: "ghost", onclick: refresh }, "Refresh")),
      listBox)
  );
}

/* ---------- text / period helpers ---------- */
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const MONTH_NAMES = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const round5 = n => Math.round(n * 1e5) / 1e5;
const fmtNum = n => Number(Number(n).toFixed(5)).toLocaleString(undefined, { maximumFractionDigits: 5 });
function longDate(iso)  { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTH_NAMES[m - 1]} ${y}`; }
function shortDate(iso) { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; }
const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

/* st = { yy, from, to, style } -> [{label}] ; style "none" = no period text */
function periodsFor(st) {
  const yy = String(st.yy).padStart(2, "0");
  const lab = (a, b) => a === b ? `${MONTHS[a]} ${yy}` : `${MONTHS[a]}-${MONTHS[b]} ${yy}`;
  const out = [];
  if (st.style === "none") return [{ label: "" }];
  if (st.from > st.to) return out;
  if (st.style === "single") out.push({ label: lab(st.from, st.to) });
  else if (st.style === "quarterly") for (let m = st.from; m <= st.to; m += 3) out.push({ label: lab(m, Math.min(m + 2, st.to)) });
  else for (let m = st.from; m <= st.to; m++) out.push({ label: lab(m, m) });
  return out;
}
/* "MALAYSIA SOLAR RECS V26 (TIGR)" -> "TIGR" (matched against the registry list) */
function registryFromText(t) {
  const m = String(t || "").match(/\(([^()]+)\)\s*$/);
  if (!m) return "";
  const n = normName(m[1]);
  return REGISTRIES.find(r => normName(r) === n) || "";
}
function vintageFrom(item) {
  const m = String(item.displayName || "").match(/\bV(\d{2})\b/) || String(item.number || "").match(/_V(\d{2})$/i);
  return m ? m[1] : "";
}
/* SO: ID -> part numbers. Uses the last 5 (or 4) digits of the ID and, if given, the 2-digit year. */
function matchItemsById(id, yy, items) {
  const m = String(id || "").match(/(\d+)\D*$/);
  if (!m) return [];
  const tail = m[1];
  const keys = new Set([tail.slice(-5), tail.slice(-4)].filter(k => k.length >= 4).map(Number));
  const y = String(yy || "").trim().slice(-2);
  return items.filter(it => {
    const num = String(it.number || "");
    const d = num.match(/\d+/);
    if (!d || !keys.has(Number(d[0]))) return false;
    return !y || new RegExp(`_V${y}$`, "i").test(num);
  });
}

/* ---------- comment lines (templates from presets.js) ---------- */
const TOKEN = /\{(\w+):([^}=]+)(?:=([^}]*))?\}/g;
function makeCommentRow(onRemove, onMove) {
  const row = {};
  const tplSel = h("select", {}, COMMENT_TEMPLATES.map((t, i) => h("option", { value: i }, t.label || t.text)));
  const fieldsBox = h("div", { class: "grid", style: "margin-top:.4rem" });
  const out = h("input", { maxlength: "100", placeholder: "Comment text" });
  const hint = h("div", { class: "muted small" });
  let edited = false, fields = [];
  out.addEventListener("input", () => { edited = true; resetBtn.classList.remove("hidden"); });
  const resetBtn = h("button", { type: "button", class: "ghost small hidden", title: "Rebuild text from the boxes",
    onclick: () => { edited = false; resetBtn.classList.add("hidden"); regen(); } }, "↺");

  function fmt(f) {
    const v = f.el.value.trim();
    if (!v) return "";
    if (f.type === "percent") return v.replace(/%$/, "") + "%";
    if (f.type === "date") return shortDate(v);
    if (f.type === "longdate") return longDate(v);
    return v;
  }
  function regen() {
    const tpl = COMMENT_TEMPLATES[tplSel.value];
    let i = 0;
    if (!edited) out.value = tpl.text.replace(TOKEN, () => { const f = fields[i++]; return fmt(f) || `(${f.label})`; });
    hint.textContent = "";
    if (tpl.hint === "fx") {
      const nums = fields.filter(f => f.type === "number").map(f => Number(f.el.value));
      if (nums[0] > 0 && nums[1] > 0) hint.textContent = `${nums[0]} × ${nums[1]} = ${round5(nums[0] * nums[1])} per unit`;
    }
  }
  function build() {
    const tpl = COMMENT_TEMPLATES[tplSel.value];
    fields = [...tpl.text.matchAll(TOKEN)].map(([, type, label, def]) => {
      let el;
      if (type === "date" || type === "longdate") el = h("input", { type: "date" });
      else if (type === "registry") el = h("select", {}, h("option", { value: "" }, "(choose)"), REGISTRIES.map(r => h("option", { value: r }, r)));
      else if (type === "number" || type === "percent") el = h("input", { type: "number", step: "any", min: "0", value: def });
      else el = h("input", { value: def, maxlength: "100" });
      el.addEventListener("input", regen); el.addEventListener("change", regen);
      return { type, label, el };
    });
    fieldsBox.replaceChildren(...fields.map(f => h("label", {}, f.label + (f.type === "percent" ? " (%)" : ""), f.el)));
    edited = false; resetBtn.classList.add("hidden");
    regen();
  }
  tplSel.addEventListener("change", build);

  row.box = h("div", { class: "comment-row" },
    h("div", { class: "block-head" },
      h("label", { class: "grow" }, "Comment", tplSel),
      h("button", { type: "button", class: "ghost small", title: "Move up", onclick: () => onMove(row, -1) }, "↑"),
      h("button", { type: "button", class: "ghost small", title: "Move down", onclick: () => onMove(row, 1) }, "↓"),
      h("button", { type: "button", class: "ghost small", title: "Remove", onclick: () => onRemove(row) }, "✕")),
    fieldsBox,
    h("label", { style: "margin-top:.4rem" }, "Text written to BC (you can edit it)",
      h("div", { style: "display:flex;gap:.4rem;align-items:center" }, out, resetBtn)),
    hint);
  row.text = () => out.value.trim();
  row.validate = () => {
    if (!row.text()) return "A comment line is empty.";
    if (!edited && fields.some(f => !f.el.value.trim())) return `Fill in the boxes of comment "${COMMENT_TEMPLATES[tplSel.value].label}".`;
    return null;
  };
  build();
  return row;
}

/* a list of comment rows with its own "+ Add comment" button (used per item and at the bottom) */
function makeCommentList(buttonText) {
  const rows = [], box = h("div", {});
  function add() {
    const row = makeCommentRow(
      r => { rows.splice(rows.indexOf(r), 1); r.box.remove(); },
      (r, dir) => {
        const i = rows.indexOf(r), j = i + dir;
        if (j < 0 || j >= rows.length) return;
        [rows[i], rows[j]] = [rows[j], rows[i]];
        box.replaceChildren(...rows.map(c => c.box));
      });
    rows.push(row); box.append(row.box);
  }
  return {
    box, add,
    btn: h("button", { type: "button", class: "ghost small", onclick: add }, buttonText),
    validate: () => rows.map(r => r.validate()).filter(Boolean),
    lines: () => rows.map(r => ({ lineType: "Comment", description: r.text() })),
    clear() { rows.length = 0; box.replaceChildren(); }
  };
}

    function fxComment() {
      const vals = [fxCur.value.trim() || "(currency)", fxPrice.value.trim() || "(price)", fxRate.value.trim() || "(rate)", longDate(fxDate.value) || "(date)"];

      return fxTpl ? fxTpl.text.replace(TOKEN, () => vals[i++] ?? "")

    function fxUpdate() {
      const on = fxChk.checked;

    const periodWrap = h("div", {});

    function applyItem(r) {

    }
    const descFor = label => label ? `${base.value.trim()} - ${label}` : base.value.trim();
    const ticked = () => periodsFor(st).filter(x => !st.unticked.has(x.label));

    function redraw() {
      st.yy = Number(yy.value) || 0; st.from = Number(fromSel.value); st.to = Number(toSel.value); st.style = styleSel.value;
      [yy, fromSel, toSel].forEach(e => e.closest("label").classList.toggle("hidden", st.style === "none"));
      periodWrap.classList.toggle("hidden", st.style === "none");

      periodsBox.replaceChildren(...(ps.length ? ps.map(x => {
        const cb = h("input", { type: "checkbox", checked: !st.unticked.has(x.label) });
        cb.addEventListener("change", () => { cb.checked ? st.unticked.delete(x.label) : st.unticked.add(x.label); drawPreview(); });
        return h("label", { class: "chk" }, cb, x.label);

      drawPreview();

    function drawPreview() {
      const rows = ticked();
      if (!rows.length) { preview.replaceChildren(h("p", { class: "muted small" }, "No periods ticked.")); return; }
      preview.replaceChildren(h("table", { class: "lines" },

      h("div", { class: "grid" },
        h("label", {}, "Part no.", item.el),

        h("label", {}, "Registry", rl.reg),
        h("label", {}, "Location", rl.loc)),

        h("label", {}, "To", toSel),
        h("label", {}, def.priceLabel, cost)),
      fxSection,
      periodWrap,
      h("div", { style: "margin-top:.5rem" }, preview),
      h("div", { class: "sub" }, "Comments under this item"),
      itemComments.box,
      itemComments.btn);
    redraw();

    blk.refresh = drawPreview;
    blk.items = () => [item.value];
    blk.validate = () => {
      if (!item.value) return "Every item needs a part no.";

      const long = ticked().map(x => (st.over[x.label] || {}).desc ?? descFor(x.label)).find(d => d.length > 100);
      if (long) return `Description too long (max 100): ${long}`;
      if (fxAllowed && fxChk.checked) {
        if (!(Number(fxPrice.value) > 0) || !(Number(fxRate.value) > 0) || !fxDate.value) return `${item.value}: fill in currency price, BNM rate and rate date.`;

    blk.lines = () => {

  /* SO line: find the part no. directly, or from an ID (last 4-5 digits + year) */
  function addSoLine(pre) {
    const blk = { box: h("div", { class: "block" }) };

    const o = {};
    const item = searchBox({ placeholder: "Search part no. or description", source: lookups.items, extra: r => r.baseUnitOfMeasureCode,
      onPick: r => { if (r) applyItem(r); } });
    const idIn = h("input", { placeholder: "Paste ID" });
    const idYear = h("input", { type: "number", min: "0", max: "99", placeholder: "e.g. 25" });

    const vatBox = h("span", {});
    function drawVat() { vatBox.replaceChildren(lineVatSelect(o)); }

    function applyItem(r) { desc.value = r.displayName || ""; rl.set(registryFromText(r.displayName)); }
    let t;
    async function findById() {
      const id = idIn.value.trim();
      if (!id) { idResult.replaceChildren(); return; }
      idResult.replaceChildren(h("span", { class: "muted" }, "Searching..."));
      let found;
      try { found = matchItemsById(id, idYear.value, await lookups.items()); }
      catch (e) { idResult.replaceChildren(h("span", { class: "tag warn" }, "Could not load items: " + e.message)); return; }
      if (!found.length) {
        idResult.replaceChildren(h("span", { class: "tag warn" }, "Not created in BC yet"), " ",
          h("button", { type: "button", class: "ghost small", onclick: () => showTab("items") }, "Create it in Part Number tab"));
        return;
      }
      const choose = r => { item.set(r.number); applyItem(r); idResult.replaceChildren(h("span", { class: "tag ok" }, "Found: " + r.number)); };
      if (found.length === 1) { choose(found[0]); return; }
      idResult.replaceChildren(h("span", { class: "muted" }, `${found.length} matches – pick one: `),
        ...found.slice(0, 12).map(r => h("button", { type: "button", class: "ghost small", style: "margin:.15rem", title: r.displayName,
          onclick: () => choose(r) }, r.number)));
    }
    [idIn, idYear].forEach(e => e.addEventListener("input", () => { clearTimeout(t); t = setTimeout(findById, 300); }));

    blk.box.append(
      h("div", { class: "block-head" }, h("strong", { class: "grow" }, "Line"),
        h("button", { type: "button", class: "ghost small", onclick: () => removeBlock(blk) }, "✕ Remove")),
      h("div", { class: "grid" },
        h("label", {}, "Find by ID (last 4–5 digits)", idIn),
        h("label", {}, "Year (2 digits, optional)", idYear),
        h("label", { class: "span2" }, "…or part no.", item.el)),
      idResult,
      h("div", { class: "grid", style: "margin-top:.6rem" },
        h("label", { class: "span2" }, "Description", desc),
        h("label", {}, "Registry", rl.reg),
        h("label", {}, "Location", rl.loc),
        h("label", {}, "Quantity", qty),
        h("label", {}, def.priceLabel, price),
        h("label", {}, "VAT group", vatBox)),

    blk.refresh = drawVat;
    blk.items = () => [item.value];
    blk.validate = () => {

      if (ce.length) return `${item.value}: ${ce[0]}`;
      return null;
    };
    blk.lines = () => [{ lineType: "Item", item: item.value, description: desc.value.trim(), qty: qty.value.trim(), cost: price.value.trim(),
                         locationCode: rl.loc.value.trim(), vat: o.vat || orderVat.value, dims: DIMENSIONS },
                       ...itemComments.lines()];
    blk.isEmpty = () => !item.value && !qty.value && !price.value;
    if (pre) {
      item.set(pre.rec.number); applyItem(pre.rec);
      if (pre.qty) qty.value = pre.qty;
      if (pre.price) price.value = pre.price;
      if (pre.id) idIn.value = pre.id;
    }
    blocks.push(blk); blocksBox.append(blk.box);
  }
  const addBlock = isPO ? addPoBlock : addSoLine;

  /* ---- SO: paste a list from Excel (ID or part no. | quantity | unit price) ---- */
  const pasteBox = h("div", { class: "fx hidden" });
  const pasteToggle = isPO ? "" : h("button", { type: "button", class: "ghost",
    onclick: () => { pasteBox.classList.toggle("hidden"); if (!pasteBox.classList.contains("hidden")) pasteBox.querySelector("textarea").focus(); } },
    "📋 Paste from Excel");
  if (!isPO) {
    const ta = h("textarea", { rows: "6", spellcheck: "false",
      placeholder: "Copy rows from Excel and paste here.\nColumns: ID or part no.  |  Quantity  |  " + def.priceLabel + "   (quantity and price are optional)" });
    const pYear = h("input", { type: "number", min: "0", max: "99", placeholder: "e.g. 25" });
    const results = h("div", { style: "margin-top:.6rem" });
    const toNum = v => { const x = String(v || "").replace(/,/g, "").trim(); return x !== "" && !isNaN(Number(x)) ? x : ""; };
    let checked = [];

    async function check() {
      const rows = ta.value.split(/\r?\n/).map(l => l.split("\t").map(c => c.trim())).filter(c => c[0]);
      // skip a header row such as "ID | Quantity | Price"
      if (rows.length && (/^(id|part\s*no\.?|part\s*number|item|no\.?)$/i.test(rows[0][0]) || rows[0].slice(1).some(c => c && toNum(c) === ""))) rows.shift();
      if (!rows.length) { results.replaceChildren(h("p", { class: "muted small" }, "Nothing to check – paste some rows first.")); return; }
      results.replaceChildren(h("p", { class: "muted small" }, "Checking..."));
      let items;
      try { items = await lookups.items(); }
      catch (e) { results.replaceChildren(h("p", { class: "tag warn" }, "Could not load items: " + e.message)); return; }
      checked = rows.map(c => {
        const val = c[0];
        const exact = items.find(i => String(i.number).toLowerCase() === val.toLowerCase());
        const matches = exact ? [exact] : matchItemsById(val, pYear.value, items);
        return { val, qty: toNum(c[1]), price: toNum(c[2]), matches, pick: matches.length === 1 ? matches[0] : null };
      });
      drawResults();
    }
    function drawResults() {
      const nFound = checked.filter(r => r.pick).length;
      const nMulti = checked.filter(r => !r.pick && r.matches.length > 1).length;
      const nNone = checked.filter(r => !r.matches.length).length;
      const addBtn = h("button", { type: "button", disabled: !nFound, onclick: addFound }, `Add ${nFound} found line(s)`);
      const copyBtn = h("button", { type: "button", class: "ghost", disabled: !nNone, onclick: copyNotFound }, "Copy not-found list");
      results.replaceChildren(
        h("div", { class: "small", style: "margin-bottom:.4rem" },
          h("span", { class: "tag ok" }, `${nFound} found`),
          nMulti ? h("span", { class: "tag warn" }, `${nMulti} need a choice`) : "",
          nNone ? h("span", { class: "tag warn" }, `${nNone} not created in BC yet`) : ""),
        h("div", { class: "tablewrap" }, h("table", { class: "lines" },
          h("thead", {}, h("tr", {}, ["#", "Pasted", "Status", "Part no.", "Description", "Quantity", def.priceLabel].map(t => h("th", {}, t)))),
          h("tbody", {}, checked.map((r, i) => {
            let status, partCell;
            if (r.pick) {
              status = h("span", { class: "tag ok" }, "✓ Found");
              partCell = r.matches.length > 1 ? null : r.pick.number;
            } else if (r.matches.length > 1) status = h("span", { class: "tag warn" }, `${r.matches.length} matches`);
            else status = h("span", { class: "tag warn" }, "✕ Not created in BC yet");
            if (r.matches.length > 1) {
              partCell = h("select", {}, h("option", { value: "" }, "(choose)"),
                r.matches.map(m => h("option", { value: m.number, selected: r.pick === m }, m.number)));
              partCell.addEventListener("change", () => { r.pick = r.matches.find(m => m.number === partCell.value) || null; drawResults(); });
            }
            return h("tr", {}, h("td", {}, i + 1), h("td", {}, r.val), h("td", {}, status), h("td", {}, partCell || "–"),
              h("td", { class: "wrap" }, r.pick ? r.pick.displayName || "" : ""), h("td", { class: "num" }, r.qty || "–"), h("td", { class: "num" }, r.price || "–"));
          })))),
        h("div", { class: "row-actions" }, addBtn, copyBtn,
          nNone ? h("button", { type: "button", class: "ghost", onclick: () => showTab("items") }, "Go to Part Number tab") : ""));
    }
    function addFound() {
      const picked = checked.filter(r => r.pick);
      blocks.filter(b => b.isEmpty && b.isEmpty()).forEach(removeBlock);      // drop the empty starter line
      picked.forEach(r => addSoLine({ rec: r.pick, qty: r.qty, price: r.price, id: r.pick.number.toLowerCase() === r.val.toLowerCase() ? "" : r.val }));
      const left = checked.length - picked.length;
      setStatus(`Added ${picked.length} line(s) from the pasted list.` + (left ? ` ${left} row(s) were not added (not found or not chosen).` : ""), left ? "warn" : "ok");
      checked = checked.filter(r => !r.pick);
      if (checked.length) drawResults(); else { ta.value = ""; results.replaceChildren(); pasteBox.classList.add("hidden"); }
    }
    function copyNotFound() {
      const list = checked.filter(r => !r.matches.length).map(r => r.val).join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(list) : Promise.reject())
        .then(() => setStatus("Not-found list copied – paste it into Excel.", "ok"))
        .catch(() => { ta.value = list; ta.select(); setStatus("Could not copy automatically – the list is selected in the box, press Ctrl+C.", "warn"); });
    }
    pasteBox.append(
      h("h2", {}, "Paste from Excel"),
      ta,
      h("div", { class: "grid", style: "margin-top:.5rem" },
        h("label", {}, "Year for IDs (2 digits, optional)", pYear),
        h("div", { class: "row-actions", style: "margin:0" },
          h("button", { type: "button", onclick: check }, "Check against BC"),
          h("button", { type: "button", class: "ghost", onclick: () => { ta.value = ""; checked = []; results.replaceChildren(); } }, "Clear"))),
      results);

  /* ---- comments at the bottom of the order ---- */
  const bottomComments = makeCommentList("+ Add comment");

  function resetForm() {

  const previewBtn = h("button", { type: "submit" }, "Preview");

    h("div", { class: "grid" },

  /* ---- preview ---- */
  const previewCard = h("div", { class: "card hidden preview" });
  let plan = null;

  async function buildPlan() {
    const errs = [];
    if (!party.value) errs.push(`Choose a ${def.partyLabel.toLowerCase()}.`);
    if (!orderVat.value) errs.push("Choose the VAT Bus. Posting Group for the order.");
    if (!blocks.length) errs.push("Add at least one line.");
    blocks.forEach(b => { const e = b.validate(); if (e) errs.push(e); });
    errs.push(...bottomComments.validate());
    if (errs.length) throw new Error(errs.join(" "));

    const [parties, items, locations, extOk] = await Promise.all([
      lookups[def.partyLookup](), lookups.items(), lookups.locations().catch(() => []), lineExtAvailable(key)]);
    const partyRec = parties.find(r => (r.number || "").toLowerCase() === party.value.toLowerCase());
    if (!partyRec) throw new Error(`${def.partyLabel} "${party.value}" not found. Pick one from the search list.`);
    const itemMap = new Map(items.map(i => [String(i.number).toLowerCase(), i]));
    let dims = { plan: [], problems: [] };
    try { dims = await resolveDims(DIMENSIONS); } catch (e) { dims.problems.push("Dimensions: " + e.message); }
    const missing = [...new Set(blocks.flatMap(b => b.items()))].filter(n => !itemMap.has(n.toLowerCase()));
    if (missing.length) throw new Error("Part no. not found in BC: " + missing.join(", "));

    const lines = [
      ...blocks.flatMap(b => b.lines()).map(l => {
        if (l.lineType === "Comment") return { ...l, flags: [] };
        const it = itemMap.get(l.item.toLowerCase());
        const flags = [];
        if (!(Number(l.qty) > 0)) flags.push("qty pending");
        if (l.cost === "") flags.push(`no ${def.priceLabel.toLowerCase()}`);
        let locationId = null;
        if (l.locationCode) {
          const loc = locations.find(x => (x.code || "").toLowerCase() === l.locationCode.toLowerCase());
          if (loc) locationId = loc.id; else flags.push(`location ${l.locationCode} not in BC`);
        } else flags.push("no location");
        if (!extOk) flags.push("VAT group to set in BC");
        if (it.blocked === true) flags.push("item blocked");
        return { ...l, item: it.number, uom: it.baseUnitOfMeasureCode || "", locationId, flags };
      }),
      ...bottomComments.lines().map(c => ({ ...c, flags: [] }))
    ];
    return { partyRec, extOk, lines, dimPlan: dims.plan, dimProblems: dims.problems,
      header: { [def.partyKey]: partyRec.number, ...(date.value ? { orderDate: date.value } : {}),
                ...(ext && ext.value.trim() ? { [def.extKey]: ext.value.trim() } : {}) } };
  }

  function showPreview(p) {
    const items = p.lines.filter(l => l.lineType === "Item");
    const amt = l => Math.round(num(l.qty) * num(l.cost) * 100) / 100;   // BC rounds line amounts to 2 decimals
    const total = items.reduce((s, l) => s + amt(l), 0);
    const totalQty = items.reduce((s, l) => s + num(l.qty), 0);
    const dimText = Object.entries(DIMENSIONS).map(([k, v]) => `${k} ${v}`).join(" · ");
    previewCard.replaceChildren(
      h("div", { class: "card-head" }, h("h2", {}, `Preview – draft ${def.title.replace(/s$/, "")}`),
        h("span", { class: "tag" }, "Nothing is written to BC until you click Save")),
      h("div", { class: "party-info", style: "margin:0 0 .75rem" },
        h("div", {}, h("b", {}, `${p.partyRec.number} — ${p.partyRec.displayName || ""}`)),
        h("div", {}, `Company: ${companyName()} · Order date: ${date.value || "(today)"} · VAT group: ${orderVat.value}` +
          (ext && ext.value.trim() ? ` · ${def.extLabel.replace(/ \(optional\)/, "")}: ${ext.value.trim()}` : "")),
        dimText ? h("div", { class: "muted" }, "Dimensions: " + [
          ...Object.entries(SETTINGS.headerDimensionNames || {}).map(([k, n]) => `${n} ${(SETTINGS.headerDimensions || {})[k] || "-"} (header)`),
          ...p.dimPlan.map(d => `${d.code} ${d.valueCode}`)].join(" · ")) : "",
        ...p.dimProblems.map(x => h("div", {}, h("span", { class: "tag warn" }, "Dimension will not be set"), " ", x))),
      h("div", { class: "tablewrap" }, h("table", {},
        h("thead", {}, h("tr", {}, ["#", "Type", "No.", "Description", "Location", "Quantity", "UoM", def.priceLabel, "Line amount", "VAT group", "Check"].map(t => h("th", {}, t)))),
        h("tbody", {}, p.lines.map((l, i) => l.lineType === "Comment"
          ? h("tr", { class: "comment" }, h("td", {}, i + 1), h("td", {}, "Comment"), h("td", {}, ""), h("td", { colspan: 8, class: "wrap" }, l.description), h("td", {}, ""))
          : h("tr", {},
              h("td", {}, i + 1), h("td", {}, "Item"), h("td", {}, l.item), h("td", { class: "wrap" }, l.description || h("span", { class: "muted" }, "(from item card)")),
              h("td", {}, l.locationCode), h("td", { class: "num" }, l.qty === "" ? "–" : fmtNum(l.qty)), h("td", {}, l.uom),
              h("td", { class: "num" }, l.cost === "" ? "–" : fmtNum(l.cost)), h("td", { class: "num" }, l.qty && l.cost ? amt(l).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "–"),
              h("td", {}, l.vat), h("td", {}, l.flags.length ? l.flags.map(f => h("span", { class: "tag warn" }, f)) : h("span", { class: "tag ok" }, "OK"))))),
        h("tfoot", {}, h("tr", {}, h("td", { colspan: 5, class: "num" }, h("b", {}, "Total")),
          h("td", { class: "num" }, h("b", {}, fmtNum(round5(totalQty)))), h("td", {}, ""),
          h("td", { class: "num muted" }, "excl. VAT"),
          h("td", { class: "num" }, h("b", {}, total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))), h("td", { colspan: 2 }, ""))))),
      h("div", { class: "row-actions" },
        h("button", { type: "button", class: "ghost", onclick: backToEdit }, "← Back to edit"),
        saveBtn));
    form.classList.add("hidden"); previewCard.classList.remove("hidden");
    previewCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function backToEdit() { previewCard.classList.add("hidden"); form.classList.remove("hidden"); }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    previewBtn.disabled = true; setStatus("Checking...");
    try {
      plan = await buildPlan();
      const flagged = plan.lines.filter(l => l.flags.length).length;
      const notes = [flagged ? `${flagged} line(s) have notes` : "", plan.dimProblems.length ? `${plan.dimProblems.length} dimension(s) can't be set` : ""].filter(Boolean).join(", ");
      setStatus(notes ? `Preview ready – ${notes}. Check them, then Save to BC or go back.` : "Preview ready. Check it, then Save to BC.", notes ? "warn" : "ok");
      showPreview(plan);
    } catch (e) { setStatus("Error: " + e.message, "err"); }
    finally { previewBtn.disabled = false; }
  });

  /* ---- writing to BC ---- */
  const lineUrl = (order, line) => `/${def.endpoint}(${order.id})/${def.linesEndpoint}(${line.id})`;
  async function patchLine(order, line, body) {
    await co(lineUrl(order, line), { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify(body) });
  }
  /* Work out, once per order, which BC dimension + value code to use for each wanted dimension.
     A dimension is only used if it really has the wanted value (e.g. Z_NA). */
  async function resolveDims(dims) {
    const plan = [], problems = [];
    const onHeader = Object.values(SETTINGS.headerDimensionNames || {}).map(normName);
    const wanted = Object.entries(dims || {}).filter(([name]) => !onHeader.includes(normName(name)));
    if (!wanted.length) return { plan, problems };
    const all = await lookups.dimensions();
    for (const [name, val] of wanted) {
      const n = normName(name);
      let cands = all.filter(x => normName(x.code) === n || normName(x.displayName) === n || normName(x.code) === n.replace(/code$/, ""));
      if (!cands.length) cands = all.filter(x => normName(x.code).includes(n) || normName(x.displayName).includes(n));
      if (!cands.length) { problems.push(`Dimension "${name}" not found in BC`); continue; }
      let hit = null; const seen = [];
      for (const d of cands) {
        const vals = await cached("dimvals:" + d.id, () => coAll(`/dimensions(${d.id})/dimensionValues?$select=code,displayName`)).catch(() => []);
        const v = vals.find(x => normName(x.code) === normName(val));
        if (v) { hit = { id: d.id, code: d.code, valueCode: v.code }; break; }
        seen.push(`${d.code} (values: ${vals.slice(0, 6).map(x => x.code).join(", ") || "none"}${vals.length > 6 ? ", …" : ""})`);
      }
      if (hit) plan.push(hit);
      else problems.push(`Dimension "${name}": value ${val} not found – checked ${seen.join("; ")}`);
    }
    return { plan, problems };
  }
  async function setDims(order, line, dimPlan, ctx) {
    if (!dimPlan || !dimPlan.length) return;
    let existing;
    try { existing = (await co(lineUrl(order, line) + "/dimensionSetLines")).value; }
    catch (e) { ctx.warnings.push("Dimensions: " + e.message); return; }
    for (const d of dimPlan) {
      const ex = existing.find(x => x.id === d.id || x.code === d.code);
      try {
        if (ex) { if (ex.valueCode !== d.valueCode) await co(`${lineUrl(order, line)}/dimensionSetLines(${ex.id})`, { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify({ valueCode: d.valueCode }) }); }
        else await co(lineUrl(order, line) + "/dimensionSetLines", { method: "POST", body: JSON.stringify({ id: d.id, valueCode: d.valueCode }) });
      } catch (e) { ctx.warnings.push(`Dimension ${d.code} = ${d.valueCode}: ${e.message}`); }
    }
  }

  async function createLine(order, l, ctx) {
    let body;
    if (l.lineType === "Comment") body = { lineType: "Comment", description: l.description };
    else {
      body = { lineType: "Item", lineObjectNumber: l.item };
      if (l.description) body.description = l.description;
      if (l.qty !== "") body.quantity = Number(l.qty);
      if (l.cost !== "") body[def.priceKey] = Number(l.cost);
      if (l.locationId) body.locationId = l.locationId;
    }
    const line = await co(`/${def.endpoint}(${order.id})/${def.linesEndpoint}`, { method: "POST", body: JSON.stringify(body) });
    if (l.lineType === "Comment") return;

    // BC may overwrite description / price from the item card - put ours back
    const fix = {};
    if (body.description && line.description !== body.description) fix.description = body.description;
    if (body[def.priceKey] !== undefined && Math.abs(num(line[def.priceKey]) - body[def.priceKey]) > 1e-9) fix[def.priceKey] = body[def.priceKey];
    if (Object.keys(fix).length) { try { await patchLine(order, line, fix); } catch (e) { ctx.warnings.push(`${l.description || l.item}: ${e.message}`); } }

    await setDims(order, line, ctx.dimPlan, ctx);

    if (l.vat) {
      if (ctx.extOk) {
        try {
          await bcFetch(`${extBase(key)}(${line.id})`, { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify({ vatBusPostingGroup: l.vat }) });
          ctx.vatSet++;
        } catch (e) { ctx.vatPending++; ctx.warnings.push(`VAT group ${l.vat}: ${e.message}`); }
      } else ctx.vatPending++;
    }
  }

  const saveBtn = h("button", { type: "button", onclick: save }, "Save to BC");
  async function save() {
    if (!plan) return;
    saveBtn.disabled = true;
    const ctx = { warnings: [...plan.dimProblems], vatSet: 0, vatPending: 0, extOk: plan.extOk, dimPlan: plan.dimPlan };
    let order = null, done = 0;
    const lines = plan.lines;
    try {
      setStatus("Creating draft...");
      order = await co(`/${def.endpoint}`, { method: "POST", body: JSON.stringify(plan.header) });
      // global dimensions (Cost center / Business line) go on the header; the lines inherit them
      const hd = SETTINGS.headerDimensions || {};
      if (Object.keys(hd).length) {
        setStatus(`Creating ${order.number}: setting header dimensions...`);
        try { await co(`/${def.endpoint}(${order.id})`, { method: "PATCH", headers: { "If-Match": "*" }, body: JSON.stringify(hd) }); }
        catch (e) { ctx.warnings.push("Header dimensions: " + e.message); }
      }
      for (const l of lines) {
        setStatus(`Creating ${order.number}: line ${done + 1} of ${lines.length}...`);
        await createLine(order, l, ctx);
        done++;
      }
      let msg = `Saved draft ${order.number} with ${done} line(s).`;
      if (ctx.vatSet) msg += ` VAT group set on ${ctx.vatSet} line(s).`;
      if (ctx.vatPending) msg += ` VAT group to set in BC on ${ctx.vatPending} line(s).`;
      const w = [...new Set(ctx.warnings)];
      if (w.length) msg += " Warnings: " + w.slice(0, 5).join("; ") + (w.length > 5 ? ` (+${w.length - 5} more)` : "");
      setStatus(msg, w.length || ctx.vatPending ? "warn" : "ok");
      plan = null; resetForm(); backToEdit();
      page = 0; refresh();
    } catch (e) {
      const extra = order ? ` (Draft ${order.number} was created with ${done} of ${lines.length} lines; open it in Business Central to fix or delete it.)` : "";
      setStatus("Error: " + e.message + extra, "err");
      if (order) { plan = null; backToEdit(); refresh(); }
    } finally { saveBtn.disabled = false; }
  }

  /* ---- posting (switched off: CONFIG.features.posting) ---- */
  const qtyLines = o => (o[def.linesEndpoint] || []).filter(l => num(l.quantity) > 0);
  const toStep    = o => qtyLines(o).filter(l => num(l.quantity) > num(l[def.doneQtyKey]));
  const toInvoice = o => qtyLines(o).filter(l => num(l[def.doneQtyKey]) > num(l.invoicedQuantity));
  async function postStep(order, mode, button) {
    const isInv = mode === "invoice";
    const stepName = isInv ? "Invoice" : def.stepLabel;
    if (!confirm(isInv ? `Post the invoice for ${order.number}? This cannot be undone from this portal.` : `${def.stepLabel} ${order.number}?`)) return;
    button.disabled = true; setStatus(`${stepName}: preparing ${order.number}...`);
    try {
      for (const l of qtyLines(order)) {
        const outstanding = num(l.quantity) - num(l[def.doneQtyKey]);
        const uninvoiced  = num(l[def.doneQtyKey]) - num(l.invoicedQuantity);
        await patchLine(order, l, { [def.stepQtyKey]: isInv ? 0 : outstanding });
        await patchLine(order, l, { invoiceQuantity: isInv ? uninvoiced : 0 });
      }
      await co(`/${def.endpoint}(${order.id})/Microsoft.NAV.${def.postAction}`, { method: "POST", headers: { "If-Match": "*" }, body: "{}" });
      setStatus(isInv ? `Invoice posted for ${order.number}.` : `${order.number} ${def.stepPast}.`, "ok");
      refresh(); delete loaded.inventory;
    } catch (e) { setStatus(`Could not ${stepName.toLowerCase()} ${order.number}: ${e.message}`, "err"); button.disabled = false; refresh(); }
  }
  function progressText(o) {
    const lines = qtyLines(o);
    if (!lines.length) return "No lines";
    const q = lines.reduce((s, l) => s + num(l.quantity), 0), d = lines.reduce((s, l) => s + num(l[def.doneQtyKey]), 0), i = lines.reduce((s, l) => s + num(l.invoicedQuantity), 0);
    return h("div", { class: "progress" }, h("div", {}, `${def.stepPast} ${fmtNum(d)} / ${fmtNum(q)}`), h("div", {}, `Invoiced ${fmtNum(i)} / ${fmtNum(q)}`));
  }

  /* ---- list with paging ---- */
  const PAGE_SIZE = 20;
  let page = 0;
  const prevBtn = h("button", { type: "button", class: "ghost small", onclick: () => { if (page > 0) { page--; refresh(); } } }, "‹ Prev");
  const nextBtn = h("button", { type: "button", class: "ghost small", onclick: () => { page++; refresh(); } }, "Next ›");
  const pageInfo = h("span", { class: "muted" });
  const pager = h("div", { class: "row-actions pager" }, prevBtn, pageInfo, nextBtn);
  const extBadge = h("span", { class: "tag" }, "Checking VAT extension...");

  async function vatMissingFor(rows) {
    if (!rows.length || !(await lineExtAvailable(key))) return null;
    try {
      const filter = rows.map(r => `documentNo eq '${String(r.number).replace(/'/g, "''")}'`).join(" or ");
      const d = await bcFetch(`${extBase(key)}?$filter=${encodeURIComponent(filter)}&$select=documentNo,no,type,vatBusPostingGroup`);
      const s = new Set();
      d.value.forEach(l => { if (l.type === "Item" && l.no && !l.vatBusPostingGroup) s.add(l.documentNo); });
      return s;
    } catch { return null; }
  }

  async function refresh() {
    lineExtAvailable(key).then(ok => {
      extBadge.className = "tag " + (ok ? "ok" : "warn");
      extBadge.textContent = ok ? "VAT extension connected" : "VAT extension not found – VAT group to set in BC";
    });
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      prevBtn.disabled = nextBtn.disabled = true;
      const data = await co(`/${def.endpoint}?$top=${PAGE_SIZE + 1}&$skip=${page * PAGE_SIZE}&$orderby=lastModifiedDateTime desc&$expand=${def.linesEndpoint}`);
      if (!data.value.length && page > 0) { page--; return refresh(); }
      const hasNext = data.value.length > PAGE_SIZE;
      const rows = data.value.slice(0, PAGE_SIZE);
      pageInfo.textContent = rows.length ? `Page ${page + 1} · orders ${page * PAGE_SIZE + 1}–${page * PAGE_SIZE + rows.length}` : "";
      prevBtn.disabled = page === 0; nextBtn.disabled = !hasNext;
      const vatMissing = await vatMissingFor(rows);
      const nameKey = def.columns[2][0];
      const extra = [
        { label: "Lines", render: r => String((r[def.linesEndpoint] || []).filter(l => l.lineType === "Item").length) },
        { label: "Notes", render: r => {
          const noQty = (r[def.linesEndpoint] || []).filter(l => l.lineType === "Item" && !(num(l.quantity) > 0)).length;
          const tags = [];
          if (noQty) tags.push(h("span", { class: "tag warn" }, `${noQty} qty pending`));
          if (vatMissing && vatMissing.has(r.number)) tags.push(h("span", { class: "tag warn" }, "VAT group to set in BC"));
          return tags.length ? h("span", {}, tags) : "";
        } }
      ];
      if (CONFIG.features.posting) extra.push(
        { label: "Progress", render: r => progressText(r) },
        { label: "Action", render: r => {
          const stepBtn = h("button", { type: "button", class: "small" }, def.stepLabel);
          const invBtn = h("button", { type: "button", class: "small" }, "Invoice");
          if (toStep(r).length) stepBtn.addEventListener("click", () => postStep(r, "step", stepBtn)); else stepBtn.disabled = true;
          if (toInvoice(r).length) invBtn.addEventListener("click", () => postStep(r, "invoice", invBtn)); else invBtn.disabled = true;
          return h("span", { class: "row-actions", style: "margin:0;flex-wrap:nowrap" }, stepBtn, invBtn);
        } });
      renderTable(listBox, def.columns, rows, extra, { cellClass: (r, k) => k === nameKey ? "wrap" : "" });
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load list: " + e.message)); }
  }
  refreshers[key] = refresh;

  return h("div", {},
    h("div", { class: "card" },
      h("div", { class: "card-head" }, h("h2", {}, "New draft " + def.title.replace(/s$/, "")), extBadge),
      form),
    previewCard,
    h("div", { class: "card" }, h("h2", {}, "Latest " + def.title),
      h("div", { class: "row-actions" }, h("button", { type: "button", class: "ghost", onclick: () => { page = 0; refresh(); } }, "Refresh")),
      listBox, pager)
  );
}


/* ---------- approvals tab (switched off: CONFIG.features.approvals) ---------- */
function approvalBase() {
  const a = CONFIG.approvalApi;
  return `${BC_ROOT}/${a.publisher}/${a.group}/${a.version}/companies(${companyId})/${a.entity}`;
}
function buildApprovals() {
  const a = CONFIG.approvalApi;
  const listBox = h("div", { class: "tablewrap" });
  const kindSel = h("select", {},
    h("option", { value: "" }, "All documents"),
    h("option", { value: "Purchase Order" }, "Purchase orders"),
    h("option", { value: "Sales Order" }, "Sales orders"));
  let rows = [];

  if (!a.publisher) {
    refreshers.approvals = () => {};
    return h("div", {}, h("div", { class: "card" },
      h("h2", {}, "Approvals need one-time setup"),
      h("p", {}, "Approving from this portal requires a custom API page (AL extension) for approval entries."),
      h("p", { class: "muted" }, "Once installed, set ", h("code", {}, "CONFIG.approvalApi.publisher"), " at the top of this file.")));
  }
  function draw() {
    const k = kindSel.value;
    renderTable(listBox,
      [["documentType","Document"],["documentNumber","No."],["senderId","Requested by"],["amount","Amount"],["dueDate","Due"],["status","Status"]],
      rows.filter(r => !k || r.documentType === k),
      [{ label: "Action", render: r => h("span", { class: "row-actions", style: "margin:0" },
          h("button", { type: "button", class: "small", onclick: ev => act(r, a.approveAction, "approve", ev.target) }, "Approve"),
          h("button", { type: "button", class: "small danger", onclick: ev => act(r, a.rejectAction, "reject", ev.target) }, "Reject")) }]);
  }
  kindSel.addEventListener("change", draw);
  async function act(r, action, verb, button) {
    if (!confirm(`${verb[0].toUpperCase() + verb.slice(1)} ${r.documentType} ${r.documentNumber}?`)) return;
    button.disabled = true; setStatus(`Sending ${verb}...`);
    try {
      await bcFetch(`${approvalBase()}(${r.id})/Microsoft.NAV.${action}`, { method: "POST", headers: { "If-Match": "*" }, body: "{}" });
      setStatus(`${r.documentType} ${r.documentNumber}: ${verb} done.`, "ok");
      refresh();
      ["po","so"].forEach(k => refreshers[k] && refreshers[k]());
    } catch (e) { setStatus(`Could not ${verb}: ${e.message}`, "err"); button.disabled = false; }
  }
  async function refresh() {
    try {
      listBox.replaceChildren(h("p", { class: "muted" }, "Loading..."));
      const data = await bcFetch(`${approvalBase()}?$filter=status eq 'Open'&$top=200`);
      rows = data.value; draw();
    } catch (e) { listBox.replaceChildren(h("p", { class: "muted" }, "Could not load approvals: " + e.message)); }
  }
  refreshers.approvals = refresh;
  return h("div", {},
    h("div", { class: "card" }, h("h2", {}, "Pending approvals"),
      h("div", { class: "grid" }, h("label", {}, "Show", kindSel), h("button", { type: "button", class: "ghost", onclick: refresh }, "Refresh"))),
    h("div", { class: "card" }, listBox));
}

/* ---------- tabs ---------- */
const loaded = {};
function showTab(id) {
  if (!TABS.some(t => t.id === id)) id = TABS[0].id;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll("#panels > div").forEach(p => p.classList.toggle("hidden", p.dataset.tab !== id));
  if ((!loaded[id] || id === "inventory" || id === "approvals") && refreshers[id]) { loaded[id] = true; refreshers[id](); }
}
function buildUI(activeId) {
  Object.keys(loaded).forEach(k => delete loaded[k]);
  const tabs = document.getElementById("tabs"), panels = document.getElementById("panels");
  tabs.replaceChildren(); panels.replaceChildren();
  TABS.forEach(t => {
    tabs.append(h("button", { "data-tab": t.id, onclick: () => showTab(t.id) }, t.label));
    const p = t.build(); p.dataset.tab = t.id; p.classList.add("hidden"); panels.append(p);
  });
  showTab(activeId || TABS[0].id);
}
function prefetch() {
  // warm up the search lists in the background
  ["vendors", "items", "customers", "locations", "dimensions"].forEach(k => lookups[k]().catch(() => {}));
  lineExtAvailable("po"); lineExtAvailable("so");
}

/* ---------- start-up after sign-in ---------- */
async function onSignedIn() {
  setStatus("Signed in as " + account.username + ". Loading companies...");
  document.getElementById("btnLogin").classList.add("hidden");
  document.getElementById("btnLogout").classList.remove("hidden");
  try {
    const comps = await bc("/companies");
    if (!comps.value.length) throw new Error("No companies found for this user.");
    const sel = document.getElementById("company");
    sel.replaceChildren(...comps.value.map(c => h("option", { value: c.id }, c.displayName || c.name)));
    sel.classList.remove("hidden");
    companyId = sel.value;
    sel.addEventListener("change", () => {
      const active = document.querySelector("#tabs button.active");
      companyId = sel.value;
      clearCache();
      buildUI(active ? active.dataset.tab : null);
      prefetch();
      setStatus(`Switched to ${companyName()}.`, "ok");
    });
    document.getElementById("app").classList.remove("hidden");
    buildUI();
    prefetch();
    setStatus("Signed in as " + account.username, "ok");
  } catch (e) { setStatus("Error: " + e.message, "err"); }
}

document.getElementById("btnLogin").addEventListener("click", login);
document.getElementById("btnLogout").addEventListener("click", logout);

(async () => {
  try {
    await msalApp.initialize?.();
    const result = await msalApp.handleRedirectPromise();
    if (result && result.account) account = result.account;
    else { const a = msalApp.getAllAccounts(); if (a.length) account = a[0]; }
    if (account) { msalApp.setActiveAccount(account); await onSignedIn(); }
  } catch (e) { setStatus("Sign-in error: " + e.message, "err"); }
})();
</script>
